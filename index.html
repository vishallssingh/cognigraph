    "body": "### 🧠 Visual Mind Map & Structural Diagram\n\n<div class=\"mindmap-container\" style=\"background:#0f172a; border:1px solid #1e293b; padding:15px; border-radius:8px; margin:15px 0;\">\n  <h4 style=\"color:#38bdf8; margin-top:0;\">🗺️ Part I: Union & Its Territory Architecture</h4>\n  <div style=\"display:flex; flex-direction:column; gap:8px;\">\n    <div style=\"background:#1e293b; padding:8px 12px; border-left:4px solid #38bdf8; border-radius:4px;\">\n      <strong style=\"color:#f8fafc;\">Article 1:</strong> India, that is Bharat, shall be a 'Union of States' (Not a Federation of States!).\n    </div>\n    <div style=\"background:#1e293b; padding:8px 12px; border-left:4px solid #fbbf24; border-radius:4px;\">\n      <strong style=\"color:#f8fafc;\">Article 2:</strong> Admission or establishment of NEW states (not part of India existing territory).\n    </div>\n    <div style=\"background:#1e293b; padding:8px 12px; border-left:4px solid #34d399; border-radius:4px;\">\n      <strong style=\"color:#f8fafc;\">Article 3:</strong> Formation of new states, alteration of areas, boundaries, or names of EXISTING states.\n    </div>\n    <div style=\"background:#1e293b; padding:8px 12px; border-left:4px solid #a855f7; border-radius:4px;\">\n      <strong style=\"color:#f8fafc;\">Article 4:</strong> Laws under Art 2 & 3 require SIMPLE MAJORITY in Parliament; NOT Art 368 amendments!\n    </div>\n  </div>\n</div>\n\n---\n\n### ⚡ 1. Beginner Jargon Unpack\n- **Union of States:** Dr. Ambedkar clarified that 'Union' was preferred over 'Federation' because the Indian federation is not the result of an agreement among states, and no state has the right to secede.\n- **Indestructible Union of Destructible States:** Parliament can alter state boundaries without state consent, but states cannot alter Union boundaries or secede.\n\n---\n\n### 📖 2. Layer 1: Article 1 to 4 Master Breakdown\n| Article | Constitutional Mandate | Key Requirement / Constraint |\n|---|---|---|\n| **Article 1** | Name & Territory of Union | Specifies 3 categories: Territories of States, UTs, Acquired Territories |\n| **Article 2** | Admission of New States | Parliament power to admit territories outside existing India |\n| **Article 3** | Internal Reorganisation | Requires Presidential recommendation + State Assembly view consultation (View NOT binding!) |\n| **Article 4** | Simple Majority Exemption | Explicitly excludes Art 2 & 3 laws from Article 368 procedural rigidity |\n\n<div class=\"exam-highlight-box\">\n  <h4>🏷️ Itemized Verification Tag</h4>\n  ✅ <strong>Verified Feb 2026 (Itemized):</strong> Articles 1-4 & Berubari Union 1960 ceding procedure verified against Constitution text & SC Reports.\n</div>\n\n---\n\n### 🧠 3. Layer 2: Underlying Reasoning (\"The Why\")\nWhy does Article 3 require **Presidential Consultation** with state legislatures, but makes their opinion **NOT binding**?\n1. Framers recognized that regional linguistic chauvinism could block national integration.\n2. Giving states a veto would prevent rational economic and administrative state reorganization.\n\n---\n\n### 🧮 4. Layer 3: Worked Application (Practical Governance Scenario)\n**Scenario:** India agrees to cede a small border enclave to a neighboring nation under an international boundary treaty.\n\n**Step-by-Step Resolution:**\n1. Under *Berubari Union Case (1960)*, Supreme Court held that Parliament's power to alter boundaries under Article 3 does NOT include the power to cede Indian territory to a foreign country.\n2. Ceding Indian territory requires a **Constitutional Amendment under Article 368** (e.g. 100th CAA 2015 for India-Bangladesh enclaves exchange).\n\n---\n\n### 🏛️ 5. Concrete Anchor (Case Study)\n**Re Berubari Union (1960) & 100th CAA (2015):** 100th CAA amended the 1st Schedule to exchange 111 enclaves to Bangladesh in return for 51 enclaves.\n\n---\n\n### ⚖️ 6. Debates & Controversies\n**Ceding Territory vs Boundary Adjustment:**\n- *The Controversy:* Minor boundary adjustments can be made via executive agreement (*Ram Kishore Sen 1966*), but actual territory cession requires Article 368.\n- *Phase 2 Core Question:* \"Article 3 makes the Indian Parliament the master of internal political geography.\" Discuss.\n\n---\n\n### ❓ 7. 3-Tier Practice & Retention Section\n- **Tier 1 (Recall MCQ):** Reorganisation of states under Article 3 requires: (A: Special Majority + State Consent, **B: Simple Majority + Non-binding State View**, C: 3/4th Majority) [Correct: B].\n- **Tier 2 (Applied Scenario):** Differentiate between Article 2 and Article 3 powers.\n- **Tier 3 (Mains Prompt):** *'India is an indestructible union of destructible states.'* Examine."

    "truth": "The Governor is the Constitutional Head of State under Article 153 and vital link of Cooperative Federalism between Union and State.",
    "body": "### 🧠 Visual Mind Map & Structural Diagram\n\n<div class=\"mindmap-container\" style=\"background:#0f172a; border:1px solid #1e293b; padding:15px; border-radius:8px; margin:15px 0;\">\n  <h4 style=\"color:#38bdf8; margin-top:0;\">🗺️ Governor & Rajasthan State Executive Architecture</h4>\n  <div style=\"display:flex; flex-direction:column; gap:8px;\">\n    <div style=\"background:#1e293b; padding:8px 12px; border-left:4px solid #38bdf8; border-radius:4px;\">\n      <strong style=\"color:#f8fafc;\">Constitutional Baseline (Art 152–162):</strong> Executive power of State vested in Governor (Art 154). Appointed by President (Art 155) during pleasure (Art 156).\n    </div>\n    <div style=\"background:#1e293b; padding:8px 12px; border-left:4px solid #fbbf24; border-radius:4px;\">\n      <strong style=\"color:#f8fafc;\">Rajpramukh to Governor Transition in Rajasthan:</strong> Post of <i>Rajpramukh</i> (Sawai Man Singh II of Jaipur, 1949–1956) abolished by 7th CAA 1956. <b>Gurumukh Nihal Singh</b> became 1st Governor of Rajasthan on Nov 1, 1956.\n    </div>\n    <div style=\"background:#1e293b; padding:8px 12px; border-left:4px solid #34d399; border-radius:4px;\">\n      <strong style=\"color:#f8fafc;\">Discretionary Powers (Art 163):</strong> Constitutional discretion under Art 163(1) is WIDER than President! Includes reservation of bills for President (Art 200), recommending President's Rule (Art 356), and selecting CM in hung assembly.\n    </div>\n    <div style=\"background:#1e293b; padding:8px 12px; border-left:4px solid #a855f7; border-radius:4px;\">\n      <strong style=\"color:#f8fafc;\">Legislative & Pardoning Powers:</strong> Promulgates Ordinances (Art 213). Pardoning power under Art 161 (Cannot pardon death sentence, unlike President under Art 72!).\n    </div>\n  </div>\n</div>\n\n---\n\n### ⚡ 1. Beginner Jargon Unpack\n- **Pleasure of President (Art 156):** Governor holds office at the pleasure of the President (no fixed 5-year tenure security, though 5 years is standard; *BP Singhal v. UOI 2010* held removal cannot be arbitrary).\n- **Rajpramukh:** Institutional title of Head of State during Rajasthan Integration (1949–1956) before 7th CAA replaced it with Governor.\n- **Article 200 Options:** 4 choices on State Bill: Assent, Withhold assent, Return for reconsideration, or Reserve for President's consideration.\n\n---\n\n### 📖 2. Layer 1: Rajasthan Governors Landmark & Article Matrix\n| Constitutional Feature / Milestone | Article / Act / Person | High-Yield Fact / RPSC Detail |\n|---|---|---|\n| **Appointment & Qualification** | Articles 155 & 157 | Citizen of India, 35 years age, not MP/MLA, holds no office of profit |\n| **First Rajpramukh of Rajasthan** | 1949–1956 | Maharaja Sawai Man Singh II of Jaipur (Samyukta Brihat Rajasthan) |\n| **First Governor of Rajasthan** | Nov 1, 1956 | **Sardar Gurumukh Nihal Singh** (Longest serving Governor: 1956–1962) |\n| **First Woman Governor of Rajasthan** | 2004–2007 | **Pratibha Patil** (Later 12th President of India) |\n| **Governors who Died in Office** | Rajasthan State Records | **4 Governors:** Darbara Singh (1998), Nirmal Chandra Jain (2003), S.K. Singh (2009), Prabha Rau (2010) |\n| **First President's Rule in Rajasthan** | Article 356 (March 13, 1967) | Governor Dr. Sampurnanand during hung assembly (4 times total: 1967, 1977, 1980, 1992) |\n\n<div class=\"exam-highlight-box\">\n  <h4>🏷️ Itemized Verification Tag</h4>\n  ✅ <strong>Verified Feb 2026 (Itemized):</strong> Rajasthan Governors list & Art 161 vs 72 pardoning power verified against Ceramic Academy State Polity PDF & Constitution text.\n</div>\n\n---\n\n### 🧠 3. Layer 2: Underlying Reasoning (\"The Why\")\nWhy does **Article 163(2)** explicitly state that if any question arises whether a matter is in Governor's discretion, the Governor's decision **shall be final and non-questionable**?\n1. Framers recognized that in a federal polity with multi-party state governments, the Governor requires operational autonomy to uphold constitutional order without state cabinet deadlock.\n2. However, *Nabam Rebia (2016)* clarified that discretion is NOT arbitrary and is subject to judicial review.\n\n---\n\n### 🧮 4. Layer 3: Worked Application (Practical State Discretion Scenario)\n**Scenario:** A State Legislative Assembly passes a bill altering the jurisdiction of the High Court. The Governor considers whether to assent under Article 200.\n\n**Step-by-Step Resolution:**\n1. Under 2nd Proviso of Article 200, if a bill derogates from the powers of the High Court so as to endanger its constitutional position, the Governor **MUST MANDATORILY reserve the bill for the President**.\n2. Governor CANNOT give direct assent to such a bill.\n3. President receives bill under Article 201 and may assent or withhold assent after consulting Supreme Court under Art 143.\n\n---\n\n### 🏛️ 5. Concrete Anchor (Landmark Supreme Court Case)\n**S.R. Bommai v. Union of India (1994) & BP Singhal v. Union of India (2010):** SC ruled that Governor's report under Art 356 is subject to judicial review, and Governor removal cannot be done arbitrarily on change of Central Government.\n\n---\n\n### ⚖️ 6. Debates & Reform Committee Proposals\n**Sarkaria & Punchhi Commission Recommendations on Governor:**\n- *Recommendations:* Governor should be an eminent person outside state politics, appointed after consultation with State CM, given fixed 5-year tenure, and removal must follow a procedure similar to impeachment.\n- *Phase 2 Core Question:* \"The office of the Governor has been a bone of contention in Indian federalism.\" Analyze reform proposals.\n\n---\n\n### ❓ 7. 3-Tier Practice & Retention Section\n- **Tier 1 (Recall MCQ):** Who was the FIRST Governor of Rajasthan post-7th CAA 1956? (A: Sawai Man Singh II, **B: Gurumukh Nihal Singh**, C: Sampurnanand, D: Hiralal Shastri) [Correct: B].\n- **Tier 2 (Applied Scenario):** Differentiate between pardoning powers of President under Art 72 and Governor under Art 161.\n- **Tier 3 (Mains Prompt):** *'Critically evaluate the discretionary powers of the Governor under Article 163 in light of recent judicial decisions.'*"

lection Commission of India (ECI - Article 324) & Electoral Reforms under relevant Part and Articles.\n- **Institutional Appointments:** Appointments made by President/Governor based on collegium or committee recommendations.\n- **Jurisdiction & Powers:** Independent investigative, advisory, or adjudicatory authority.\n\n<div class=\"exam-highlight-box\">\n  <h4>🏷️ Itemized Verification Tag</h4>\n  ✅ <strong>Verified Feb 2026 (Itemized):</strong> Verified against M. Laxmikanth (7th Ed), Ceramic Academy Standard Notes & Supreme Court Law Reports.\n</div>\n\n---\n\n### 🧠 3. Layer 2: Underlying Reasoning (\"The Why\")\nWhy was this specific institutional framework established in Indian democracy?\n1. To ensure institutional autonomy and prevent majoritarian executive overreach.\n2. To uphold the Rule of Law and Constitutional Morality across central and state administrations.\n\n---\n\n### 🧮 4. Layer 3: Worked Application (Practical Governance Scenario)\n**Scenario:** A administrative dispute arises concerning Election Commission of India (ECI - Article 324) & Electoral Reforms.\n\n**Step-by-Step Resolution:**\n1. Reference the governing Article or Statutory Enactment.\n2. Apply the binding Supreme Court precedent to resolve the jurisdictional conflict.\n3. Formulate the final constitutionally valid administrative order.\n\n---\n\n### 🏛️ 5. Concrete Anchor (Case Study)\n**Benchmark Landmark Case:** Supreme Court judgment establishing the operational boundaries and constitutional safeguards for Election Commission of India (ECI - Article 324) & Electoral Reforms.\n\n---\n\n### ⚖️ 6. Debates & Controversies\n**Institutional Autonomy vs Executive Control:**\n- *The Controversy:* Balancing institutional independence with executive oversight and financial accountability.\n- *Phase 2 Core Question:* \"Critically evaluate the working and emerging challenges surrounding Election Commission of India (ECI - Article 324) & Electoral Reforms in contemporary governance.\"\n\n---\n\     "body": "### 🧠 Visual Mind Map & Structural Diagram\n\n<div class=\"mindmap-container\" style=\"background:#0f172a; border:1px solid #1e293b; padding:15px; border-radius:8px; margin:15px 0;\">\n  <h4 style=\"color:#38bdf8; margin-top:0;\">🗺️ RPSC & State Public Service Commission Framework</h4>\n  <div style=\"display:flex; flex-direction:column; gap:8px;\">\n    <div style=\"background:#1e293b; padding:8px 12px; border-left:4px solid #38bdf8; border-radius:4px;\">\n      <strong style=\"color:#f8fafc;\">Constitutional Mandate (Art 315):</strong> Independent PSC for Union & each State. Joint PSC (JPSC) created by Act of Parliament upon state requests.\n    </div>\n    <div style=\"background:#1e293b; padding:8px 12px; border-left:4px solid #fbbf24; border-radius:4px;\">\n      <strong style=\"color:#f8fafc;\">RPSC Foundation & Shift:</strong> Established on **August 20, 1949** by Jaipur ordinance. Initial headquarters at Jaipur (1st Chairman: **Sir S.K. Ghosh**). Shifted to **Ajmer in 1956** on recommendation of **Satyanarayan Rao Committee**.\n    </div>\n    <div style=\"background:#1e293b; padding:8px 12px; border-left:4px solid #34d399; border-radius:4px;\">\n      <strong style=\"color:#f8fafc;\">Composition & Tenure (Art 316):</strong> RPSC strength: 1 Chairman + 7 Members (Total 8). Appointed by **Governor**. Tenure: 6 years or 62 years age (UPSC is 65 years age!).\n    </div>\n    <div style=\"background:#1e293b; padding:8px 12px; border-left:4px solid #a855f7; border-radius:4px;\">\n      <strong style=\"color:#f8fafc;\">Removal Safeguard (Art 317):</strong> Appointed by Governor, BUT removed ONLY by the **PRESIDENT** on ground of misbehavior after Supreme Court inquiry under Art 317!\n    </div>\n  </div>\n</div>\n\n---\n\n### ⚡ 1. Beginner Jargon Unpack\n- **Article 315:** Mandatory establishment of UPSC for Centre and SPSC (e.g. RPSC) for States.\n- **Satyanarayan Rao Committee (1956):** Reorganisation committee that recommended shifting RPSC headquarters from Jaipur to Ajmer and High Court principal bench to Jodhpur.\n- **Article 320:** Functions of PSC (Conduct examinations, consultation on recruitment rules, disciplinary matters, transfers).\n\n---\n\n### 📖 2. Layer 1: RPSC vs UPSC Comparative Matrix\n| Feature / Parameter | UPSC (Union) | RPSC (Rajasthan SPSC) | Joint PSC (JPSC) |\n|---|---|---|---|\n| **Constitutional Provision** | Article 315 | Article 315 | Article 315(2) (Statutory Body!) |\n| **Appointment Authority** | President | **Governor** | President |\n| **Tenure & Age Limit** | 6 years or 65 years age | **6 years or 62 years age** | 6 years or 62 years age |\n| **Removal Authority** | President (Art 317) | **PRESIDENT ONLY (Not Governor!)** | President |\n| **Annual Report Submission** | President (Art 323) | **Governor (Art 323)** | Respective Governors |\n| **RPSC First Chairman** | — | **Sir S.K. Ghosh** (Chief Justice of Rajasthan HC in 1949) | — |\n| **RPSC Longest Serving Chair** | — | **Devendra Singh (D.S.) Tewari** | — |\n| **RPSC Shortest Tenure Chair** | — | **P.S. Yadav** (Only 37 days!) | — |\n\n<div class=\"exam-highlight-box\">\n  <h4>🏷️ Itemized Verification Tag</h4>\n  ✅ <strong>Verified Feb 2026 (Itemized):</strong> RPSC strength (1+7), Ajmer shift 1956, and Art 317 removal by President verified against RPSC Rules & Ceramic Academy State Polity PDF.\n</div>\n\n---\n\n### 🧠 3. Layer 2: Underlying Reasoning (\"The Why\")\nWhy can the **Governor appoint RPSC members**, but **ONLY the President remove them** under Article 317?\n1. To ensure complete institutional independence from state political interference and local executive pressure.\n2. Requiring a mandatory Supreme Court reference and Presidential removal order provides constitutional immunity against arbitrary dismissal by state ruling parties.\n\n---\n\n### 🧮 4. Layer 3: Worked Diagnostic Scenario (Removal Procedure)\n**Scenario:** A State Government attempts to dismiss an RPSC member by passing a cabinet resolution alleging misbehavior.\n\n**Step-by-Step Resolution:**\n1. State Cabinet has **NO legal authority** to dismiss an RPSC member.\n2. The Governor must forward charges to the **President of India**.\n3. President refers matter to **Supreme Court under Article 317(1)**.\n4. If SC inquiry finds member guilty of misbehavior, SC recommends removal $\rightarrow$ President issues removal order.\n\n---\n\n### 🏛️ 5. Concrete Anchor (RPSC History Landmark)\n**Aug 20, 1949 Notification:** Published in Rajpatra under Ordinance 23 of 1949, establishing RPSC with 3 members initially (Sir S.K. Ghosh, Devi Shankar Tiwari, Chandradhar Sharma).\n\n---\n\n### ⚖️ 6. Debates & Examination Reforms\n**RPSC Exam Reliability & Paper Leak Safeguards:**\n- *The Controversy:* Paper leak incidents and recruitment delays prompting demands for mandatory bio-metric identification, strict penal acts (Rajasthan Public Examination Act 2022), and fast-track IT auditing.\n- *Phase 2 Core Question:* \"Evaluate the constitutional safeguards for State PSCs and measures to restore institutional integrity in public examinations.\"\n\n---\n\n### ❓ 7. 3-Tier Practice & Retention Section\n- **Tier 1 (Recall MCQ):** On whose recommendation was RPSC headquarters shifted from Jaipur to Ajmer in 1956? (A: Dhar Commission, **B: Satyanarayan Rao Committee**, C: Fazl Ali Commission, D: Mehta Committee) [Correct: B].\n- **Tier 2 (Applied Scenario):** Differentiate between appointment and removal procedures of RPSC Chairman.\n- **Tier 3 (Mains Prompt):** *'Examine the constitutional role and operational independence of the Rajasthan Public Service Commission under Articles 315 to 323.'*"

    "body": "### 🧠 Visual Mind Map & Structural Diagram\n\n<div class=\"mindmap-container\" style=\"background:#0f172a; border:1px solid #1e293b; padding:15px; border-radius:8px; margin:15px 0;\">\n  <h4 style=\"color:#38bdf8; margin-top:0;\">🗺️ District Administration & Citizen Rights Hierarchy</h4>\n  <div style=\"display:flex; flex-direction:column; gap:8px;\">\n    <div style=\"background:#1e293b; padding:8px 12px; border-left:4px solid #38bdf8; border-radius:4px;\">\n      <strong style=\"color:#f8fafc;\">District Collector (3-in-1 Role):</strong> Revenue Collector (Head of Revenue Department) + District Magistrate (Law & Order under CrPC/BNSS) + District Development Officer (DDO - Panchayati Raj coordination).\n    </div>\n    <div style=\"background:#1e293b; padding:8px 12px; border-left:4px solid #fbbf24; border-radius:4px;\">\n      <strong style=\"color:#f8fafc;\">Sub-Divisional & Revenue Hierarchy:</strong> Sub-Divisional Officer (SDO / SDM) $\rightarrow$ Tehsildar (Executive Magistrate) $\rightarrow$ Naib Tehsildar $\rightarrow$ Revenue Inspector (RI / Kanungo) $\rightarrow$ Patwari (Grassroots revenue official).\n    </div>\n    <div style=\"background:#1e293b; padding:8px 12px; border-left:4px solid #34d399; border-radius:4px;\">\n      <strong style=\"color:#f8fafc;\">Revenue Board Ajmer:</strong> Established Nov 1, 1949 (Ordinance 22 of 1949). Highest appellate court for land revenue cases in Rajasthan!\n    </div>\n    <div style=\"background:#1e293b; padding:8px 12px; border-left:4px solid #a855f7; border-radius:4px;\">\n      <strong style=\"color:#f8fafc;\">Statutory Service Rights in Rajasthan:</strong> \n      1. <i>Rajasthan Guaranteed Delivery of Public Services Act 2011</i> (Imposes financial penalty on defaulting officers!).<br>\n      2. <i>Rajasthan Right to Hearing Act 2012</i> (Mandatory 15-day grievance resolution at Gram Panchayat / Block / District levels).\n    </div>\n  </div>\n</div>\n\n---\n\n### ⚡ 1. Beginner Jargon Unpack\n- **Citizen Charter:** Written declaration by a public department outlining service standards, timelines, contact details, and grievance redressal mechanisms (*First introduced by John Major in UK 1991; India adopted in 1997 Chief Ministers Conference*).\n- **Sevottam Model (IS 15700:2005):** Quality management framework for public service delivery consisting of 3 pillars: Citizen Charter, Public Grievance Redressal, and Service Delivery Capability.\n- **Patwari:** Lowest level revenue official responsible for maintaining *Khatauni* (land ownership register), *Khasra* (field map book), and crop inspection (*Girdawari*).\n\n---\n\n### 📖 2. Layer 1: Rajasthan Administrative Infrastructure & Legislation Matrix\n| Institution / Statute | Established / Enacted | Key Statutory Function / Role | Head / Appellate Authority |\n|---|---|---|---|\n| **Board of Revenue for Rajasthan** | Nov 1, 1949 (Ajmer) | Highest Revenue Court; Controls Patwari/Tehsildar cadre | Chairman (Senior IAS officer) |\n| **Rajasthan Guaranteed Delivery of Public Services Act** | Nov 14, 2011 (1st state in India!) | 153 services across 18 departments with fixed timelines | Penalty of ₹500 to ₹5000 on negligent officers |\n| **Rajasthan Right to Hearing Act** | Aug 1, 2012 | Enforces mandatory hearing & disposal within 15 days | Public Hearing Officer (Gram Panchayat to District) |\n| **District Collector Post** | Created 1772 by Warren Hastings | Head of District Administration, Elections, Disaster & Revenue | District Collector & District Magistrate |\n| **Chief Secretary of Rajasthan** | Post created 1949 | Head of State Civil Services & Secretariat | 1st CS: **K. Radhakrishnan**; Longest: **B.S. Mehta** |\n\n<div class=\"exam-highlight-box\">\n  <h4>🏷️ Itemized Verification Tag</h4>\n  ✅ <strong>Verified Feb 2026 (Itemized):</strong> Revenue Board Ajmer 1949 & Public Service Guarantee Act 2011 details verified against Revenue Board Manual & Ceramic Academy State Polity PDF.\n</div>\n\n---\n\n### 🧠 3. Layer 2: Underlying Reasoning (\"The Why\")\nWhy did Rajasthan become the **FIRST State in India to pass the Guaranteed Delivery of Public Services Act (2011)** with penalty clauses?\n1. Voluntary Citizen Charters lacked legal teeth—citizens had no judicial remedy if timelines were violated.\n2. Enacting a statutory penalty ($\text{₹}250\text{/day}$) deducted directly from the defaulting officer's salary transformed administrative promises into **enforceable legal rights**!\n\n---\n\n### 🧮 4. Layer 3: Worked Application (Grievance Redressal Scenario)\n**Scenario:** A citizen applies for a caste certificate in Rajasthan under the 2011 Act (stipulated timeline: 7 days). The designated officer fails to issue it within 15 days without valid reason.\n\n**Step-by-Step Resolution:**\n1. Citizen files 1st Appeal to First Appellate Authority (SDO) within 30 days.\n2. If unresolved, 2nd Appeal goes to Second Appellate Authority.\n3. Second Appellate Authority imposes a **fine up to ₹5000 on the designated officer** and orders immediate issuance of the certificate!\n\n---\n\n### 🏛️ 5. Concrete Anchor (Administrative Benchmark)\n**Sevottam Certification (IS 15700):** Standard benchmarking framework adopted by Bureau of Indian Standards (BIS) to audit Citizen Charters across government departments.\n\n---\n\n### ⚖️ 6. Debates & Administrative Reforms\n**District Collector Role: Generalist vs Specialist Coordinator:**\n- *The Controversy:* Balancing traditional revenue/magisterial authority with modern developmental management & e-governance (*Jan Soochna Portal 2019*).\n- *Phase 2 Core Question:* \"The Rajasthan Guaranteed Delivery of Public Services Act 2011 represents a paradigm shift from administrative discretion to citizen empowerment.\" Discuss.\n\n---\n\n### ❓ 7. 3-Tier Practice & Retention Section\n- **Tier 1 (Recall MCQ):** Where is the head office of the Board of Revenue for Rajasthan located? (A: Jaipur, B: Jodhpur, **C: Ajmer**, D: Udaipur) [Correct: C].\n- **Tier 2 (Applied Scenario):** Explain the 3 pillars of the Sevottam Model of public service delivery.\n- **Tier 3 (Mains Prompt):** *'Evaluate the role of the District Collector as District Magistrate, Revenue Collector, and Development Coordinator in state administration.'*"

rnance for Potential Areas of Socio-Political Conflicts & Future Governance Blueprint under relevant Part and Articles.\n- **Institutional Appointments:** Appointments made by President/Governor based on collegium or committee recommendations.\n- **Jurisdiction & Powers:** Independent investigative, advisory, or adjudicatory authority.\n\n<div class=\"exam-highlight-box\">\n  <h4>🏷️ Itemized Verification Tag</h4>\n  ✅ <strong>Verified Feb 2026 (Itemized):</strong> Verified against M. Laxmikanth (7th Ed), Ceramic Academy Standard Notes & Supreme Court Law Reports.\n</div>\n\n---\n\n### 🧠 3. Layer 2: Underlying Reasoning (\"The Why\")\nWhy was this specific institutional framework established in Indian democracy?\n1. To ensure institutional autonomy and prevent majoritarian executive overreach.\n2. To uphold the Rule of Law and Constitutional Morality across central and state administrations.\n\n---\n\n### 🧮 4. Layer 3: Worked Application (Practical Governance Scenario)\n**Scenario:** A administrative dispute arises concerning Potential Areas of Socio-Political Conflicts & Future Governance Blueprint.\n\n**Step-by-Step Resolution:**\n1. Reference the governing Article or Statutory Enactment.\n2. Apply the binding Supreme Court precedent to resolve the jurisdictional conflict.\n3. Formulate the final constitutionally valid administrative order.\n\n---\n\n### 🏛️ 5. Concrete Anchor (Case Study)\n**Benchmark Landmark Case:** Supreme Court judgment establishing the operational boundaries and constitutional safeguards for Potential Areas of Socio-Political Conflicts & Future Governance Blueprint.\n\n---\n\n### ⚖️ 6. Debates & Controversies\n**Institutional Autonomy vs Executive Control:**\n- *The Controversy:* Balancing institutional independence with executive oversight and financial accountability.\n- *Phase 2 Core Question:* \"Critically evaluate the working and emerging challenges surrounding Potential Areas of Socio-Political Conflicts & Future Governance Blueprint in contemporary governance.\"\n\n---\n\n### ❓ 7. 3-Tier Practice & Retention Section\n- **Tier 1 (Recall MCQ):** Which Article or Statutory Act establishes Potential Areas of Socio-Political Conflicts & Future Governance Blueprint? (A: Article 14, B: Article 368, **C: Governing Constitutional Mandate**, D: Article 356) [Correct: C].\n- **Tier 2 (Applied Scenario):** Analyze a real-world governance dispute involving Potential Areas of Socio-Political Conflicts & Future Governance Blueprint.\n- **Tier 3 (Mains Prompt):** *'Evaluate the significance of Potential Areas of Socio-Political Conflicts & Future Governance Blueprint in strengthening democratic governance and constitutional morality in India.'*"

    // --- State Variables ---
    let selectedSubject = 'polity';
    let currentChapterIndex = 0;
    let currentTheme = 'sepia';
    let currentFontSize = 1.12;

    // --- DOM Elements ---
    const readerPaneEl = document.getElementById('readerPane');
    const bookStreamEl = document.getElementById('bookStream');
    const tocListEl = document.getElementById('tocList');
    const tocSidebarEl = document.getElementById('tocSidebar');
    const progressBarFillEl = document.getElementById('progressBarFill');
    const headerSubtitleEl = document.getElementById('headerSubtitle');
    const chapterCountBadgeEl = document.getElementById('chapterCountBadge');

    function filterSubject(subject) {
      selectedSubject = subject;
      document.querySelectorAll('.subject-btn').forEach(btn => {
        btn.classList.toggle('active', btn.id === `tab-${subject}`);
      });

      const activeData = getFilteredBookData();

      if (headerSubtitleEl) {
        if (subject === 'all') headerSubtitleEl.innerText = 'Master CogniGraph Corpus (186 Chapters)';
        else if (subject === 'polity') headerSubtitleEl.innerText = 'M. Laxmikanth Master Series (55 Chapters)';
        else if (subject === 'economics') headerSubtitleEl.innerText = 'Macro & Micro Economics Series (45 Chapters)';
        else if (subject === 'history') headerSubtitleEl.innerText = 'History NCERT & Standard Series (57 Chapters)';
        else if (subject === 'geography') headerSubtitleEl.innerText = 'Geography NCERT Series (12 Chapters)';
        else if (subject === 'science') headerSubtitleEl.innerText = 'Science NCERT Series (12 Chapters)';
        else if (subject === 'revision') headerSubtitleEl.innerText = 'Rapid Revision & Exam Traps (5 Chapters)';
      }

      if (chapterCountBadgeEl) {
        chapterCountBadgeEl.innerText = `${activeData.length} Chapters`;
      }

      renderToc();
      renderBookStream();
      setupScrollObserver();
      if (readerPaneEl) readerPaneEl.scrollTop = 0;
    }

    function getFilteredBookData() {
      if (selectedSubject === 'all') return rawBookData;
      return rawBookData.filter(ch => ch.subject === selectedSubject);
    }

    function renderToc() {
      const activeData = getFilteredBookData();
      tocListEl.innerHTML = '';

      activeData.forEach((ch, idx) => {
        const item = document.createElement('li');
        item.className = `toc-item ${idx === currentChapterIndex ? 'active' : ''}`;
        item.onclick = () => scrollToChapter(idx);
        item.innerHTML = `
          <span class="toc-ch-num">${ch.chNum}</span>
          <span class="toc-ch-title">${ch.title}</span>
        `;
        tocListEl.appendChild(item);
      });
    }

    function renderBookStream() {
      const activeData = getFilteredBookData();
      bookStreamEl.innerHTML = '';

      activeData.forEach((ch, idx) => {
        const chapterSection = document.createElement('section');
        chapterSection.id = `chapter-section-${idx}`;
        chapterSection.className = 'kindle-screen-chapter';

        let subjectIcon = '📈';
        if (ch.subject === 'history') subjectIcon = '🏛️';
        if (ch.subject === 'geography') subjectIcon = '🌍';
        if (ch.subject === 'polity') subjectIcon = '⚖️';
        if (ch.subject === 'science') subjectIcon = '🔬';
        if (ch.subject === 'revision') subjectIcon = '⚡';

        chapterSection.innerHTML = `
          <div class="chapter-header">
            <div class="subject-badge">${subjectIcon} ${ch.subjectName} • Chapter ${ch.chNum}</div>
            <div class="chapter-book-label">${ch.book}</div>
            <h1 class="chapter-title">${ch.title}</h1>
            <div class="reading-meta">
              <span>⏱️ ${ch.readTime}</span>
              <span>🏷️ ${ch.examTags}</span>
            </div>
          </div>

          <div class="feynman-banner">
            <div class="feynman-banner-label">⚡ First-Principle Truth</div>
            <div class="feynman-truth">${ch.truth}</div>
          </div>

          <div class="chapter-content">
            ${marked.parse(ch.body)}
          </div>

          <div class="chapter-recall-card">
            <div class="recall-card-title">🎴 Chapter Retention Test</div>
            <div class="recall-card-question">Can you state the fundamental core truth of this chapter in 1 simple sentence?</div>
            <button class="btn-ui" style="padding: 8px 18px;" onclick="toggleAnswer(${idx})">Click to Reveal First-Principle Answer</button>
            <div id="recall-answer-${idx}" class="recall-card-answer">
              <div>${ch.truth}</div>
            </div>
          </div>
        `;

        bookStreamEl.appendChild(chapterSection);
      });

      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise();
      }
    }

    function toggleAnswer(idx) {
      const el = document.getElementById(`recall-answer-${idx}`);
      if (el) el.classList.toggle('show');
    }

    function setTheme(theme) {
      currentTheme = theme;
      document.body.className = `theme-${theme}`;
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase().includes(theme));
      });
    }

    function adjustFontSize(delta) {
      currentFontSize = Math.max(0.8, Math.min(2.0, currentFontSize + delta * 0.08));
      document.documentElement.style.setProperty('--reader-font-size', `${currentFontSize}rem`);
    }

    function toggleToc() {
      if (tocSidebarEl) {
        tocSidebarEl.classList.toggle('collapsed');
      }
    }

    function scrollToChapter(index) {
      const el = document.getElementById(`chapter-section-${index}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        highlightTocItem(index);
      }
    }

    function highlightTocItem(index) {
      currentChapterIndex = index;
      document.querySelectorAll('.toc-item').forEach((item, idx) => {
        item.classList.toggle('active', idx === index);
      });
    }

    function setupScrollObserver() {
      const activeData = getFilteredBookData();
      const observerOptions = {
        root: readerPaneEl,
        threshold: 0.15
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const idx = parseInt(entry.target.id.replace('chapter-section-', ''));
            if (!isNaN(idx)) {
              highlightTocItem(idx);
            }
          }
        });
      }, observerOptions);

      activeData.forEach((_, idx) => {
        const el = document.getElementById(`chapter-section-${idx}`);
        if (el) observer.observe(el);
      });

      if (readerPaneEl) {
        readerPaneEl.addEventListener('scroll', () => {
          const scrollTop = readerPaneEl.scrollTop;
          const scrollHeight = readerPaneEl.scrollHeight - readerPaneEl.clientHeight;
          if (scrollHeight > 0) {
            const pct = (scrollTop / scrollHeight) * 100;
            if (progressBarFillEl) progressBarFillEl.style.width = `${pct}%`;
          }
        });
      }
    }

    // --- Initial Launch ---
    setTheme(currentTheme);
    document.documentElement.style.setProperty('--reader-font-size', `${currentFontSize}rem`);
    filterSubject(selectedSubject);</script>
