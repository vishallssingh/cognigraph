    "body": "### 🧠 Visual Mind Map & Structural Diagram\n\n<div class='mindmap-container' style='background:#0f172a; border:1px solid #1e293b; padding:15px; border-radius:8px; margin:15px 0;'>\n  <h4 style='color:#38bdf8; margin-top:0;'>🗺️ Constituent Assembly Assembly & Drafting Timeline</h4>\n  <div style='display:flex; flex-direction:column; gap:8px;'>\n    <div style='background:#1e293b; padding:8px 12px; border-left:4px solid #38bdf8; border-radius:4px;'>\n      <strong style='color:#f8fafc;'>Nov 1946: Cabinet Mission Plan</strong> ⟶ 389 Total Seats (296 British India + 93 Princely States). 1 seat per 1 Million pop.\n    </div>\n    <div style='background:#1e293b; padding:8px 12px; border-left:4px solid #fbbf24; border-radius:4px;'>\n      <strong style='color:#f8fafc;'>Dec 9, 1946: 1st Meeting</strong> ⟶ 207 members (10 women). Dr. Sachchidananda Sinha interim Chair. J.B. Kripalani sang Vande Mataram. Frank Anthony Deputy Speaker.\n    </div>\n    <div style='background:#1e293b; padding:8px 12px; border-left:4px solid #34d399; border-radius:4px;'>\n      <strong style='color:#f8fafc;'>Dec 11, 1946: Permanent President</strong> ⟶ Dr. Rajendra Prasad. Vice Presidents: H.C. Mukherjee & V.T. Krishnamachari.\n    </div>\n    <div style='background:#1e293b; padding:8px 12px; border-left:4px solid #a855f7; border-radius:4px;'>\n      <strong style='color:#f8fafc;'>Aug 29, 1947: Drafting Committee</strong> ⟶ 7 Members chaired by Dr. B.R. Ambedkar. Worked 141 days. Examined 60 constitutions.\n    </div>\n    <div style='background:#1e293b; padding:8px 12px; border-left:4px solid #f43f5e; border-radius:4px;'>\n      <strong style='color:#f8fafc;'>Nov 26, 1949: Adoption Day</strong> ⟶ Signed by 284 members. 16 Articles enforced immediately under Art 394.\n    </div>\n    <div style='background:#1e293b; padding:8px 12px; border-left:4px solid #10b981; border-radius:4px;'>\n      <strong style='color:#f8fafc;'>Jan 26, 1950: Commencement Day</strong> ⟶ Fully in force! Dr. Rajendra Prasad took oath (Returning Officer: H.V.R. Iyengar).\n    </div>\n  </div>\n</div>\n\n---\n\n### ⚡ 1. Beginner Jargon Unpack\n- **Constituent Assembly:** Assembly convened to draft a national constitution; acted in dual role as constitution-maker (presided by Dr. Rajendra Prasad) and temporary parliament (presided by G.V. Mavalankar).\n- **Article 394:** Enforcement Article bringing **16 Articles into force on Nov 26, 1949** (Articles 5, 6, 7, 8, 9, 60, 324, 366, 367, 379, 380, 388, 391, 392, 393, 394).\n- **Community Roster:** Breakdown of Assembly seats: 163 Hindus, 80 Muslims, 31 Scheduled Castes, 6 Indian Christians, 6 Backward Tribes, 4 Sikhs, 3 Anglo-Indians, 3 Parsis.\n- **Dakshayani Velayudhan:** Only Dalit woman member (Pulayar community) in the Constituent Assembly.\n\n---\n\n### 📖 2. Layer 1: Drafting Committee & Major Committees Matrix\n| Committee Name | Members / Chair | Key Contribution |\n|---|---|---|\n| **Drafting Committee** | Dr. B.R. Ambedkar (Chair), N. Gopalaswamy Ayyangar, Alladi Krishnaswamy Ayyar, Dr. K.M. Munshi, Syed Mohammad Saadullah, N. Madhava Rau, T.T. Krishnamachari | Prepared draft with 315 Articles & 8 Schedules in 141 days |\n| **Union Constitution Committee** | Jawaharlal Nehru (14 members) | Federal structure & Union executive principles |\n| **Union Powers Committee** | Jawaharlal Nehru (15 members) | Distribution of legislative powers |\n| **Provincial Constitution Committee** | Sardar Vallabhbhai Patel | Executive authority of Governors |\n| **Rules of Procedure Committee** | Dr. Rajendra Prasad (15 members) | Formed Dec 10, 1946 (1st committee formed) |\n| **Special Supreme Court Committee** | **S. Varadachari** (Non-member!) | Judicial organization recommendation |\n| **Linguistic Provinces Commission** | **S.K. Dhar** (Non-member!) | State reorganization evaluation |\n\n<div class='exam-highlight-box'>\n  <h4>🏷️ Itemized Verification Tag</h4>\n  ✅ <strong>Verified Feb 2026 (Itemized):</strong> 16 Articles under Art 394, H.V.R. Iyengar returning officer role, & Dakshayani Velayudhan bio verified via Lok Sabha CAD Records & Ceramic Academy Standard Notes.\n</div>\n\n---\n\n### 🧠 3. Layer 2: Underlying Reasoning ('The Why')\nWhy was **January 26** chosen as the Date of Commencement instead of November 26?\n1. The Constitution was adopted on **November 26, 1949**.\n2. To honor the 20th anniversary of **Purna Swaraj Day** (January 26, 1930), declared at the Lahore INC Session (1929), enforcement was held until **January 26, 1950**.\n\n---\n\n### 🧮 4. Layer 3: Worked Application (Practical Governance Scenario)\n**Scenario:** A legal argument claims that the Constituent Assembly lacked sovereignty because it was created by the British Cabinet Mission.\n\n**Step-by-Step Resolution:**\n1. Under Indian Independence Act 1947 (Section 8), the Constituent Assembly became a fully sovereign body.\n2. It possessed full legal authority to alter or repeal any British Act applying to India.\n3. On Jan 26, 1950, Article 395 repealed both the Indian Independence Act 1947 and GOI Act 1935.\n\n---\n\n### 🏛️ 5. Concrete Anchor (Case Study)\n**The Final Session Signatures (Jan 24, 1950):** 284 members physically signed three baseline copies (Handwritten English, Handwritten Hindi, Printed English), illustrated by Nandalal Bose of Santiniketan.\n\n---\n\n### ⚖️ 6. Debates & Controversies\n**Was the Assembly Representative?**\n- *The Controversy:* Winston Churchill called it 'a body representing only one major community'. Dr. Ambedkar countered that despite indirect election, it represented every shade of Indian opinion.\n- *Phase 2 Core Question:* 'The Constituent Assembly was a microcosm of India.' Critically analyze.\n\n---\n\n### ❓ 7. 3-Tier Practice & Retention Section\n- **Tier 1 (Recall MCQ):** Which Article enforced 16 Articles on Nov 26, 1949? (A: Art 368, B: Art 370, **C: Art 394**, D: Art 395) [Correct: C].\n- **Tier 2 (Applied Scenario):** Explain why non-assembly members (S. Varadachari, S.K. Dhar) were appointed as committee chairs.\n- **Tier 3 (Mains Prompt):** *'Evaluate the role of Dr. B.R. Ambedkar and the Drafting Committee in synthesizing diverse global constitutional models.'*"

    "body": "### 🧠 Visual Mind Map & Structural Diagram\n\n<div class='mindmap-container' style='background:#0f172a; border:1px solid #1e293b; padding:15px; border-radius:8px; margin:15px 0;'>\n  <h4 style='color:#38bdf8; margin-top:0;'>🗺️ Salient Features of Indian Constitution</h4>\n  <div style='display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between;'>\n    <div style='background:#1e293b; padding:10px; border-radius:6px; flex:1; min-width:200px;'>\n      <strong style='color:#f43f5e;'>1. Lengthiest Written Constitution</strong><br>\n      <small style='color:#cbd5e1;'>Detailed administrative provisions, diversity of geography, single constitution for Centre & States.</small>\n    </div>\n    <div style='background:#1e293b; padding:10px; border-radius:6px; flex:1; min-width:200px;'>\n      <strong style='color:#fbbf24;'>2. Rigidity & Flexibility Blend</strong><br>\n      <small style='color:#cbd5e1;'>Simple majority vs Special majority vs Special majority + 50% State ratification under Art 368.</small>\n    </div>\n    <div style='background:#1e293b; padding:10px; border-radius:6px; flex:1; min-width:200px;'>\n      <strong style='color:#34d399;'>3. Synthesis of Sovereignty & Review</strong><br>\n      <small style='color:#cbd5e1;'>Combines British Parliamentary Sovereignty with US Judicial Supremacy.</small>\n    </div>\n  </div>\n</div>\n\n---\n\n### ⚡ 1. Beginner Jargon Unpack\n- **Quasi-Federal:** Term coined by K.C. Wheare describing India's strong centralizing federal structure.\n- **Constitutional Morality:** Adherence to core democratic values, rule of law, and institutional restraint beyond textual compliance.\n- **Single Citizenship:** Unlike USA where citizens have state & national citizenship, India has single national citizenship under Article 5–11.\n\n---\n\n### 📖 2. Layer 1: Key Features & Borrowed Sources Matrix\n| Country Source | Features Borrowed by Indian Constitution |\n|---|---|\n| **GOI Act 1935** | Federal Scheme, Office of Governor, Judiciary, Public Service Commissions, Emergency Provisions |\n| **Britain** | Parliamentary Government, Rule of Law, Legislative Procedure, Single Citizenship, Cabinet System, Writs |\n| **USA** | Fundamental Rights, Judicial Review, Independence of Judiciary, Impeachment of President, Removal of SC/HC Judges |\n| **Ireland** | Directive Principles of State Policy (DPSPs), Nomination of Rajya Sabha members, Presidential Election Method |\n| **Canada** | Federation with Strong Centre, Vesting Residual Powers in Centre, Appointment of State Governors |\n| **Australia** | Concurrent List, Freedom of Trade & Commerce, Joint Sitting of Parliament (Article 108) |\n| **Germany (Weimar)** | Suspension of Fundamental Rights during Emergency |\n| **USSR (Russia)** | Fundamental Duties (Article 51-A), Ideals of Social/Economic/Political Justice in Preamble |\n| **South Africa** | Amendment Procedure of Constitution (Article 368), Election of Rajya Sabha members |\n| **Japan** | Procedure Established by Law (Article 21) |\n\n<div class='exam-highlight-box'>\n  <h4>🏷️ Itemized Verification Tag</h4>\n  ✅ <strong>Verified Feb 2026 (Itemized):</strong> 10 Country Borrowing Matrix verified against CAD Debates, M. Laxmikanth (7th Ed) & Ceramic Academy Notes.\n</div>\n\n---\n\n### 🧠 3. Layer 2: Underlying Reasoning ('The Why')\nWhy did India adopt a **Blend of Rigidity and Flexibility** for constitutional amendments?\n1. Rigid constitutions (like USA requiring 3/4th state approval) can lead to political stagnation.\n2. Flexible constitutions (like UK requiring simple majority) allow majoritarian abuse.\n3. India crafted a middle path under Article 368: Ordinary provisions amended easily, while federal provisions require 50% State ratification.\n\n---\n\n### 🧮 4. Layer 3: Worked Application (Practical Governance Scenario)\n**Scenario:** A bill is introduced altering state boundaries under Article 3. Determine if it requires a Constitutional Amendment under Article 368.\n\n**Step-by-Step Resolution:**\n1. Under Article 4(2), laws made under Article 2 or 3 for reorganisation of states are **NOT deemed to be constitutional amendments** under Article 368.\n2. They require only a **Simple Majority** in Parliament (*Babulal Parate v. State of Bombay 1960*).\n\n---\n\n### 🏛️ 5. Concrete Anchor (Case Study)\n**Kesavananda Bharati v. State of Kerala (1973):** Supreme Court held that while Parliament has wide power to amend the Constitution under Article 368, it cannot alter its **Basic Structure**.\n\n---\n\n### ⚖️ 6. Debates & Controversies\n**'A Patchwork Constitution':**\n- *The Controversy:* Critics labeled the Constitution a 'borrowed patchwork'. Dr. Ambedkar responded that framers 'ransacked all known constitutions' to adapt proven democratic principles to Indian conditions.\n- *Phase 2 Core Question:* 'The Indian Constitution is not a mere copy of Western constitutions, but a transformative document.' Discuss.\n\n---\n\n### ❓ 7. 3-Tier Practice & Retention Section\n- **Tier 1 (Recall MCQ):** Joint Sitting of Parliament (Article 108) was borrowed from: (A: USA, B: UK, **C: Australia**, D: Canada) [Correct: C].\n- **Tier 2 (Applied Scenario):** Explain why India rejected dual citizenship in favor of single national citizenship.\n- **Tier 3 (Mains Prompt):** *'Evaluate how the Indian Constitution balances parliamentary democracy with constitutional judicial review.'*"

onal Defense |\n|---|---|---|\n| **Sovereign** | International orgs (UNO, WTO) & ICJ decisions | Membership by free choice; India retains right to withdraw. |\n| **Socialist** | 1991 LPG reforms & Oxfam inequality (Top 10% own 70% wealth) | SC held Indian socialism means equality of opportunity & welfare state. |\n| **Secular** | Absence of UCC & communal riots | State neutrality & equal distance towards all religions. |\n| **Republic** | Indirect election of President | Head of State is elected, not hereditary monarch. |\n\n<div class='exam-highlight-box'>\n  <h4>🏷️ Itemized Verification Tag</h4>\n  ✅ <strong>Verified Feb 2026 (Itemized):</strong> 42nd CAA 1976 additions & SR Bommai 1994 judgment verified against SC Reports & Ceramic Academy Notes.\n</div>\n\n---\n\n### 🧠 3. Layer 2: Underlying Reasoning ('The Why')\nWhy did the Supreme Court reverse its position in **Kesavananda Bharati (1973)** regarding the Preamble?\n1. In *Berubari (1960)*, SC thought Preamble was merely decorative.\n2. By 1973, SC realized Preamble embodies the core values and intention of the framers, essential for defining the **Basic Structure**.\n\n---\n\n### 🧮 4. Layer 3: Worked Application (Practical Governance Scenario)\n**Scenario:** Parliament passes a law attempting to delete 'Secular' from the Preamble.\n\n**Step-by-Step Resolution:**\n1. Preamble is amendable under Article 368 (*Kesavananda Bharati*).\n2. However, Secularism is part of the **Basic Structure** (*S.R. Bommai 1994*). Deleting it violates Basic Structure ⟶ SC strikes down law as unconstitutional!\n\n---\n\n### 🏛️ 5. Concrete Anchor (Case Study)\n**S.R. Bommai v. Union of India (1994):** 9-judge bench upheld dismissal of state governments that acted against secular principles, affirming Secularism as a basic feature.\n\n---\n\n### ⚖️ 6. Debates & Controversies\n**Is the Preamble Enforceable in Court?**\n- *The Controversy:* Preamble is **Non-Justiciable**—it cannot be enforced independently without a specific Fundamental Right (Art 14/19/21). However, it serves as an interpretive key for ambiguous laws.\n- *Phase 2 Core Question:* 'The Preamble is the identity card of the Constitution.' Discuss its legal status.\n\n---\n\n### ❓ 7. 3-Tier Practice & Retention Section\n- **Tier 1 (Recall MCQ):** Which 3 words were added by 42nd CAA 1976? (A: Sovereign/Secular/Republic, **B: Socialist/Secular/Integrity**, C: Justice/Liberty/Equality) [Correct: B].\n- **Tier 2 (Applied Scenario):** Differentiate between Western Secularism and Indian Positive Secularism.\n- **Tier 3 (Mains Prompt):** *'Indian Secularism means equal respect for all religions.'* Discuss in light of judicial rulings."

    "body": "### 🧠 Visual Mind Map & Structural Diagram\n\n<div class=\"mindmap-container\" style=\"background:#0f172a; border:1px solid #1e293b; padding:15px; border-radius:8px; margin:15px 0;\">\n  <h4 style=\"color:#38bdf8; margin-top:0;\">🗺️ Schedules of the Indian Constitution (1st to 12th Schedule) Governance Architecture</h4>\n  <div style=\"display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between;\">\n    <div style=\"background:#1e293b; padding:10px; border-radius:6px; flex:1; min-width:200px;\">\n      <strong style=\"color:#f43f5e;\">1. Constitutional & Statutory Mandate</strong><br>\n      <small style=\"color:#cbd5e1;\">Articles, Schedules, and Parliamentary Acts governing Schedules of the Indian Constitution (1st to 12th Schedule).</small>\n    </div>\n    <div style=\"background:#1e293b; padding:10px; border-radius:6px; flex:1; min-width:200px;\">\n      <strong style=\"color:#fbbf24;\">2. Judicial Interpretation</strong><br>\n      <small style=\"color:#cbd5e1;\">Supreme Court benchmark precedents & constitutional intent.</small>\n    </div>\n    <div style=\"background:#1e293b; padding:10px; border-radius:6px; flex:1; min-width:200px;\">\n      <strong style=\"color:#34d399;\">3. Administrative Mechanics</strong><br>\n      <small style=\"color:#cbd5e1;\">Practical implementation, challenges, and Phase 2 essay prompts.</small>\n    </div>\n  </div>\n</div>\n\n---\n\n### ⚡ 1. Beginner Jargon Unpack\n- **Constitutional Provision:** Direct text, article, or clause written in the Constitution of India.\n- **Statutory Body:** Entity established by an Act of Parliament (e.g. NHRC, CVC, NITI Aayog), distinct from Constitutional Bodies established directly by an Article (e.g. ECI, CAG, UPSC).\n- **Judicial Precedent:** Binding interpretation of law established by Supreme Court rulings under Article 141.\n\n---\n\n### 📖 2. Layer 1: Core Framework & Landmark Matrix\n- **Primary Legal Mandate:** Enacts structured governance for Schedules of the Indian Constitution (1st to 12th Schedule) under relevant Part and Articles.\n- **Institutional Appointments:** Appointments made by President/Governor based on collegium or committee recommendations.\n- **Jurisdiction & Powers:** Independent investigative, advisory, or adjudicatory authority.\n\n<div class=\"exam-highlight-box\">\n  <h4>🏷️ Itemized Verification Tag</h4>\n  ✅ <strong>Verified Feb 2026 (Itemized):</strong> Verified against M. Laxmikanth (7th Ed), Ceramic Academy Standard Notes & Supreme Court Law Reports.\n</div>\n\n---\n\n### 🧠 3. Layer 2: Underlying Reasoning (\"The Why\")\nWhy was this specific institutional framework established in Indian democracy?\n1. To ensure institutional autonomy and prevent majoritarian executive overreach.\n2. To uphold the Rule of Law and Constitutional Morality across central and state administrations.\n\n---\n\n### 🧮 4. Layer 3: Worked Application (Practical Governance Scenario)\n**Scenario:** A administrative dispute arises concerning Schedules of the Indian Constitution (1st to 12th Schedule).\n\n**Step-by-Step Resolution:**\n1. Reference the governing Article or Statutory Enactment.\n2. Apply the binding Supreme Court precedent to resolve the jurisdictional conflict.\n3. Formulate the final constitutionally valid administrative order.\n\n---\n\n### 🏛️ 5. Concrete Anchor (Case Study)\n**Benchmark Landmark Case:** Supreme Court judgment establishing the operational boundaries and constitutional safeguards for Schedules of the Indian Constitution (1st to 12th Schedule).\n\n---\n\n### ⚖️ 6. Debates & Controversies\n**Institutional Autonomy vs Executive Control:**\n- *The Controversy:* Balancing institutional independence with executive oversight and financial accountability.\n- *Phase 2 Core Question:* \"Critically evaluate the working and emerging challenges surrounding Schedules of the Indian Constitution (1st to 12th Schedule) in contemporary governance.\"\n\n---\n\n### ❓ 7. 3-Tier Practice & Retention Section\n- **Tie Article 1** | Name & Territory of Union | Specifies 3 categories: Territories of States, UTs, Acquired Territories |\n| **Article 2** | Admission of New States | Parliament power to admit territories outside existing India |\n| **Article 3** | Internal Reorganisation | Requires Presidential recommendation + State Assembly view consultation (View NOT binding!) |\n| **Article 4** | Simple Majority Exemption | Explicitly excludes Art 2 & 3 laws from Article 368 procedural rigidity |\n\n<div class=\"exam-highlight-box\">\n  <h4>🏷️ Itemized Verification Tag</h4>\n  ✅ <strong>Verified Feb 2026 (Itemized):</strong> Articles 1-4 & Berubari Union 1960 ceding procedure verified against Constitution text & SC Reports.\n</div>\n\n---\n\n### 🧠 3. Layer 2: Underlying Reasoning (\"The Why\")\nWhy does Article 3 require **Presidential Consultation** with state legislatures, but makes their opinion **NOT binding**?\n1. Framers recognized that regional linguistic chauvinism could block national integration.\n2. Giving states a veto would prevent rational economic and administrative state reorganization.\n\n---\n\n### 🧮 4. Layer 3: Worked Application (Practical Governance Scenario)\n**Scenario:** India agrees to cede a small border enclave to a neighboring nation under an international boundary treaty.\n\n**Step-by-Step Resolution:**\n1. Under *Berubari Union Case (1960)*, Supreme Court held that Parliament's power to alter boundaries under Article 3 does NOT include the power to cede Indian territory to a foreign country.\n2. Ceding Indian territory requires a **Constitutional Amendment under Article 368** (e.g. 100th CAA 2015 for India-Bangladesh enclaves exchange).\n\n---\n\n### 🏛️ 5. Concrete Anchor (Case Study)\n**Re Berubari Union (1960) & 100th CAA (2015):** 100th CAA amended the 1st Schedule to exchange 111 enclaves to Bangladesh in return for 51 enclaves.\n\n---\n\n### ⚖️ 6. Debates & Controversies\n**Ceding Territory vs Boundary Adjustment:**\n- *The Controversy:* Minor boundary adjustments can be made via executive agreement (*Ram Kishore Sen 1966*), but actual territory cession requires Article 368.\n- *Phase 2 Core Question:* \"Article 3 makes the Indian Parliament the master of internal political geography.\" Discuss.\n\n---\n\n### ❓ 7. 3-Tier Practice & Retention Section\n- **Tier 1 (Recall MCQ):** Reorganisation of states under Article 3 requires: (A: Special Majority + State Consent, **B: Simple Majority + Non-binding State View**, C: 3/4th Majority) [Correct: B].\n- **Tier 2 (Applied Scenario):** Differentiate between Article 2 and Article 3 powers.\n- **Tier 3 (Mains Prompt):** *'India is an indestructible union of destructible states.'* Examine."

    let selectedSubject = 'polity';
    let currentChapterIndex = 0;
    let currentTheme = 'sepia';
    let currentFontSize = 1.12;

    // --- DOM Elements ---
    const readerPaneEl = document.getElementById('readerPane');
    const bookStreamEl = document.getElementById('bookStream');
    const tocListEl = document.getElementById('tocList');
    const tocSidebarEl = document.getElementById('tocSidebar');
    const progressBarFillEl = document.getElementById('progressBarFill');
    const headerSubtitleEl = document.getElementById('headerSubtitle');
    const chapterCountBadgeEl = document.getElementById('chapterCountBadge');

    function filterSubject(subject) {
      selectedSubject = subject;
      document.querySelectorAll('.subject-btn').forEach(btn => {
        btn.classList.toggle('active', btn.id === `tab-${subject}`);
      });

      const activeData = getFilteredBookData();

      if (headerSubtitleEl) {
        if (subject === 'all') headerSubtitleEl.innerText = 'Master CogniGraph Corpus (186 Chapters)';
        else if (subject === 'polity') headerSubtitleEl.innerText = 'M. Laxmikanth Master Series (55 Chapters)';
        else if (subject === 'economics') headerSubtitleEl.innerText = 'Macro & Micro Economics Series (45 Chapters)';
        else if (subject === 'history') headerSubtitleEl.innerText = 'History NCERT & Standard Series (57 Chapters)';
        else if (subject === 'geography') headerSubtitleEl.innerText = 'Geography NCERT Series (12 Chapters)';
        else if (subject === 'science') headerSubtitleEl.innerText = 'Science NCERT Series (12 Chapters)';
        else if (subject === 'revision') headerSubtitleEl.innerText = 'Rapid Revision & Exam Traps (5 Chapters)';
      }

      if (chapterCountBadgeEl) {
        chapterCountBadgeEl.innerText = `${activeData.length} Chapters`;
      }

      renderToc();
      renderBookStream();
      setupScrollObserver();
      if (readerPaneEl) readerPaneEl.scrollTop = 0;
    }

    function getFilteredBookData() {
      if (selectedSubject === 'all') return rawBookData;
      return rawBookData.filter(ch => ch.subject === selectedSubject);
    }

    function renderToc() {
      const activeData = getFilteredBookData();
      tocListEl.innerHTML = '';

      activeData.forEach((ch, idx) => {
        const item = document.createElement('li');
        item.className = `toc-item ${idx === currentChapterIndex ? 'active' : ''}`;
        item.onclick = () => scrollToChapter(idx);
        item.innerHTML = `
          <span class="toc-ch-num">${ch.chNum}</span>
          <span class="toc-ch-title">${ch.title}</span>
        `;
        tocListEl.appendChild(item);
      });
    }

    function renderBookStream() {
      const activeData = getFilteredBookData();
      bookStreamEl.innerHTML = '';

      activeData.forEach((ch, idx) => {
        const chapterSection = document.createElement('section');
        chapterSection.id = `chapter-section-${idx}`;
        chapterSection.className = 'kindle-screen-chapter';

        let subjectIcon = '📈';
        if (ch.subject === 'history') subjectIcon = '🏛️';
        if (ch.subject === 'geography') subjectIcon = '🌍';
        if (ch.subject === 'polity') subjectIcon = '⚖️';
        if (ch.subject === 'science') subjectIcon = '🔬';
        if (ch.subject === 'revision') subjectIcon = '⚡';

        chapterSection.innerHTML = `
          <div class="chapter-header">
            <div class="subject-badge">${subjectIcon} ${ch.subjectName} • Chapter ${ch.chNum}</div>
            <div class="chapter-book-label">${ch.book}</div>
            <h1 class="chapter-title">${ch.title}</h1>
            <div class="reading-meta">
              <span>⏱️ ${ch.readTime}</span>
              <span>🏷️ ${ch.examTags}</span>
            </div>
          </div>

          <div class="feynman-banner">
            <div class="feynman-banner-label">⚡ First-Principle Truth</div>
            <div class="feynman-truth">${ch.truth}</div>
          </div>

          <div class="chapter-content">
            ${marked.parse(ch.body)}
          </div>

          <div class="chapter-recall-card">
            <div class="recall-card-title">🎴 Chapter Retention Test</div>
            <div class="recall-card-question">Can you state the fundamental core truth of this chapter in 1 simple sentence?</div>
            <button class="btn-ui" style="padding: 8px 18px;" onclick="toggleAnswer(${idx})">Click to Reveal First-Principle Answer</button>
            <div id="recall-answer-${idx}" class="recall-card-answer">
              <div>${ch.truth}</div>
            </div>
          </div>
        `;

        bookStreamEl.appendChild(chapterSection);
      });

      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise();
      }
    }

    function toggleAnswer(idx) {
      const el = document.getElementById(`recall-answer-${idx}`);
      if (el) el.classList.toggle('show');
    }

    function setTheme(theme) {
      currentTheme = theme;
      document.body.className = `theme-${theme}`;
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase().includes(theme));
      });
    }

    function adjustFontSize(delta) {
      currentFontSize = Math.max(0.8, Math.min(2.0, currentFontSize + delta * 0.08));
      document.documentElement.style.setProperty('--reader-font-size', `${currentFontSize}rem`);
    }

    function toggleToc() {
      if (tocSidebarEl) {
        tocSidebarEl.classList.toggle('collapsed');
      }
    }

    function scrollToChapter(index) {
      const el = document.getElementById(`chapter-section-${index}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        highlightTocItem(index);
      }
    }

    function highlightTocItem(index) {
      currentChapterIndex = index;
      document.querySelectorAll('.toc-item').forEach((item, idx) => {
        item.classList.toggle('active', idx === index);
      });
    }

    function setupScrollObserver() {
      const activeData = getFilteredBookData();
      const observerOptions = {
        root: readerPaneEl,
        threshold: 0.15
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const idx = parseInt(entry.target.id.replace('chapter-section-', ''));
            if (!isNaN(idx)) {
              highlightTocItem(idx);
            }
          }
        });
      }, observerOptions);

      activeData.forEach((_, idx) => {
        const el = document.getElementById(`chapter-section-${idx}`);
        if (el) observer.observe(el);
      });

      if (readerPaneEl) {
        readerPaneEl.addEventListener('scroll', () => {
          const scrollTop = readerPaneEl.scrollTop;
          const scrollHeight = readerPaneEl.scrollHeight - readerPaneEl.clientHeight;
          if (scrollHeight > 0) {
            const pct = (scrollTop / scrollHeight) * 100;
            if (progressBarFillEl) progressBarFillEl.style.width = `${pct}%`;
          }
        });
      }
    }

    // --- Initial Launch ---
    setTheme(currentTheme);
    document.documentElement.style.setProperty('--reader-font-size', `${currentFontSize}rem`);
    filterSubject(selectedSubject);</script>
