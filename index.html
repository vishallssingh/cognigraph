    "examTags": "Direct vs Indirect Taxes, GST, Input Tax Credit, Cascading Effect, GST Council Article 279A, 15th FC",
    "truth": "GST subsumed multiple indirect taxes under the 101st Amendment, eliminating cascading tax-on-tax through the Input Tax Credit (ITC) mechanism.",
    "body": "### ⚡ 1. Beginner Jargon Unpack\n- **Direct Tax:** Tax levied directly on income or wealth of an individual or entity where tax burden cannot be shifted (Income Tax, Corporation Tax).\n- **Indirect Tax:** Tax levied on goods and services where tax burden is passed on to the final consumer (GST, Customs Duty).\n- **Cascading Tax Effect:** \"Tax on Tax\" phenomenon where tax is levied at each stage on the total value including taxes paid at previous stages.\n- **Input Tax Credit (ITC):** Mechanism allowing businesses to deduct the tax already paid on raw material inputs from the tax payable on final output sales.\n- **GST Council (Article 279A):** Constitutional body chaired by Union Finance Minister regulating GST rates, exemptions, and rules.\n\n---\n\n### 📖 2. Layer 1: Core Tax Framework & GST Architecture\n- **101st Constitutional Amendment Act (2016):** Introduced GST, subsuming 17 central & state indirect taxes (Excise, VAT, Service Tax, Octroi).\n- **GST Structure:** Destination-based consumption tax divided into **CGST**, **SGST/UTGST**, and **IGST** (inter-state trade).\n- **GST Council Voting Formula (Article 279A):**\n  - Central Government Vote Weight = **1/3** (33.33%).\n  - All State Governments Vote Weight = **2/3** (66.67%).\n  - Decision Threshold = **3/4 Majority** (75%) of weighted votes.\n- **15th Finance Commission Vertical Devolution:** **41%** of central divisible tax pool devolved to States.\n\n<div class=\"exam-highlight-box\">\n  <h4>🏷️ Verification & Source</h4>\n  ✅ <strong>Verified Feb 2026:</strong> GST Council Secretariat & 15th Finance Commission Report.\n</div>\n\n---\n\n### 🧠 3. Layer 2: Underlying Economic Reasoning (\"The Why\")\nHow does Input Tax Credit (ITC) eliminate the Cascading Tax Effect?\n\n**The Tax-on-Tax Elimination Mechanism:**\n1. **Without ITC (Old System):**\n   - Supplier sells raw material for ₹100 + 10% tax = ₹110.\n   - Manufacturer adds ₹50 value <code>longrightarrow</code> Total price = ₹160.\n   - Next tax 10% applied on ₹160 = ₹16 ⟶ Consumer pays tax on previous ₹10 tax! (**Cascading Effect!**)\n2. **With ITC (GST System):**\n   - Manufacturer claims credit for ₹10 tax paid on raw material inputs.\n   - Manufacturer pays tax ONLY on added value (₹50 × 10% = ₹5) ⟶ Eliminates tax-on-tax!\n\n---\n\n### 🧮 4. Layer 3: Worked Numerical / Applied Calculation (Input Tax Credit)\n**Scenario:** A leather shoe manufacturer operates under the 18% GST rate:\n- Purchases raw leather for **₹10,000** and pays 18% GST on input = **₹1,800 Input Tax Credit (ITC)**.\n- Processes leather into shoes, adding value, and sells final output for **₹18,000**.\n- Output GST levied at 18% on ₹18,000 = **₹3,240 Total Output Tax**.\n\n**Problem:** \n1. Calculate Gross Output GST collected from buyer.\n2. Calculate Net GST Cash Liability payable to the government after claiming ITC.\n\n**Step-by-Step Solution:**\n\n1. **Calculate Gross Output Tax:**\n   <div class=\"formula-box\">Gross Output Tax = 18% × ₹18,000 = ₹3,240</div>\n\n2. **Calculate Net Cash Tax Payable to Government:**\n   <div class=\"formula-box\">Net GST Payable = Gross Output Tax - Input Tax Credit (ITC)</div>\n   <div class=\"formula-box\">Net GST Payable = ₹3,240 - ₹1,800 = ₹1,440 Cash Tax Payable</div>\n\n*Verification:* ₹1,440 equals 18% tax on the ₹8,000 net value added (₹18,000 - ₹10,000).\n\n---\n\n### 🏛️ 5. Concrete Anchor (Case Study)\n**Record GST Collections in FY25-26:**\nMonthly gross GST collections consistently cross **₹1.80+ Lakh Crore**, driven by e-way bill digital tracking, automated ITC reconciliation, and anti-evasion analytics.\n\n---\n\n### ⚖️ 6. Debates, Controversies & Phase-2 Mains Analysis\n**Fiscal Federalism & State Autonomy under GST:**\n- *The Controversy:* By surrendering independent state VAT powers to the GST Council, states lost fiscal autonomy to independently raise tax rates during crises. When central GST Compensation Cess expired in 2022, several manufacturing states faced revenue shortfalls.\n- *Phase 2 Core Question:* \"The GST Council is a model of cooperative federalism, but state fiscal dependence on the Centre has increased.\" Evaluate.\n\n---\n\n### 🔗 7. Structural Cross-Links\n- 🔗 **Connects to Ch 5:** Product Taxes vs Production Taxes.\n- 🔗 **Connects to Ch 16:** Indirect Taxes & CPI.\n- 🔗 **Connects to Ch 34:** Government Budget Receipts."

    "title": "36. Banking System in India: Commercial Banks, RRBs, Co-operatives & SFBs",

    "examTags": "PSBs, RRBs, Cooperative Banks, Small Finance Banks, D-SIBs, Priority Sector Lending",
    "truth": "Scheduled Commercial Banks must allocate 40% of bank credit to Priority Sector Lending (PSL), while D-SIBs ('too big to fail') face higher capital requirements.",
    "body": "### ⚡ 1. Beginner Jargon Unpack\n- **Scheduled Commercial Bank (SCB):** Banks included in the 2nd Schedule of RBI Act 1934 (must have paid-up capital <code>ge</code> ₹5 Lakh and satisfy depositor safety rules).\n- **D-SIBs (Domestic Systemically Important Banks):** Banks deemed \"Too Big to Fail\" whose failure would collapse the economy (SBI, HDFC Bank, ICICI Bank).\n- **Priority Sector Lending (PSL):** Mandatory quota of bank credit directed to vulnerable sectors (Agriculture, MSMEs, Education, Housing, Renewable Energy).\n- **Small Finance Banks (SFBs):** Specialized niche banks providing basic banking to unserved segments (75% PSL target requirement).\n- **Payments Banks:** Niche banks accepting demand deposits up to ₹2 Lakh per individual, but **CANNOT issue credit cards or extend loans!**\n\n---\n\n### 📖 2. Layer 1: Banking Structure & PSL Targets\n**Priority Sector Lending (PSL) Targets:**\n- **Scheduled Commercial Banks (Domestic & Foreign <code>ge 20</code> branches):** **40% of ANBC** (Adjusted Net Bank Credit).\n  - Agriculture Sub-target: **18%** of ANBC.\n  - Micro Enterprises Sub-target: **7.5%** of ANBC.\n  - Small & Marginal Farmers Sub-target: **10%** of ANBC.\n- **Regional Rural Banks (RRBs) & Small Finance Banks (SFBs):** **75% of ANBC** (Higher inclusion mandate).\n\n<div class=\"exam-highlight-box\">\n  <h4>🏷️ Verification & Source</h4>\n  ✅ <strong>Verified Feb 2026:</strong> RBI Master Directions on Priority Sector Lending & D-SIB Framework.\n</div>\n\n---\n\n### 🧠 3. Layer 2: Underlying Economic Reasoning (\"The Why\")\nWhy does RBI impose RIDF penalties on banks that miss PSL targets?\n\n**The Social Credit Enforcement Mechanism:**\nCommercial banks naturally prefer lending large sums to low-risk corporates over small rural farmers. \nIf a bank fails to reach its 40% PSL target:\n- The shortfall amount is automatically siphoned off into the **Rural Infrastructure Development Fund (RIDF)** managed by NABARD at low interest rates.\n- This forces banks to either lend to rural priorities directly or finance rural infrastructure via NABARD.\n\n---\n\n### 🧮 4. Layer 3: Worked Numerical / Applied Calculation (PSL Shortfall Deposit)\n**Scenario:** A private commercial bank reports an Adjusted Net Bank Credit (ANBC) of **₹50,000 Crore**.\n- Mandatory Total PSL Target = **40% of ANBC**.\n- Actual PSL Loans disbursed by the bank = **₹16,000 Crore**.\n\n**Problem:** \n1. Calculate the required PSL Target Amount.\n2. Calculate the PSL Shortfall Amount.\n3. Calculate mandatory fund transfer to RIDF (NABARD).\n\n**Step-by-Step Solution:**\n\n1. **Calculate Required PSL Target Amount:**\n   <div class=\"formula-box\">Required PSL Target = 40% × ₹50,000 Cr = ₹20,000 Crore</div>\n\n2. **Calculate PSL Shortfall Amount:**\n   <div class=\"formula-box\">PSL Shortfall = Required Target - Actual Disbursed = ₹20,000 Cr - ₹16,000 Cr = ₹4,000 Crore</div>\n\n3. **Calculate Mandatory RIDF Deposit:**\n   <div class=\"formula-box\">Mandatory RIDF Deposit = ₹4,000 Crore siphoned to NABARD</div>\n\n---\n\n### 🏛️ 5. Concrete Anchor (Case Study)\n**Paytm Payments Bank Regulatory Enforcement (2024):**\nRBI barred Paytm Payments Bank from accepting fresh deposits or wallet top-ups due to persistent non-compliance with KYC norms, proving that niche banks face strict regulatory oversight despite digital popularity.\n\n---\n\n### ⚖️ 6. Debates, Controversies & Phase-2 Mains Analysis\n**Privatization of Public Sector Banks (PSBs):**\n- *The Controversy:* Government announced plans to privatize 2 PSBs. Critics argue private banks ignore rural branches and social welfare schemes (Jan Dhan/PM-KISAN), seeking only profit. Proponents point out that PSBs suffered high NPAs and required ₹3+ Lakh Crore taxpayer recapitalization.\n- *Phase 2 Core Question:* \"Public Sector Banks serve a social purpose that private banks cannot replicate.\" Evaluate the PSB privatization debate in India.\n\n---\n\n### 🔗 7. Structural Cross-Links\n- 🔗 **Connects to Ch 31:** RBI Monetary Policy.\n- 🔗 **Connects to Ch 37:** NPA Crisis & IBC 2016.\n- 🔗 **Connects to Ch 38:** Money Markets vs Capital Markets."

    "id": "eco-ch-37",
    "book": "Book IV: Monetary Economics, Inflation & RBI Framework",
    "title": "37. NPA Crisis, IBC 2016, Bad Bank (NARCL) & Basel III Framework",
    "readTime": "10 min read",
    "examTags": "NPA, Gross vs Net NPA, IBC 2016, CIRP, NARCL Bad Bank, Basel III, CRAR",
    "truth": "IBC 2016 revolutionized insolvency by shifting control from debtors to creditors under NCLT, while Basel III enforces a minimum 11.5% CRAR capital adequacy buffer.",
    "body": "### ⚡ 1. Beginner Jargon Unpack\n- **NPA (Non-Performing Asset):** A loan or advance where interest or principal payment remains overdue for more than **90 days**.\n- **Gross NPA:** Total value of all defaulted loans on a bank's books.\n- **Net NPA:** Gross NPA minus the Provisioning Funds set aside by the bank.\n- **IBC (Insolvency and Bankruptcy Code 2016):** Unified legal framework for time-bound resolution of corporate insolvency.\n- **CIRP:** Corporate Insolvency Resolution Process conducted via National Company Law Tribunal (NCLT).\n- **NARCL (Bad Bank):** National Asset Reconstruction Company Ltd created to aggregate and resolve stressed bad loans from banks.\n- **CRAR (Capital to Risk-Weighted Assets Ratio):** Ratio of a bank's capital to its risk-weighted credit assets (measures safety buffer).\n\n---\n\n### 📖 2. Layer 1: Asset Classification & Basel III Standards\n**NPA Asset Classification:**\n1. **Sub-standard Asset:** NPA for <code>le 12</code> months.\n2. **Doubtful Asset:** NPA for <code>> 12</code> months.\n3. **Loss Asset:** Uncollectible asset identified by RBI or auditors.\n\n**Basel III CRAR Requirements:**\n- **Global Basel III Minimum CRAR:** **9.0%**\n- **RBI Prescribed Minimum CRAR:** **11.5%** (Includes 2.5% Capital Conservation Buffer).\n\n<div class=\"exam-highlight-box\">\n  <h4>🏷️ Verification & Source</h4>\n  ✅ <strong>Verified Feb 2026:</strong> RBI Financial Stability Report (Gross NPA at 12-year low ~2.8%) & IBBI Reports.\n</div>\n\n---\n\n### 🧠 3. Layer 2: Underlying Economic Reasoning (\"The Why\")\nWhy did IBC 2016 succeed where SARFAESI Act and DRTs failed?\n\n**The Creditor-in-Control Paradigm Shift:**\n- **Pre-2016 System (Debtor-in-Possession):** Defaulting promoters stayed in control of factories for 10+ years while cases dragged in Debt Recovery Tribunals (DRTs) ⟶ Assets rusted and lost value!\n- **Post-2016 System (Creditor-in-Control):** The moment 90-day default occurs, NCLT suspends promoter management and appoints an Independent Resolution Professional. If no resolution in 180 days, company is liquidated ⟶ Promoters fear losing control, forcing timely repayment!\n\n---\n\n### 🧮 4. Layer 3: Worked Numerical / Applied Calculation (CRAR Capital Buffer)\n**Formula:**\n$<code>\text{CRAR} = left( \frac{\text{Tier 1 Capital} + \text{Tier 2 Capital}}{\text{Total Risk-Weighted Assets (RWA)}} \right) \times 100</code>$\n\n**Scenario:** A commercial bank reports the following balance sheet figures:\n- Tier-1 Equity Capital = **₹9,000 Crore**.\n- Tier-2 Debt Capital = **₹4,500 Crore**.\n- Total Risk-Weighted Credit Assets (RWA) = **₹100,000 Crore**.\n\n**Problem:** \n1. Calculate the Bank's Total Capital.\n2. Calculate the Bank's CRAR percentage.\n3. Evaluate if the bank satisfies RBI's mandatory 11.5% CRAR requirement.\n\n**Step-by-Step Solution:**\n\n1. **Calculate Total Capital:**\n   <div class=\"formula-box\">Total Capital = Tier 1 + Tier 2 = ₹9,000 Cr + ₹4,500 Cr = ₹13,500 Crore</div>\n\n2. **Calculate CRAR Percentage:**\n   <div class=\"formula-box\">CRAR = (₹13,500 Cr / ₹100,000 Cr) × 100 = 13.50%</div>\n\n3. **Evaluate RBI Compliance:**\n   Since CRAR = 13.50% ≥ 11.50% RBI requirement, the bank maintains an adequate capital safety buffer.\n\n---\n\n### 🏛️ 5. Concrete Anchor (Case Study)\n**Resolution of Essar Steel under IBC:**\nArcelorMittal acquired the insolvent Essar Steel through NCLT CIRP proceedings, paying **₹42,000 Crore** to financial creditors and resolving one of India's largest bad loan defaults.\n\n---\n\n### ⚖️ 6. Debates, Controversies & Phase-2 Mains Analysis\n**Haircuts & NCLT Delays:**\n- *The Controversy:* In several IBC resolutions, banks suffered \"haircuts\" (write-offs) exceeding 70-80% of loan value. Furthermore, while IBC mandates a 180-day resolution, average NCLT resolution time exceeds 600 days due to judicial vacancy backlogs.\n- *Phase 2 Core Question:* \"The Twin Balance Sheet Crisis has ended, but bad debt resolution requires faster NCLT judicial processing.\" Critically examine.\n\n---\n\n### 🔗 7. Structural Cross-Links\n- 🔗 **Connects to Ch 31:** RBI Banking Supervision.\n- 🔗 **Connects to Ch 36:** Commercial Banking System.\n- 🔗 **Connects to Ch 38:** Capital Markets & Debt."

    "truth": "The Money Market deals in short-term debt instruments (<1 year) regulated by RBI, whereas the Capital Market deals in long-term equity and bonds (>1 year) regulated by SEBI.",
    "body": "### ⚡ 1. Beginner Jargon Unpack\n- **Money Market:** Market for short-term funds with maturity up to **1 year** (Regulated by RBI).\n- **Capital Market:** Market for long-term equity shares and debt instruments with maturity exceeding **1 year** (Regulated by SEBI).\n- **Treasury Bills (T-Bills):** Short-term debt instruments issued by RBI on behalf of Government of India at a discount to face value (91-day, 182-day, 364-day).\n- **Commercial Paper (CP):** Short-term unsecured promissory note issued by highly rated corporates to raise short-term working capital.\n- **T+1 Settlement:** Settlement system where stock market trades clear and shares/funds deposit into account within **24 hours** (1 business day post-trade).\n\n---\n\n### 📖 2. Layer 1: Financial Market Classification & Regulatory Domains\n| Parameter | Money Market | Capital Market |\n|---|---|---|\n| **Regulator** | **Reserve Bank of India (RBI)** | **SEBI** (Securities & Exchange Board) |\n| **Maturity** | **Short-Term (< 1 Year)** | **Long-Term (> 1 Year)** |\n| **Instruments** | T-Bills, Call Money, CP, CDs | Equity Shares, Preference Shares, Bonds |\n| **Primary Function**| Working Capital & Cash Liquidity | Long-Term Capital Investment |\n| **Participants** | RBI, Banks, Financial Institutions | Retail Investors, FPIs, Mutual Funds |\n\n<div class=\"exam-highlight-box\">\n  <h4>🏷️ Verification & Source</h4>\n  ✅ <strong>Verified Feb 2026:</strong> SEBI Annual Report & NSE/BSE Market Data.\n</div>\n\n---\n\n### 🧠 3. Layer 2: Underlying Economic Reasoning (\"The Why\")\nHow are Treasury Bills (T-Bills) priced on a Discount Basis?\n\n**The Zero-Coupon Discount Mechanism:**\n- T-Bills do NOT pay periodic interest (Zero-Coupon).\n- Instead, RBI issues a ₹100 T-Bill at a **discounted price** (e.g. ₹97.50).\n- At maturity (91 days later), RBI pays the investor the full **Face Value of ₹100**.\n- The difference (<code>100 - 97.50 = ₹2.50</code>) is the investor's implicit interest return!\n\n---\n\n### 🧮 4. Layer 3: Worked Numerical / Applied Calculation (T-Bill Yield)\n**Formula:**\n$<code>\text{Annualized Yield %} = left( \frac{\text{Face Value} - \text{Issue Price}}{\text{Issue Price}} \right) \times left( \frac{365}{\text{Tenure Days}} \right) \times 100</code>$\n\n**Scenario:** RBI issues a **91-Day Treasury Bill** with Face Value = **₹100**.\n- Investor purchases the T-Bill at auction for **₹98.50**.\n\n**Problem:** Calculate the Annualized Interest Yield percentage earned by the investor.\n\n**Step-by-Step Solution:**\n\n1. **Calculate Absolute Discount Gain:**\n   <div class=\"formula-box\">Discount Gain = ₹100 - ₹98.50 = ₹1.50</div>\n\n2. **Calculate 91-Day Yield:**\n   <div class=\"formula-box\">91-Day Yield = ₹1.50 / ₹98.50 = 0.015228 (1.5228%)</div>\n\n3. **Calculate Annualized Yield (365 Days):**\n   <div class=\"formula-box\">Annualized Yield = 1.5228% × (365 / 91) = 1.5228% × 4.011 = 6.11%</div>\n\n---\n\n### 🏛️ 5. Concrete Anchor (Case Study)\n**India Adopting T+1 Settlement Ahead of Wall Street:**\nIn January 2023, SEBI completed the transition of all listed Indian stocks to the **T+1 Settlement Cycle**, making Indian equity markets faster than the US (which adopted T+1 in May 2024) and reducing broker clearing default risks.\n\n---\n\n### ⚖️ 6. Debates, Controversies & Phase-2 Mains Analysis\n**Retail Demat Surge vs. Financial Literacy:**\n- *The Controversy:* Demat accounts in India surged from 40 Million in 2020 to **160+ Million in 2024-25**, driven by mobile trading apps and YouTube \"finfluencers\". SEBI reports show over 90% of retail day-traders in Futures & Options (F&O) lose money, prompting SEBI to tighten F&O contract sizes.\n- *Phase 2 Core Question:* \"Capital markets are democratizing investment, but speculative derivative trading threatens household savings.\" Evaluate SEBI's investor protection framework.\n\n---\n\n### 🔗 7. Structural Cross-Links\n- 🔗 **Connects to Ch 31:** RBI Open Market Operations (OMO).\n- 🔗 **Connects to Ch 33:** FPI Investments & Equity Markets.\n- 🔗 **Connects to Ch 36:** Commercial Banking System."

    "truth": "Foreign Trade Policy 2023 targets $2 Trillion total exports by 2030, while WTO Agreement on Agriculture subsidy caps conflict with India's PDS food security procurement.",
    "body": "### ⚡ 1. Beginner Jargon Unpack\n- **FTP 2023:** Foreign Trade Policy 2023 published by Ministry of Commerce targeting <code>2 Trillion total exports (</code>1 Trillion Goods + $1 Trillion Services) by 2030.\n- **RoDTEP:** Remission of Duties and Taxes on Exported Products (Compliant scheme refunding un-rebated central/state taxes to exporters).\n- **Agreement on Agriculture (AoA):** WTO framework regulating international trade in agricultural products under 3 pillars: Market Access, Domestic Support, and Export Subsidies.\n- **Amber Box Subsidies:** Trade-distorting farm subsidies (MSP, input subsidies) capped at **10% of total production value** (De-Minimis limit) for developing nations.\n- **Peace Clause:** Temporary WTO protection (Bali Ministerial 2013) preventing member nations from legally challenging a developing country if it breaches Amber Box limits for public food security.\n\n---\n\n### 📖 2. Layer 1: WTO Subsidy Boxes & FTP Pillars\n**WTO Domestic Support Subsidy Classification:**\n1. **Green Box:** Non-trade distorting subsidies (Agricultural R&D, environmental protection, direct income support like PM-KISAN) ⟶ **Allowed without limit!**\n2. **Blue Box:** Production-limiting subsidies ⟶ **Allowed without limit!**\n3. **Amber Box:** Trade-distorting subsidies (MSP price support, fertilizer/power subsidies) ⟶ **Subject to 10% De-Minimis Cap for India!**\n\n<div class=\"exam-highlight-box\">\n  <h4>🏷️ Verification & Source</h4>\n  ✅ <strong>Verified Feb 2026:</strong> Ministry of Commerce Foreign Trade Policy Statement & WTO Committee on Agriculture Records.\n</div>\n\n---\n\n### 🧠 3. Layer 2: Underlying Economic Reasoning (\"The Why\")\nWhy does WTO's Amber Box formula unfairly penalize Indian MSP food procurement?\n\n**The Outdated Reference Price Anomaly:**\n- WTO rules calculate Amber Box subsidy as:\n  $<code>\text{Subsidy} = (\text{Current MSP Price} - \text{External Reference Price}) \times \text{Quantity Procured}</code>$\n- **The Catch:** WTO fixed the External Reference Price using historical **1986–1988 global prices** ($263/tonne for rice)!\n- Due to 35+ years of inflation, current MSP automatically appears to breach the 10% cap when measured against 1986 prices, even though real economic support is minimal!\n\n---\n\n### 🧮 4. Layer 3: Worked Numerical / Applied Calculation (WTO AMS Cap)\n**Scenario:** India produces Rice valued at **₹200,000 Crore** in a agricultural year.\n- Under WTO AoA rules, the maximum allowed Amber Box De-Minimis subsidy limit is **10% of total production value**.\n- Government MSP procurement price support calculated under WTO rules equals **₹24,000 Crore**.\n\n**Problem:** \n1. Calculate the maximum allowed Amber Box subsidy limit.\n2. Determine if India breaches the WTO De-Minimis threshold.\n3. Calculate the excess subsidy requiring WTO **Peace Clause** protection.\n\n**Step-by-Step Solution:**\n\n1. **Calculate Maximum Allowed Subsidy (10% Cap):**\n   <div class=\"formula-box\">Allowed 10% Cap = 10% × ₹200,000 Cr = ₹20,000 Crore</div>\n\n2. **Evaluate Breach Condition:**\n   Since Actual Support (₹24,000 Cr) > Allowed Cap (₹20,000 Cr), India **breaches the 10% WTO limit by ₹4,000 Crore**.\n\n3. **Application of Peace Clause:**\n   India invokes the **Bali Peace Clause**, preventing foreign nations from imposing trade sanctions for the ₹4,000 Crore excess subsidy because it was used for PDS food security.\n\n---\n\n### 🏛️ 5. Concrete Anchor (Case Study)\n**India Invoking Peace Clause for Rice:**\nIndia became the first nation to invoke the WTO Peace Clause multiple times for exceeding the 10% ceiling on rice procurement under the National Food Security Act (NFSA), protecting free foodgrain distribution to 800 Million citizens.\n\n---\n\n### ⚖️ 6. Debates, Controversies & Phase-2 Mains Analysis\n**WTO Dispute Settlement Body Paralysis:**\n- *The Controversy:* The US has blocked the appointment of new judges to the WTO Appellate Body since 2019, paralyzing dispute resolution. India and other nations increasingly turn to bilateral FTAs outside the WTO framework.\n- *Phase 2 Core Question:* \"The WTO is struggling with institutional paralysis while multilateral trade rules conflict with developing world food security.\" Evaluate.\n\n---\n\n### 🔗 7. Structural Cross-Links\n- 🔗 **Connects to Ch 20:** EU CBAM Carbon Tariffs.\n- 🔗 **Connects to Ch 25:** MSP & Public Distribution System (PDS).\n- 🔗 **Connects to Ch 40:** Regional Trade Blocs & FTAs."

    "title": "40. Regional Economic Integration, FTAs & Geoeconomics (RCEP vs. IPEF)",

    "examTags": "FTA, CEPA, RCEP Opt-Out, IPEF, Rules of Origin, RVC Percentage, Friend-shoring",
    "truth": "India opted out of RCEP in 2019 to protect MSMEs from Chinese dumping, shifting toward bilateral FTAs (UAE, Australia, EFTA, UK) with high Rules of Origin safeguards.",
    "body": "### ⚡ 1. Beginner Jargon Unpack\n- **FTA (Free Trade Agreement):** Agreement between countries to reduce or eliminate tariffs, import quotas, and non-tariff barriers on traded goods.\n- **CEPA (Comprehensive Economic Partnership Agreement):** Advanced FTA covering trade in goods, services, investment, intellectual property, and economic cooperation.\n- **RCEP (Regional Comprehensive Economic Partnership):** Mega regional trade agreement among 15 Asia-Pacific nations (including China, Japan, ASEAN). India opted out in 2019.\n- **IPEF (Indo-Pacific Economic Framework):** US-led 14-nation economic framework (including India) focusing on Supply Chains, Clean Energy, and Fair Economy (excluding tariff cuts).\n- **Rules of Origin:** Criteria used to determine the national source of a product to prevent third-party non-FTA countries from routing cheap goods through an FTA partner.\n\n---\n\n### 📖 2. Layer 1: Trade Hierarchy & India's Recent FTAs\n**Trade Agreement Hierarchy:**\n$<code>\text{PTA (Preferential)} longrightarrow \text{FTA (Free Trade)} longrightarrow \text{CECA / CEPA (Comprehensive)} longrightarrow \text{Customs Union} longrightarrow \text{Economic Union}</code>$\n\n**Key Recent Indian Trade Deals:**\n- **UAE CEPA (2022):** Zero-duty access for 90%+ Indian exports; boosted bilateral trade to $85+ Billion.\n- **Australia ECTA (2022):** Zero duty on 96% Indian exports (textiles, leather, gems).\n- **EFTA TEPA (2024):** Historic deal with European Free Trade Association (Switzerland, Norway, Iceland, Liechtenstein) committing **$100 Billion foreign investment into India** over 15 years.\n\n<div class=\"exam-highlight-box\">\n  <h4>🏷️ Verification & Source</h4>\n  ✅ <strong>Verified Feb 2026:</strong> Ministry of Commerce Trade Agreement Monitoring Division Releases.\n</div>\n\n---\n\n### 🧠 3. Layer 2: Underlying Economic Reasoning (\"The Why\")\nWhy did India opt out of RCEP in November 2019?\n\n**The Chinese Dumping & Inverted Duty Hazard:**\n1. China dominates manufacturing in RCEP member states.\n2. If India agreed to zero tariffs under RCEP, Chinese steel, electronics, and textiles would be routed through ASEAN countries into India with zero duty.\n3. Lack of **Auto-Trigger Safeguard Mechanisms** would have destroyed Indian MSMEs and dairy farmers (competing against New Zealand dairy exports).\n\n---\n\n### 🧮 4. Layer 3: Worked Numerical / Applied Calculation (Rules of Origin RVC)\n**Formula (Regional Value Content - RVC):**\n$<code>\text{RVC %} = left( \frac{\text{Final Export Price} - \text{Value of Non-Originating Third-Party Inputs}}{\text{Final Export Price}} \right) \times 100</code>$\n\n**Scenario:** A garment manufacturer in Vietnam exports jackets to India under an ASEAN-India FTA.\n- Final Export Selling Price = **$100 per jacket**.\n- Value of cheap Chinese fabric imported into Vietnam = **$65 per jacket**.\n- Value added inside Vietnam (labor/stitching) = **$35 per jacket**.\n- FTA Rule of Origin requirement: **Minimum 40% RVC** required to qualify for zero-tariff entry into India.\n\n**Problem:** \n1. Calculate the Regional Value Content (RVC %) of the jacket.\n2. Determine if the jacket qualifies for zero-tariff entry into India under the FTA rules.\n\n**Step-by-Step Solution:**\n\n1. **Calculate RVC Percentage:**\n   <div class=\"formula-box\">RVC = ((<code>100 - </code>65) / <code>100) × 100 = (</code>35 / $100) × 100 = 35.00%</div>\n\n2. **Evaluate FTA Eligibility:**\n   Since RVC = 35.00% < 40% minimum requirement, the product **FAILS the Rules of Origin threshold** and CANNOT enter India at zero tariff!\n\n---\n\n### 🏛️ 5. Concrete Anchor (Case Study)\n**Swiss Watch Tariffs & $100 Billion EFTA Investment Commitment:**\nUnder the 2024 EFTA deal, India agreed to phase out import duties on Swiss watches and chocolates over 10 years, in exchange for a legally binding commitment by Swiss/Norwegian pension funds to invest **$100 Billion in Indian manufacturing and infrastructure**.\n\n---\n\n### ⚖️ 6. Debates, Controversies & Phase-2 Mains Analysis\n**Friend-Shoring vs. Multilateral Globalization:**\n- *The Controversy:* Geopolitical friction between US-China has led to \"friend-shoring\" (building supply chains only with trusted allies). Critics argue bilateral FTAs create trade diversion. Proponents point out that secure supply chains protect national sovereignty.\n- *Phase 2 Core Question:* \"India's strategic shift from mega multilateral trade blocs (RCEP) to targeted bilateral FTAs balances domestic industrial protection with export growth.\" Discuss.\n\n---\n\n### 🔗 7. Structural Cross-Links\n- 🔗 **Connects to Ch 22:** Manufacturing & PLI Reshoring.\n- 🔗 **Connects to Ch 32:** BoP & Exchange Rates.\n- 🔗 **Connects to Ch 39:** Foreign Trade Policy & WTO."

    "body": "### Pre-Modern to Inter-War Global Integration:\n- **Rinderpest (Cattle Plague) in Africa (1890s):** Carried by infected cattle imported from British Asia; killed 90% of African cattle, destroying pastoral livelihoods and forcing Africans into wage labor for colonizers.\n- **Indentured Labor Migration:** System of forced labor contracts (*\"new system of slavery\"*) transporting Indian laborers to Caribbean (Trinidad, Guyana, Suriname), Mauritius, and Fiji.\n\n### The Great Depression (1929–1930s) & Bretton Woods:\n- **Great Depression:** Triggered by US stock market crash (Oct 1929) and agricultural overproduction. World trade fell by 50–60%; Indian agricultural exports collapsed.\n- **Bretton Woods Conference (1944):** Established the **IMF** and **World Bank (IBRD)** to maintain international financial stability and finance post-war reconstruction based on fixed exchange rates anchored to USD ($35 per ounce of gold)."

    // Filter State & Preferences
    let selectedSubject = localStorage.getItem('kindle_subject_filter') || 'economics';
    let currentChapterIndex = 0;
    let currentTheme = localStorage.getItem('kindle_theme') || 'sepia';
    let currentFontSize = parseInt(localStorage.getItem('kindle_font_size')) || 1.12;

    // Filtered Dataset
    function getFilteredBookData() {
      if (selectedSubject === 'all') return rawBookData;
      return rawBookData.filter(ch => ch.subject === selectedSubject);
    }

    // --- DOM References ---
    const tocListEl = document.getElementById('tocList');
    const bookStreamEl = document.getElementById('bookStream');
    const readerPaneEl = document.getElementById('readerPane');
    const progressBarFillEl = document.getElementById('progressBarFill');
    const headerSubtitleEl = document.getElementById('headerSubtitle');
    const tocTitleLabelEl = document.getElementById('tocTitleLabel');

    // --- Subject Filter Logic ---
    function filterSubject(sub) {
      selectedSubject = sub;
      localStorage.setItem('kindle_subject_filter', sub);

      document.querySelectorAll('.subject-btn').forEach(btn => {
        btn.classList.toggle('active', btn.id === `tab-${sub}`);
      });

      if (sub === 'economics') {
        headerSubtitleEl.textContent = "Subject View: Economics & Social Issues (45 Chapters)";
        tocTitleLabelEl.textContent = "Economics Syllabus";
      } else if (sub === 'history') {
        headerSubtitleEl.textContent = "Subject View: History NCERT Complete (57 Chapters - Class 6 to 12)";
        tocTitleLabelEl.textContent = "History Syllabus";
      } else if (sub === 'geography') {
        headerSubtitleEl.textContent = "Subject View: Geography NCERT Complete (12 Chapters - Class 6 to 12)";
        tocTitleLabelEl.textContent = "Geography Syllabus";
      } else if (sub === 'polity') {
        headerSubtitleEl.textContent = "Subject View: M. Laxmikanth Indian Polity Master Series (22 Chapters - Ch 1 to 22)";
        tocTitleLabelEl.textContent = "Laxmikanth Polity";
      } else if (sub === 'science') {
        headerSubtitleEl.textContent = "Subject View: General Science & Technology NCERT (12 Chapters - Class 6 to 12)";
        tocTitleLabelEl.textContent = "Science & Tech Syllabus";
      } else if (sub === 'revision') {
        headerSubtitleEl.textContent = "Revision Engine: Rapid-Fire High-Yield Facts & Exam Traps (5 Modules)";
        tocTitleLabelEl.textContent = "Revision Engine";
      } else {
        headerSubtitleEl.textContent = "Cross-Disciplinary View: All Subjects";
        tocTitleLabelEl.textContent = "Master Syllabus";
      }

      currentChapterIndex = 0;
      renderBookStream();
      renderToc();
      setupScrollObserver();
      readerPaneEl.scrollTop = 0;
    }

    // --- Theme & Font Management ---
    function setTheme(theme) {
      currentTheme = theme;
      document.body.className = `theme-${theme}`;
      localStorage.setItem('kindle_theme', theme);

      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(theme));
      });
    }

    function adjustFontSize(delta) {
      currentFontSize = Math.max(0.9, Math.min(1.45, currentFontSize + delta * 0.06));
      document.documentElement.style.setProperty('--reader-font-size', `${currentFontSize}rem`);
      localStorage.setItem('kindle_font_size', currentFontSize);
    }

    function toggleToc() {
      const sidebar = document.getElementById('tocSidebar');
      sidebar.style.display = (sidebar.style.display === 'none') ? 'flex' : 'none';
    }

    // --- Render Table of Contents ---
    function renderToc() {
      const activeData = getFilteredBookData();
      tocListEl.innerHTML = '';
      let currentBook = '';

      document.getElementById('chapterCountBadge').textContent = `${activeData.length} Chapters`;

      activeData.forEach((ch, idx) => {
        if (ch.book !== currentBook) {
          currentBook = ch.book;
          const bookHeader = document.createElement('li');
          bookHeader.className = 'toc-book-section';
          bookHeader.textContent = currentBook;
          tocListEl.appendChild(bookHeader);
        }

        const item = document.createElement('li');
        item.id = `toc-item-${idx}`;
        item.className = `toc-item ${idx === currentChapterIndex ? 'active' : ''}`;
        item.onclick = () => scrollToChapter(idx);
        item.innerHTML = `
          <span class="toc-num">Ch ${ch.chNum}.</span>
          <span>${ch.title.split('. ')[1] || ch.title}</span>
        `;
        tocListEl.appendChild(item);
      });
    }

    // --- Render Continuous Book Stream ---
    function renderBookStream() {
      const activeData = getFilteredBookData();
      bookStreamEl.innerHTML = '';

      activeData.forEach((ch, idx) => {
        const chapterSection = document.createElement('section');
        chapterSection.id = `chapter-section-${idx}`;
        chapterSection.className = 'kindle-screen-chapter';

        let subjectIcon = '📈';
        if (ch.subject === 'history') subjectIcon = '🏛️';
        if (ch.subject === 'geography') subjectIcon = '🌍';
        if (ch.subject === 'polity') subjectIcon = '⚖️';
        if (ch.subject === 'science') subjectIcon = '🔬';
        if (ch.subject === 'revision') subjectIcon = '⚡';

        chapterSection.innerHTML = `
          <div class="chapter-header">
            <div class="subject-badge">${subjectIcon} ${ch.subjectName} • Chapter ${ch.chNum}</div>
            <div class="chapter-book-label">${ch.book}</div>
            <h1 class="chapter-title">${ch.title}</h1>
            <div class="reading-meta">
              <span>⏱️ ${ch.readTime}</span>
              <span>🏷️ ${ch.examTags}</span>
            </div>
          </div>

          <div class="feynman-banner">
            <div class="feynman-banner-label">⚡ First-Principle Truth</div>
            <div class="feynman-truth">${ch.truth}</div>
          </div>

          <div class="chapter-content">
            ${marked.parse(ch.body)}
          </div>

          <div class="chapter-recall-card">
            <div class="recall-card-title">🎴 Chapter Retention Test</div>
            <div class="recall-card-question">Can you state the fundamental core truth of this chapter in 1 simple sentence?</div>
            <button class="btn-ui" style="padding: 8px 18px;" onclick="toggleAnswer(${idx})">Click to Reveal First-Principle Answer</button>
            <div id="recall-answer-${idx}" class="recall-card-answer">
              <div>${ch.truth}</div>
            </div>
          </div>
        `;

        bookStreamEl.appendChild(chapterSection);
      });

      // Typeset equations with MathJax if available
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise();
      }
    }

    function toggleAnswer(idx) {
      const el = document.getElementById(`recall-answer-${idx}`);
      if (el) el.classList.toggle('show');
    }

    function scrollToChapter(index) {
      const el = document.getElementById(`chapter-section-${index}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        highlightTocItem(index);
      }
    }

    function highlightTocItem(index) {
      currentChapterIndex = index;
      document.querySelectorAll('.toc-item').forEach((item, idx) => {
        item.classList.toggle('active', idx === index);
      });
    }

    // --- Scroll & Intersection Observer for Continuous Infinite Scroll ---
    function setupScrollObserver() {
      const activeData = getFilteredBookData();
      const observerOptions = {
        root: readerPaneEl,
        threshold: 0.15
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const idx = parseInt(entry.target.id.replace('chapter-section-', ''));
            if (!isNaN(idx)) {
              highlightTocItem(idx);
            }
          }
        });
      }, observerOptions);

      activeData.forEach((_, idx) => {
        const el = document.getElementById(`chapter-section-${idx}`);
        if (el) observer.observe(el);
      });

      readerPaneEl.addEventListener('scroll', () => {
        const scrollTop = readerPaneEl.scrollTop;
        const scrollHeight = readerPaneEl.scrollHeight - readerPaneEl.clientHeight;
        if (scrollHeight > 0) {
          const pct = (scrollTop / scrollHeight) * 100;
          progressBarFillEl.style.width = `${pct}%`;
        }
      });
    }

    // --- Initialization ---
    setTheme(currentTheme);
    document.documentElement.style.setProperty('--reader-font-size', `${currentFontSize}rem`);
    filterSubject(selectedSubject);
  </script>
