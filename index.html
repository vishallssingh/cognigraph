      { subject: "geography", subjectName: "Geography NCERT", chNum: 1, id: "geo-ch-1", book: "Book I: Foundations of Physical & Human Geography (NCERT Class 6-8)", title: "1. Solar System, Globe, Motions of Earth & Major Domains", readTime: "6 min read", examTags: "Solar System, Latitude & Longitude, Solstices, Equinox, 4 Domains", truth: "Earth's rotation on its inclined axis creates day and night, while its revolution around the Sun creates seasons, sustaining life across lithosphere, atmosphere, hydrosphere, and biosphere.", body: `### The Solar System & Earth Motions:\n- **8 Planets:** Mercury, Venus (Earth's twin), Earth, Mars, Jupiter, Saturn, Uranus, Neptune.\n- **Rotation:** Earth spins West to East on its axis inclined at **66.5°** to its orbital plane (takes 24 hours).\n- **Revolution:** Earth orbits Sun in an elliptical path (365.25 days).\n  - **Summer Solstice (21 June):** Northern Hemisphere tilted toward Sun; longest day.\n  - **Winter Solstice (22 December):** Southern Hemisphere tilted toward Sun.\n  - **Equinoxes (21 March & 23 September):** Direct sun rays on Equator; equal day and night worldwide.\n\n<div class="exam-highlight-box">\n  <h4>🌐 The 4 Major Earth Domains</h4>\n  • <strong>Lithosphere:</strong> Solid outer crust (Continents & Ocean basins).<br>\n  • <strong>Hydrosphere:</strong> All water bodies (Oceans cover ~71% of surface).<br>\n  • <strong>Atmosphere:</strong> Gas envelope surrounding Earth (78% N2, 21% O2).<br>\n  • <strong>Biosphere:</strong> Narrow contact zone where life exists.\n</div>` },
      { subject: "geography", subjectName: "Geography NCERT", chNum: 2, id: "geo-ch-2", book: "Book I: Foundations of Physical & Human Geography (NCERT Class 6-8)", title: "2. Inside Our Earth, Air, Water & Human Environment", readTime: "6 min read", examTags: "Crust-Mantle-Core, Igneous/Sedimentary/Metamorphic, Composition of Air, Ocean Currents", truth: "Endogenic internal tectonic forces build landforms, while exogenic atmospheric and oceanic forces erode and reshape Earth's surface.", body: `### 1. Earth's Interior Structure:\n- **Crust:** Outermost thin layer. Continental crust (*SIAL* - Silica & Alumina) vs Oceanic crust (*SIMA* - Silica & Magnesium).\n- **Mantle:** Extends down to 2,900 km depth.\n- **Core:** Innermost core (*NIFE* - Nickel & Iron); outer core liquid, inner core solid.\n\n### 2. Rock Cycle:\n- **Igneous (Primary):** Magma cooling (Extrusive basalt vs Intrusive granite).\n- **Sedimentary:** Accumulated strata of weathered fragments (Sandstone, Limestone).\n- **Metamorphic:** Transformed by heat & pressure (Marble from limestone, Slate from clay).\n\n### 3. Ocean Currents:\n- **Warm Currents:** Flow from Equator toward Poles (Gulf Stream).\n- **Cold Currents:** Flow from Poles toward Equator (Labrador Current). Meeting zones create world's richest fishing grounds.` },
      { subject: "geography", subjectName: "Geography NCERT", chNum: 3, id: "geo-ch-3", book: "Book I: Foundations of Physical & Human Geography (NCERT Class 6-8)", title: "3. Resources, Land, Soil, Water, Minerals & Agriculture", readTime: "7 min read", examTags: "Soil Profile, Soil Erosion Control, Mineral Types, Subsistence vs Commercial Farming", truth: "Resource conservation and sustainable soil management are essential to prevent land degradation, desertification, and agricultural collapse.", body: `### Soil Profile & Conservation Techniques:\n- **Factors of Soil Formation:** Parent rock, climate, relief, time, organic matter.\n- **Conservation Methods:**\n  - **Contour Ploughing:** Ploughing parallel to contours to slow water runoff.\n  - **Terrace Farming:** Steep slopes cut into flat steps to reduce soil erosion.\n  - **Shelterbelts:** Rows of trees planted in dry regions to check wind movement.\n\n### Farming Systems:\n- **Subsistence Farming:** Primitive (Jhum shifting cultivation / pastoral nomadism) vs Intensive Subsistence (high labor on small plots).\n- **Commercial Farming:** Commercial grain farming, mixed farming, and **Plantation Agriculture** (tea, coffee, rubber single-crop estates).` },
      { subject: "geography", subjectName: "Geography NCERT", chNum: 4, id: "geo-ch-4", book: "Book II: Contemporary India & Resource Geography (NCERT Class 9-10)", title: "4. India - Physical Features, Drainage Systems & Climate", readTime: "7 min read", examTags: "Himalayas, Indo-Gangetic Plains, Himalayan vs Peninsular Rivers, Indian Monsoon", truth: "India's physiography directly shapes its drainage networks and seasonal Southwest Monsoon precipitation patterns.", body: `### Physiographic Divisions of India:\n1. **Northern Mountains (Himalayas):** Young fold mountains (Himadri, Himachal, Shiwaliks).\n2. **Northern Plains:** Alluvial deposits of Indus, Ganga, and Brahmaputra rivers (Bhabar, Terai, Bhangar, Khadar).\n3. **Peninsular Plateau:** Ancient Gondwanaland block (Central Highlands & Deccan Plateau).\n4. **Coastal Plains & Islands:** Western & Eastern Ghats, Lakshadweep (coral islands), Andaman & Nicobar (volcanic islands).\n\n### River System Comparison:\n- **Himalayan Rivers (Ganga, Indus, Brahmaputra):** Perennial (fed by glaciers), antecedent, long courses with large deltas.\n- **Peninsular Rivers (Godavari, Krishna, Mahanadi, Narmada, Tapti):** Seasonal (rain-fed), mature courses; Narmada & Tapti flow in **Rift Valleys** into Arabian Sea creating estuaries.` },
      { subject: "geography", subjectName: "Geography NCERT", chNum: 5, id: "geo-ch-5", book: "Book II: Contemporary India & Resource Geography (NCERT Class 9-10)", title: "5. Resources, Forest, Water, Minerals & Manufacturing", readTime: "7 min read", examTags: "Resource Classification, Multi-Purpose Dams, Metallic vs Non-Metallic, Footloose Industry", truth: "Industrial location is governed by raw material proximity, power supply, market access, and labor availability.", body: `### Resource Classification & Conservation:\n- **Biotic vs Abiotic**, **Renewable vs Non-Renewable**, **Potential vs Developed/Stock**.\n\n### Mineral Belts of India:\n- **North-Eastern Peninsular Belt:** Chota Nagpur plateau (iron ore, coal, manganese, mica) — "Ruhr of India".\n- **South-Western Belt:** Karnataka & Goa (ferrous iron ore, bauxite).\n- **North-Western Belt:** Rajasthan & Gujarat (copper, zinc, sandstone, petroleum in Gulf of Khambhat).\n\n### Industrial Location Factors:\n- Raw material weight-loss industries (Sugar, Iron & Steel) locate near mines/farms.\n- **Footloose Industries:** Dependent on component parts, can locate anywhere with transport access (Electronics, IT).` },
      { subject: "geography", subjectName: "Geography NCERT", chNum: 6, id: "geo-ch-6", book: "Book III: Fundamentals of Physical Geography (NCERT Class 11 Part 1)", title: "6. Geomorphology - Earth's Origin, Interior & Plate Tectonics", readTime: "8 min read", examTags: "P & S Earthquake Waves, Shadow Zones, Continental Drift, Plate Tectonics, Ring of Fire", truth: "Earth's internal heat drives mantle convection currents that move rigid lithospheric plates, generating earthquakes, volcanic arcs, and mountain building.", body: `### Seismic Waves & Earth's Layers:\n- **Primary (P) Waves:** Longitudinal/compressional waves; travel through solids, liquids, and gases; fastest.\n- **Secondary (S) Waves:** Transverse/shear waves; **travel ONLY through solids** (disappear in outer liquid core, creating S-wave shadow zone beyond 103°).\n\n<div class="exam-highlight-box">\n  <h4>🌋 Plate Tectonics & Continental Drift</h4>\n  • <strong>Continental Drift (Alfred Wegener 1912):** Supercontinent <strong>Pangaea</strong> split into Laurasia and Gondwanaland.<br>\n  • <strong>Plate Tectonics (McKenzie, Parker, Morgan 1967):** 7 major rigid lithospheric plates float on Asthenosphere.<br>\n  • <strong>3 Boundary Types:</strong> Divergent (Mid-Atlantic Ridge), Convergent (Himalayas - Indo-Australian vs Eurasian plate), Transform (San Andreas Fault).\n</div>` },
      { subject: "geography", subjectName: "Geography NCERT", chNum: 7, id: "geo-ch-7", book: "Book III: Fundamentals of Physical Geography (NCERT Class 11 Part 1)", title: "7. Geomorphic Processes, Minerals, Rocks & Landform Evolution", readTime: "8 min read", examTags: "Weathering, Mass Wasting, Karst Topography, Glacial U-shaped Valleys, Aeolian Dunes", truth: "Landforms are produced by the interaction of landform building endogenic uplift and erosional exogenic agents (running water, wind, glaciers, waves, and groundwater).", body: `### Geomorphic Processes:\n- **Endogenic (Internal):** Diastrophism (orogenic mountain building & epeirogenic continental uplift) and Volcanism.\n- **Exogenic (External):** Weathering (physical, chemical, biological), Mass Wasting (landslides, mudflow), and Erosion.\n\n### Signature Landforms by Agent:\n- **Running Water (Fluvial):** V-shaped valleys, gorges, waterfalls, meanders, oxbow lakes, braided channels, deltas.\n- **Groundwater (Karst):** Sinkholes, lapies, stalactites (hanging from ceiling) and stalagmites (rising from floor).\n- **Glaciers:** Cirques, Aretes, Horns, U-shaped glacial troughs, Hanging valleys, Moraines.\n- **Wind (Aeolian):** Mushroom rocks, Yardangs, Barchans (crescent sand dunes), Loess deposits.` },
      { subject: "geography", subjectName: "Geography NCERT", chNum: 8, id: "geo-ch-8", book: "Book III: Fundamentals of Physical Geography (NCERT Class 11 Part 1)", title: "8. Climatology - Insolation, Atmospheric Circulation & Cyclones", readTime: "8 min read", examTags: "Lapse Rate, Temperature Inversion, Coriolis Force, Hadley/Ferrel Cells, Tropical Cyclones", truth: "Atmospheric circulation is driven by unequal solar heating and Coriolis deflection, governing global pressure belts, wind patterns, and storm systems.", body: `### Insolation & Heat Budget:\n- **Solar Radiation:** Earth absorbs shortwave solar radiation and radiates longwave terrestrial radiation.\n- **Normal Lapse Rate:** Temperature decreases by **6.5°C per 1,000 meters** rise in troposphere.\n- **Temperature Inversion:** Reversal where warm air lies above cool air near surface (common in clear winter nights, trapping fog and smog).\n\n### Global Wind Circulation & Cyclones:\n- **Coriolis Force:** Deflects winds to the **right in Northern Hemisphere** and **left in Southern Hemisphere** (Ferrel's Law).\n- **3 Atmospheric Cells:** Hadley Cell (Equator to 30°), Ferrel Cell (30° to 60°), Polar Cell (60° to 90°).\n- **Tropical Cyclones:** Form over warm tropical oceans (>27°C) with low vertical wind shear; fueled by latent heat of condensation.` },
      { subject: "geography", subjectName: "Geography NCERT", chNum: 9, id: "geo-ch-9", book: "Book III: Fundamentals of Physical Geography (NCERT Class 11 Part 1)", title: "9. Oceanography & Biogeography - Ocean Relief, Salinity & Tides", readTime: "8 min read", examTags: "Continental Shelf/Slope, Salinity Isohalines, Spring vs Neap Tides, Biodiversity Hotspots", truth: "Oceanic waters circulate in global thermal and wind-driven currents, while marine salinity and temperature stratification govern global marine ecosystems.", body: `### Ocean Floor Relief & Salinity:\n- **4 Divisions:** Continental Shelf (0-200m depth, rich in oil & fisheries), Continental Slope (200-3000m), Continental Rise, Abyssal Deep Sea Plains (3000-6000m).\n- **Average Salinity:** **35 parts per thousand (ppt)**. Highest salinity in enclosed seas with high evaporation (Red Sea 41 ppt, Dead Sea 238 ppt, Lake Van 330 ppt).\n\n### Tides & Ocean Movements:\n- **Spring Tides:** Occur on Full Moon & New Moon when Sun, Earth, and Moon align in a straight line (*Syzygy*); highest high tides.\n- **Neap Tides:** Occur at 1st and 3rd Quarter Moon when Sun and Moon are at right angles (*Quadrature*); lowest tide range.` },
      { subject: "geography", subjectName: "Geography NCERT", chNum: 10, id: "geo-ch-10", book: "Book IV: India Physical Environment (NCERT Class 11 Part 2)", title: "10. India's Physiography, River Systems, Monsoon & Soils", readTime: "8 min read", examTags: "Indira Point, Western Ghats Passes, El Nino Southern Oscillation, ICAR Soil Classification", truth: "India's distinct tropical monsoon climate and ecological diversity are driven by the Himalayan barrier, Indian Ocean thermal dynamics, and varied soil profiles.", body: `### Extent & Boundaries:\n- **Latitudes:** 8°4'N to 37°6'N | **Longitudes:** 68°7'E to 97°25'E.\n- **Standard Meridian:** 82°30'E (Mirzapur, UP; IST = GMT + 5:30).\n- **Total Coastline:** 7,516.6 km (mainland 6,100 km).\n\n### Indian Monsoon Dynamics:\n- **Mechanisms:** Thermal differential between landmass and ocean + shift of Inter-Tropical Convergence Zone (ITCZ) over Gangetic plain in summer.\n- **ENSO & IOD:** **El Niño** (warm Pacific current) suppresses Indian monsoon; Positive **Indian Ocean Dipole (IOD)** enhances Indian monsoon rainfall.\n\n### ICAR 8 Major Soil Groups:\n1. **Alluvial (40%):** Most fertile, Bangar (old) vs Khadar (new).\n2. **Black / Regur Soil:** Formed from Deccan basalt lava; rich in clay, self-ploughing; ideal for cotton.\n3. **Red & Yellow Soil:** Formed on crystalline igneous rocks; red due to iron diffusion.\n4. **Laterite Soil:** High leaching under high temp & heavy rainfall; acidic, good for cashew/tea with fertilizers.` },
      { subject: "geography", subjectName: "Geography NCERT", chNum: 11, id: "geo-ch-11", book: "Book V: Human Geography & India Economy (NCERT Class 12 Series)", title: "11. Fundamentals of Human Geography - World Trends", readTime: "8 min read", examTags: "Demographic Transition Model, Human Development Index, Primary to Quaternary Activities", truth: "Human geography examines how human populations adapt, organize, and transform the earth's surface through economic sectors and spatial trade networks.", body: `### Demographic Transition Theory:\n- **Stage 1 (High Stationary):** High birth rate + High death rate = Slow population growth (pre-industrial).\n- **Stage 2 (Early Expanding):** High birth rate + Rapidly falling death rate = Population explosion (developing nations).\n- **Stage 3 (Late Expanding):** Falling birth rate + Low death rate = Moderate growth.\n- **Stage 4 (Low Stationary):** Low birth rate + Low death rate = Stable population.\n\n### Economic Activity Sectors:\n- **Primary:** Agriculture, forestry, fishing, mining (direct natural resource extraction).\n- **Secondary:** Manufacturing, construction (processing raw materials).\n- **Tertiary:** Services, transport, trade, communication.\n- **Quaternary & Quinary:** Knowledge industries, R&D, top-level decision making.` },
      { subject: "geography", subjectName: "Geography NCERT", chNum: 12, id: "geo-ch-12", book: "Book V: Human Geography & India Economy (NCERT Class 12 Series)", title: "12. India People and Economy - Population, Resources & Planning", readTime: "8 min read", examTags: "Census 2011 Data, National Water Policy, Mineral Belts, Targeted Area Planning", truth: "Sustainable development in India requires balanced regional planning, efficient water and mineral resource management, and population empowerment.", body: `### India Census 2011 Key Benchmarks:\n- **Total Population:** 1.21 Billion (2011) | Current estimate ~1.44 Billion.\n- **Population Density:** 382 persons per sq km (Highest: Bihar 1,106; Lowest: Arunachal Pradesh 17).\n- **Sex Ratio:** 940 females per 1,000 males | **Child Sex Ratio (0-6 yrs):** 919.\n- **Literacy Rate:** 74.04% (Males 82.14%, Females 65.46%).\n\n### Water & Energy Resource Strategy:\n- India possesses ~4% of world's water resources with 18% of world's population.\n- **National Water Grid & Rainwater Harvesting:** Mandated across states to combat groundwater depletion.\n- **Critical Minerals Mission & Renewable Energy Transition:** Target of 500 GW non-fossil energy capacity by 2030.` },

      // ==========================================
      // SUBJECT 4: POLITY & GOVERNANCE NCERT COMPLETE (Ch 1 - 10)
      // ==========================================
      { subject: "polity", subjectName: "Polity & Governance NCERT", chNum: 1, id: "pol-ch-1", book: "Book I: Civics & Democratic Foundations (NCERT Class 6-8)", title: "1. Foundations of Civics: Diversity, Government & Universal Adult Franchise", readTime: "6 min read", examTags: "Diversity, Universal Adult Franchise, Rule of Law, 3 Levels of Government", truth: "A constitutional democracy guarantees equal political voice to all citizens through Universal Adult Franchise regardless of gender, caste, or wealth.", body: `### Core Civic Foundations:\n- **Government:** Institution that makes and enforces laws, maintains public order, and provides essential public goods.\n- **3 Levels of Government in India:** Federal / Central, State, and Local Self-Government (Panchayats & Municipalities).\n\n<div class="exam-highlight-box">\n  <h4>📜 Universal Adult Franchise</h4>\n  Every citizen aged <strong>18 years and above</strong> possesses equal right to vote ("One Person, One Vote, One Value"). Enshrined under <strong>Article 326</strong> of the Indian Constitution (age lowered from 21 to 18 by 61st Constitutional Amendment Act 1988).\n</div>\n\n### Rule of Law:\nNo individual is above the law, and all individuals are subject to equal legal jurisdiction regardless of status.` },
      { subject: "polity", subjectName: "Polity & Governance NCERT", chNum: 2, id: "pol-ch-2", book: "Book I: Civics & Democratic Foundations (NCERT Class 6-8)", title: "2. Local Self-Government: Panchayati Raj (73rd) & Urban Bodies (74th)", readTime: "7 min read", examTags: "73rd CAA 1992, 74th CAA 1992, Gram Sabha, 3-Tier Panchayat, State Election Commission", truth: "Decentralized local self-government empowers grassroots communities by transferring democratic planning and financial resources directly to villages and municipalities.", body: `### 1. 73rd Constitutional Amendment Act (1992) — Rural Local Bodies:\n- Added **Part IX** and **11th Schedule** (29 functional items) to the Constitution.\n- **3-Tier Structure:** Gram Panchayat (Village) $\\rightarrow$ Panchayat Samiti (Block) $\\rightarrow$ Zilla Parishad (District).\n- **Gram Sabha:** Foundation of rural democracy comprising all registered voters in a village.\n- **Mandatory Reservations:** 1/3rd seats reserved for **Women** (many states like Rajasthan extended to 50%); SC/ST reservation proportionate to population.\n\n### 2. 74th Constitutional Amendment Act (1992) — Urban Local Bodies:\n- Added **Part IX-A** and **12th Schedule** (18 functional items).\n- 3 Types: Nagar Panchayat (transitional), Municipal Council (small urban), Municipal Corporation (large urban).\n- Independent **State Election Commission** and **State Finance Commission** established in every state.` },
      { subject: "polity", subjectName: "Polity & Governance NCERT", chNum: 3, id: "pol-ch-3", book: "Book I: Civics & Democratic Foundations (NCERT Class 6-8)", title: "3. Democracy, Social Justice & Marginalised Groups", readTime: "6 min read", examTags: "Article 15, Article 17 Abolition of Untouchability, SC/ST Act 1989, PIL", truth: "Social justice requires affirmative constitutional protections, anti-discrimination laws, and judicial remedies to safeguard marginalised groups.", body: `### Constitutional Safeguards for Equality:\n- **Article 14:** Equality before law and equal protection of laws.\n- **Article 15:** Prohibition of discrimination on grounds of religion, race, caste, sex, or place of birth.\n- **Article 17:** **Abolition of Untouchability** (enforceable offence under Protection of Civil Rights Act 1955).\n\n### Statutory Protections:\n- **Scheduled Castes and Scheduled Tribes (Prevention of Atrocities) Act 1989:** Punishes hate crimes and atrocities committed against SC/ST members by non-SC/ST persons.\n- **Public Interest Litigation (PIL):** Introduced by Justice P.N. Bhagwati and V.R. Krishna Iyer allowing any public-spirited citizen to file a writ on behalf of aggrieved poor.` },
      { subject: "polity", subjectName: "Polity & Governance NCERT", chNum: 4, id: "pol-ch-4", book: "Book II: Democratic Politics & Electoral Systems (NCERT Class 9-10)", title: "4. Electoral Systems (FPTP vs PR) & Election Commission (Art. 324)", readTime: "7 min read", examTags: "FPTP System, Proportional Representation, ECI Art 324, Model Code of Conduct", truth: "Free and fair elections under an independent constitutional authority ensure peaceful democratic transitions and representative legitimacy.", body: `### Electoral Systems Comparison:\n- **First-Past-The-Post (FPTP):** Candidate securing highest number of votes wins, even without an absolute majority. Used in India for Lok Sabha and Vidhan Sabha elections.\n- **Proportional Representation (PR):** Parties receive legislative seats in direct proportion to total votes polled. Used in India for President, Vice-President, and Rajya Sabha elections (Single Transferable Vote).\n\n<div class="exam-highlight-box">\n  <h4>🗳️ Election Commission of India (Article 324)</h4>\n  • Independent constitutional body overseeing elections to Parliament, State Legislatures, President, and Vice-President.<br>\n  • Comprises Chief Election Commissioner (CEC) and 2 Election Commissioners.<br>\n  • Enforces <strong>Model Code of Conduct (MCC)</strong>, registers political parties, and allocates election symbols.\n</div>` },
      { subject: "polity", subjectName: "Polity & Governance NCERT", chNum: 5, id: "pol-ch-5", book: "Book II: Democratic Politics & Electoral Systems (NCERT Class 9-10)", title: "5. Constitutional Design, Federalism & Power Sharing", readTime: "7 min read", examTags: "7th Schedule Lists, Federalism with Unitary Bias, Basic Structure, Anti-Defection 10th Schedule", truth: "Indian federalism balances regional autonomy with national unity through a 3-tier distribution of legislative powers and constitutional checks and balances.", body: `### Distribution of Legislative Powers (7th Schedule):\n1. **Union List (100 items):** Defense, Foreign Affairs, Banking, Atomic Energy (Exclusive Union Parliament power).\n2. **State List (61 items):** Police, Public Health, Agriculture, Local Government (Exclusive State Legislature power).\n3. **Concurrent List (52 items):** Education, Forests, Trade Unions, Criminal Law (Both Parliament & State can legislate; Union law prevails in conflict).\n\n### Anti-Defection Law (10th Schedule):\n- Added by 52nd Amendment Act 1985. Disqualifies legislators who voluntarily give up party membership or vote against party whip (Decision made by Speaker/Chairman).` },
      { subject: "polity", subjectName: "Polity & Governance NCERT", chNum: 6, id: "pol-ch-6", book: "Book III: Indian Constitution at Work & Political Theory (NCERT Class 11)", title: "6. Philosophy of the Constitution, Constituent Assembly & Preamble", readTime: "8 min read", examTags: "Constituent Assembly, Objectives Resolution, Preamble 42nd Amendment, Secularism", truth: "The Preamble is the key to the Constitution, enshrining Sovereign, Socialist, Secular, Democratic Republic principles and guaranteeing Justice, Liberty, Equality, and Fraternity.", body: `### Constituent Assembly & Framing:\n- Formed under **Cabinet Mission Plan 1946**. 389 initial members (299 after Partition).\n- **Objectives Resolution:** Moved by **Jawaharlal Nehru** on 13 Dec 1946; formed the foundation of the Preamble.\n- Drafting Committee chaired by **Dr. B.R. Ambedkar**.\n\n<div class="exam-highlight-box">\n  <h4>📜 Preamble Key Keywords</h4>\n  • <strong>Sovereign:</strong> India is completely independent; no external control.<br>\n  • <strong>Socialist & Secular:</strong> Added by <strong>42nd Amendment Act 1976</strong> (Democratic Socialism & Positive Secularism equal respect to all religions).<br>\n  • <strong>Integrity:</strong> Added by 42nd Amendment ("Unity and Integrity of the Nation").<br>\n  • <strong>Kesavananda Bharati Case (1973):</strong> Supreme Court ruled Preamble IS part of the Constitution and can be amended under Art. 368 without altering Basic Structure.\n</div>` },
      { subject: "polity", subjectName: "Polity & Governance NCERT", chNum: 7, id: "pol-ch-7", book: "Book III: Indian Constitution at Work & Political Theory (NCERT Class 11)", title: "7. Fundamental Rights (Art. 12–35), DPSP (Art. 36–51) & Duties (Art. 51A)", readTime: "9 min read", examTags: "Fundamental Rights Part III, Writs Art 32 & 226, DPSP Part IV, Fundamental Duties 51A", truth: "Fundamental Rights limit state tyranny, Directive Principles guide welfare policymaking, and Fundamental Duties establish civic obligations.", body: `### 1. Fundamental Rights (Part III, Articles 12–35):\n- **Right to Equality (Art. 14–18)** | **Right to Freedom (Art. 19–22)**\n- **Right against Exploitation (Art. 23–24)** | **Right to Freedom of Religion (Art. 25–28)**\n- **Cultural & Educational Rights (Art. 29–30)** | **Right to Constitutional Remedies (Art. 32)**\n- **Article 32 (Heart & Soul of Constitution):** Supreme Court issues 5 Writs: *Habeas Corpus, Mandamus, Prohibition, Quo-Warranto, Certiorari*.\n\n### 2. DPSP (Part IV, Articles 36–51):\n- Non-justiciable moral & economic guidelines borrowed from Ireland. Categories: **Socialistic, Gandhian (Art 40 Panchayats, Art 47 Cottage Industry), and Liberal-Intellectual (Art 44 Uniform Civil Code)**.\n\n### 3. Fundamental Duties (Part IV-A, Article 51A):\n- Added by **42nd Amendment 1976** on recommendation of **Swaran Singh Committee** (10 duties + 11th added by 86th Amendment 2002 for education of children 6-14 yrs).` },
      { subject: "polity", subjectName: "Polity & Governance NCERT", chNum: 8, id: "pol-ch-8", book: "Book III: Indian Constitution at Work & Political Theory (NCERT Class 11)", title: "8. Executive, Legislature & Parliamentary Architecture", readTime: "8 min read", examTags: "President Ordinance Art 123, PM & Cabinet Art 74/75, Money Bill Art 110, Speaker", truth: "India's Parliamentary system establishes collective executive responsibility to the elected Lok Sabha, preserving legislative supremacy.", body: `### 1. The Union Executive:\n- **President (Article 52–62):** Executive head of state. Elected by Electoral College (Elected MPs + Elected MLAs). Pardoning power under **Article 72**. Promulgates Ordinances under **Article 123** when Parliament is not in session.\n- **Prime Minister & Council of Ministers (Article 74–75):** Real executive head (*De facto*). Council of Ministers is **collectively responsible to the Lok Sabha** (Article 75(3)).\n\n### 2. Parliament of India (Rajya Sabha & Lok Sabha):\n- **Rajya Sabha (Upper House):** Permanent body, 1/3rd members retire every 2 years. Special powers: Art 249 (legislate on State List) & Art 312 (All-India Services).\n- **Lok Sabha (Lower House):** Directly elected. Exclusive power over **Money Bills (Article 110)** certified by Speaker.` },
      { subject: "polity", subjectName: "Polity & Governance NCERT", chNum: 9, id: "pol-ch-9", book: "Book III: Indian Constitution at Work & Political Theory (NCERT Class 11)", title: "9. Judiciary: Supreme Court, Judicial Review & Basic Structure", readTime: "8 min read", examTags: "Integrated Judiciary, Article 124, Collegium System, Judicial Review, Basic Structure", truth: "An integrated independent judiciary enforces constitutional limits, defends fundamental rights, and preserves the unalterable Basic Structure of the Constitution.", body: `### 1. Judicial Architecture:\n- Single integrated judicial hierarchy: **Supreme Court (Apex)** $\\rightarrow$ **High Courts** $\\rightarrow$ **Subordinate Courts**.\n- **Appointments:** **Collegium System** (CJI + 4 senior-most SC judges) recommends judicial appointments.\n\n### 2. Supreme Court Jurisdiction:\n- **Original Jurisdiction (Art 131):** Federal disputes (Centre vs State / State vs State).\n- **Writ Jurisdiction (Art 32):** Enforcement of Fundamental Rights.\n- **Appellate Jurisdiction (Art 132–134):** Civil, criminal, and constitutional appeals.\n- **Advisory Jurisdiction (Art 143):** President can seek SC opinion.\n\n<div class="exam-highlight-box">\n  <h4>⚖️ Basic Structure Doctrine (Kesavananda Bharati 1973)</h4>\n  Parliament has wide powers to amend the Constitution under Article 368, but CANNOT alter or destroy its <strong>Basic Structure</strong> (Judicial Review, Federalism, Secularism, Democracy, Separation of Powers).\n</div>` },
      { subject: "polity", subjectName: "Polity & Governance NCERT", chNum: 10, id: "pol-ch-10", book: "Book IV: Politics in India Since Independence & Governance (NCERT Class 12)", title: "10. Politics in India Since Independence: Dominance, Emergency & Coalition Era", readTime: "8 min read", examTags: "One-Party Dominance, Emergency 1975 Art 352, Mandal Commission, Coalition Politics", truth: "Indian democracy evolved from single-party dominance to central state emergency and multi-party coalition politics, broadening social representation.", body: `### Key Political Phases Since 1947:\n1. **Era of One-Party Dominance (1952–1967):** Congress won majorities under Nehru; functioned as an 'umbrella coalition' accommodating diverse interests.\n2. **National Emergency (1975–1977):** Declared by PM Indira Gandhi under **Article 352** on grounds of 'internal disturbance' (replaced by 'armed rebellion' via 44th Amendment Act 1978). Fundamental rights suspended, opposition leaders jailed.\n3. **The Mandal Era & Social Empowerment (1990s):** Implementation of **Mandal Commission Report** granting 27% OBC reservation in central government jobs.\n4. **Era of Coalition Politics (1989–2014):** Rise of regional parties and multi-party national coalitions (NDA & UPA).` },

      // ==========================================
      // SUBJECT 5: GENERAL SCIENCE & TECH NCERT COMPLETE (Ch 1 - 12)
      // ==========================================
      { subject: "science", subjectName: "General Science & Tech NCERT", chNum: 1, id: "sci-ch-1", book: "Book I: Physics Laws & Applications (NCERT Physics Class 6-12)", title: "1. Motion, Forces, Newton's Laws & Gravitation", readTime: "7 min read", examTags: "Newton's 3 Laws, Momentum, g vs G, Weightlessness, Escape Velocity", truth: "Force alters the state of motion of a body, while universal gravitation governs planetary orbits and falling bodies near Earth's surface.", body: `### 1. Newton's 3 Laws of Motion:\n- **First Law (Inertia):** A body remains at rest or in uniform motion unless acted upon by an external net force.\n- **Second Law ($F = ma$):** Force equals mass times acceleration ($\text{Force} = \frac{d\mathbf{p}}{dt}$). Base unit: **Newton (N)**.\n- **Third Law:** For every action, there is an equal and opposite reaction.\n\n### 2. Universal Gravitation:\n- **Law of Gravitation:** $F = G \frac{m_1 m_2}{r^2}$ where $G = 6.674 \times 10^{-11} \text{ N m}^2/\text{kg}^2$.\n- **Acceleration due to Gravity ($g$):** $g = \frac{GM}{R^2} \approx 9.8 \text{ m/s}^2$ at sea level.\n- **Escape Velocity ($v_e$):** Minimum speed to break free from Earth's gravity: $v_e = \sqrt{2gR} \approx 11.2 \text{ km/s}$.` },
      { subject: "science", subjectName: "General Science & Tech NCERT", chNum: 2, id: "sci-ch-2", book: "Book I: Physics Laws & Applications (NCERT Physics Class 6-12)", title: "2. Work, Energy, Power & Fluid Mechanics (Archimedes/Buoyancy)", readTime: "7 min read", examTags: "Kinetic vs Potential Energy, Power (Watt), Archimedes Principle, Bernoulli", truth: "Energy can neither be created nor destroyed, only transformed; fluids exert upward buoyant forces equal to the weight of displaced liquid.", body: `### 1. Work, Energy & Power:\n- **Work ($W$):** $W = F \cdot d \cdot \cos(\theta)$. Unit: **Joule (J)**.\n- **Kinetic Energy ($E_k$):** $E_k = \frac{1}{2} m v^2$.\n- **Potential Energy ($E_p$):** $E_p = m g h$.\n- **Power ($P$):** Rate of doing work $P = \frac{W}{t}$. Unit: **Watt (W)** (1 Horsepower = 746 W).\n\n### 2. Fluid Mechanics & Buoyancy:\n- **Archimedes' Principle:** Body immersed in fluid experiences buoyant force equal to weight of displaced fluid.\n- **Bernoulli's Principle:** As fluid velocity increases, static pressure decreases (explains airplane wing lift).` },
      { subject: "science", subjectName: "General Science & Tech NCERT", chNum: 3, id: "sci-ch-3", book: "Book I: Physics Laws & Applications (NCERT Physics Class 6-12)", title: "3. Wave Motion, Sound & Acoustics", readTime: "6 min read", examTags: "Transverse vs Longitudinal, Infrasonic/Ultrasound, Doppler Effect, SONAR", truth: "Sound travels as longitudinal mechanical pressure waves requiring a material medium, exhibiting frequency-dependent pitch and Doppler frequency shifts.", body: `### Sound Wave Properties:\n- **Mechanical Longitudinal Wave:** Propagates through compressions and rarefactions; **cannot travel in vacuum**.\n- **Speed of Sound:** Fastest in solids (~5000 m/s in steel) $\\rightarrow$ liquids (~1500 m/s in water) $\\rightarrow$ slowest in gases (~343 m/s in air at 20°C).\n\n<div class="exam-highlight-box">\n  <h4>🔊 Frequency Spectrum</h4>\n  • <strong>Infrasonic (<20 Hz):</strong> Elephants, earthquakes, volcanic eruptions.<br>\n  • <strong>Audible Range (20 Hz – 20,000 Hz):</strong> Human ear.<br>\n  • <strong>Ultrasonic (>20,000 Hz):</strong> Bats, dolphins, medical USG imaging, <strong>SONAR</strong> (Sound Navigation and Ranging).\n</div>` },
      { subject: "science", subjectName: "General Science & Tech NCERT", chNum: 4, id: "sci-ch-4", book: "Book I: Physics Laws & Applications (NCERT Physics Class 6-12)", title: "4. Light, Reflection, Refraction, Lenses & Human Eye", readTime: "7 min read", examTags: "Snell's Law, Total Internal Reflection, Myopia vs Hypermetropia, Rainbows", truth: "Light exhibits wave-particle duality, bending across optical media according to refractive index and undergoing total internal reflection in optical fibers.", body: `### 1. Refraction & Total Internal Reflection (TIR):\n- **Snell's Law:** $n_1 \sin(\theta_1) = n_2 \sin(\theta_2)$.\n- **Total Internal Reflection (TIR):** When light travels from denser to rarer medium at angle greater than critical angle. Applications: **Optical Fibers**, Mirages, Diamond brilliance.\n\n### 2. Human Eye Defects & Correction:\n- **Myopia (Short-sightedness):** Image forms in front of retina $\\rightarrow$ Corrected by **Concave Lens**.\n- **Hypermetropia (Long-sightedness):** Image forms behind retina $\\rightarrow$ Corrected by **Convex Lens**.\n- **Presbyopia:** Aging eye defect $\\rightarrow$ Corrected by **Bifocal Lens**.` },
      { subject: "science", subjectName: "General Science & Tech NCERT", chNum: 5, id: "sci-ch-5", book: "Book I: Physics Laws & Applications (NCERT Physics Class 6-12)", title: "5. Electricity, Circuits, Magnetism & Electromagnetic Induction", readTime: "8 min read", examTags: "Ohm's Law V=IR, Series vs Parallel, Faraday's Law, Transformers", truth: "Moving electric charges create magnetic fields, and changing magnetic flux induces electric current (Faraday's Law), enabling modern power grids.", body: `### 1. Current Electricity:\n- **Ohm's Law:** $V = I \cdot R$ where $R = \rho \frac{l}{A}$.\n- **Joule Heating:** $H = I^2 R t$.\n- **Circuits:** Series ($R_{\text{eq}} = R_1 + R_2$) vs Parallel ($\frac{1}{R_{\text{eq}}} = \frac{1}{R_1} + \frac{1}{R_2}$ Household wiring).\n\n### 2. Magnetism & EM Induction:\n- **Faraday's Law of Induction:** Induced EMF equals rate of change of magnetic flux ($\mathcal{E} = -\frac{d\Phi_B}{dt}$).\n- **Transformers:** Step-up vs Step-down voltage transformers operating on AC current.` },
      { subject: "science", subjectName: "General Science & Tech NCERT", chNum: 6, id: "sci-ch-6", book: "Book II: Chemistry & Matter (NCERT Chemistry Class 8-12)", title: "6. Atomic Structure, Matter & The Periodic Table", readTime: "7 min read", examTags: "Proton/Neutron/Electron, Isotopes vs Isobars, Periodic Trends, Valency", truth: "Elements are arranged by increasing atomic number in the Modern Periodic Table, exhibiting periodic trends in electronegativity, atomic radius, and ionization energy.", body: `### 1. Atomic Structure & Subatomic Particles:\n- **Protons (Rutherford/Goldstein):** Positive charge (+1), mass 1 amu.\n- **Neutrons (Chadwick):** Neutral charge (0), mass 1 amu.\n- **Electrons (J.J. Thomson):** Negative charge (-1), mass $\\frac{1}{1836}$ amu.\n- **Isotopes:** Same atomic number $Z$, different mass number $A$ (e.g. Carbon-12 vs Carbon-14).\n\n### 2. Modern Periodic Table (Moseley 1913):\n- 18 Groups & 7 Periods based on **Atomic Number ($Z$)**.\n- **Periodic Trends:**\n  - Atomic Radius: Decreases left to right across period; increases down group.\n  - Electronegativity & Ionization Energy: Increases left to right across period; decreases down group.` },
      { subject: "science", subjectName: "General Science & Tech NCERT", chNum: 7, id: "sci-ch-7", book: "Book II: Chemistry & Matter (NCERT Chemistry Class 8-12)", title: "7. Chemical Reactions, Acids, Bases, Salts & pH Scale", readTime: "7 min read", examTags: "Exothermic vs Endothermic, pH Scale, Indicators, Neutralisation, Plaster of Paris", truth: "Acid-base neutrality is measured on a logarithmic pH scale from 0 to 14, where neutral water equals 7.", body: `### 1. Acids, Bases & pH Scale:\n- **Acids:** Turn blue litmus red; release $H^+$ ions in water (pH < 7).\n- **Bases:** Turn red litmus blue; release $OH^-$ ions in water (pH > 7).\n- **pH Scale (Sörensen 1909):** $\text{pH} = -\log_{10}[H^+]$.\n  - Human Blood pH: **7.35 – 7.45** (Slightly alkaline).\n  - Acid Rain: pH **< 5.6**.\n\n### 2. Important Salts & Everyday Uses:\n- **Baking Soda ($NaHCO_3$):** Sodium Hydrogen Carbonate.\n- **Washing Soda ($Na_2CO_3 \cdot 10H_2O$):** Sodium Carbonate Decahydrate.\n- **Plaster of Paris ($CaSO_4 \cdot \frac{1}{2}H_2O$):** Calcium Sulphate Hemihydrate.` },
      { subject: "science", subjectName: "General Science & Tech NCERT", chNum: 8, id: "sci-ch-8", book: "Book II: Chemistry & Matter (NCERT Chemistry Class 8-12)", title: "8. Metals, Non-Metals, Metallurgy, Carbon & Organic Chemistry", readTime: "8 min read", examTags: "Reactivity Series, Alloys (Bronze/Brass/Steel), Allotropes of Carbon, Polymers", truth: "Carbon's tetravalency and catenation ability enable millions of organic compounds, synthetic polymers, and carbon allotropes like graphene.", body: `### 1. Metals & Alloys:\n- **Reactivity Series:** Potassium > Sodium > Calcium > Magnesium > Aluminum > Zinc > Iron > Lead > [Hydrogen] > Copper > Mercury > Silver > Gold.\n- **Key Alloys:**\n  - **Brass:** Copper + Zinc ($Cu + Zn$).\n  - **Bronze:** Copper + Tin ($Cu + Sn$).\n  - **Stainless Steel:** Iron + Chromium + Nickel + Carbon.\n\n### 2. Carbon Allotropes & Organic Chemistry:\n- **Carbon Allotropes:** Diamond (hardest natural substance, 3D tetrahedral), Graphite (layered lubricant, conducts electricity), Fullerenes ($C_{60}$), Graphene.\n- **Hydrocarbons:** Alkanes ($C_n H_{2n+2}$ saturated) vs Alkenes ($C_n H_{2n}$) & Alkynes ($C_n H_{2n-2}$ unsaturated).` },
      { subject: "science", subjectName: "General Science & Tech NCERT", chNum: 9, id: "sci-ch-9", book: "Book III: Biology & Life Sciences (NCERT Biology Class 6-10)", title: "9. Cell - The Fundamental Unit of Life & Plant/Animal Tissues", readTime: "8 min read", examTags: "Mitochondria, Plant vs Animal Cell, Xylem & Phloem, Mitosis vs Meiosis", truth: "The cell is the basic structural and functional unit of all living organisms, multiplying through mitotic growth and meiotic reproduction.", body: `### 1. Cell Organelles & Functions:\n- **Nucleus (Robert Brown 1831):** Contains DNA/chromosomes; master control center.\n- **Mitochondria:** "Powerhouse of cell"; produces energy via **ATP (Adenosine Triphosphate)**.\n- **Ribosomes:** Sites of protein synthesis.\n- **Lysosomes:** "Suicide bags" containing digestive enzymes.\n\n<div class="exam-highlight-box">\n  <h4>🌿 Plant vs Animal Cells & Tissues</h4>\n  • <strong>Plant Cell:</strong> Has rigid Cell Wall (cellulose), Plastids/Chloroplasts, large central vacuole.<br>\n  • <strong>Vascular Tissues:</strong> <strong>Xylem</strong> (transports water/minerals upward) & <strong>Phloem</strong> (transports food/sucrose bi-directionally).\n</div>` },
      { subject: "science", subjectName: "General Science & Tech NCERT", chNum: 10, id: "sci-ch-10", book: "Book III: Biology & Life Sciences (NCERT Biology Class 6-10)", title: "10. Human Life Processes, Organ Systems, Microorganisms & Diseases", readTime: "8 min read", examTags: "Circulation, Double Circulation, Vaccines, Microbes, Vector-Borne Diseases", truth: "Human life processes maintain homeostasis through coordinated digestive, respiratory, circulatory, excretory, and immune system functions.", body: `### 1. Human Life Processes:\n- **Digestion:** Carbohydrates $\rightarrow$ Glucose | Proteins $\rightarrow$ Amino Acids | Fats $\rightarrow$ Fatty Acids + Glycerol.\n- **Circulation (Harvey 1628):** 4-chambered heart (2 auricles, 2 ventricles); **Double Circulation** (Systemic + Pulmonary).\n- **Excretion:** **Nephrons** are the functional filtration units of human kidneys.\n\n### 2. Pathogens & Human Diseases:\n- **Bacterial:** Tuberculosis (*M. tuberculosis*), Cholera, Typhoid, Tetanus.\n- **Viral:** COVID-19, Dengue, Chikungunya, Rabies, Polio, HIV/AIDS.\n- **Protozoan:** Malaria (*Plasmodium* carried by female *Anopheles* mosquito), Kala-Azar (*Leishmania* carried by sandfly).` },
      { subject: "science", subjectName: "General Science & Tech NCERT", chNum: 11, id: "sci-ch-11", book: "Book IV: Advanced Biology & Modern Technology (NCERT Class 11-12 & Applied Tech)", title: "11. Genetics, DNA Structure, Protein Synthesis & Biotechnology Applications", readTime: "8 min read", examTags: "Mendelian Genetics, DNA Double Helix, Recombinant DNA, CRISPR-Cas9, Bt Cotton", truth: "Biotechnology utilizes genetic engineering, recombinant DNA technology, and gene editing tools like CRISPR-Cas9 to transform medicine and agriculture.", body: `### 1. Genetics & DNA Architecture:\n- **Mendel's Laws (1865):** Law of Segregation and Law of Independent Assortment.\n- **DNA Double Helix (Watson & Crick 1953):** Nitrogenous base pairs: **Adenine = Thymine (A=T)** and **Guanine ≡ Cytosine (G≡C)** (RNA replaces Thymine with **Uracil**).\n\n### 2. Biotechnology & Genetic Engineering:\n- **Recombinant DNA Technology:** Using Restriction Enzymes ("molecular scissors") and DNA Ligase to insert foreign genes into bacterial plasmids.\n- **Bt Cotton:** Insect-resistant transgenic crop expressing *Cry* toxin gene from *Bacillus thuringiensis* against bollworms.\n- **CRISPR-Cas9:** Precision gene editing technology (Nobel Prize 2020 to Doudna & Charpentier).` },
      { subject: "science", subjectName: "General Science & Tech NCERT", chNum: 12, id: "sci-ch-12", book: "Book IV: Advanced Biology & Modern Technology (NCERT Class 11-12 & Applied Tech)", title: "12. Space Technology, Defense Tech, Nanotechnology, Nuclear Energy & Environment", readTime: "9 min read", examTags: "ISRO Missions (Chandrayaan-3/Gaganyaan), Agni/Prithvi, Nuclear Fission vs Fusion, Nanotech", truth: "Modern science and technology drive national strategic autonomy across space exploration, defense systems, nuclear power, and nanotechnology.", body: `### 1. India's Space Program (ISRO):\n- **Launch Vehicles:** PSLV (Polar Satellite Launch Vehicle - workhorse) & LVM3 / GSLV Mk III (heavy lifter).\n- **Landmark Missions:**\n  - **Chandrayaan-3 (2023):** Historic soft landing near Moon's South Pole (Vikram lander & Pragyan rover).\n  - **Aditya-L1 (2023):** India's first solar observatory placed at Sun-Earth **Lagrange Point 1 (L1)**.\n  - **Gaganyaan:** India's human spaceflight program.\n\n### 2. Defense Tech & Nuclear Energy:\n- **IGMDP (Dr. A.P.J. Abdul Kalam):** Patna, Agni (IRBM/ICBM), Trishul, Nag (anti-tank), Prithvi (SRBM).\n- **Nuclear Energy:** Fission ($U^{235}$ / $Pu^{239}$ in reactors) vs Fusion (Sun's energy / ITER tokamak).\n- **3-Stage Nuclear Power Program (Homi Bhabha):** Stage 1: PHWR (Natural Uranium) $\\rightarrow$ Stage 2: Fast Breeder Reactors ($Pu^{239}$) $\\rightarrow$ Stage 3: Thorium-based reactors (using India's Monazite sands in Kerala).` },

      { subject: "revision", subjectName: "Rapid Revision & Exam Traps", chNum: 1, id: "rev-ch-1", book: "Book I: History High-Yield Facts & Exam Traps", title: "1. History Rapid-Fire Facts & Tricky Exam Traps", readTime: "7 min read", examTags: "Permanent Settlement vs Ryotwari, Morley-Minto 1909, Doctrine of Lapse, Charter Acts", truth: "History exam questions frequently test exact attribution of land revenue systems, constitutional reform acts, and organizational leaders to trap unprepared candidates.", body: `### ⚡ TRICKY DISTINCTIONS & EXAM TRAPS:

1. **Land Revenue Traps:**
   - **Permanent Settlement (1793):** Introduced by Cornwallis in Bengal, Bihar, and Odisha. **NOT** in Madras or Bombay Presidencies.
   - **Ryotwari System:** Introduced in Madras (Thomas Munro & Alexander Read) and Bombay. Direct settlement with actual cultivators (*Ryots*).
   - **Mahalwari System:** Introduced in NW Provinces, Central India, and Punjab (Holt Mackenzie 1822). Settlement with village community (*Mahal*).

2. **Doctrine of Lapse Traps:**
   - Annexed: Satara (1848), Sambalpur, Jhansi (1853), Nagpur (1854).
   - **TRAP:** Punjab was **NOT** annexed under Doctrine of Lapse — it was conquered through the Anglo-Sikh Wars (1849).
   - **TRAP:** Awadh was **NOT** annexed under Doctrine of Lapse — it was annexed in 1856 on charges of **'Misgovernance' (Outram Report)**.

3. **Constitutional Reform Acts Traps:**
   - **Morley-Minto Reforms (1909):** Introduced separate electorates for **Muslims ONLY**.
   - **Montagu-Chelmsford Reforms (1919):** Extended separate electorates to Sikhs, Indian Christians, Anglo-Indians, and Europeans; introduced **Dyarchy in Provinces** (Transferred vs Reserved subjects).
   - **GOI Act 1935:** Abolished Dyarchy in Provinces and introduced **Provincial Autonomy**; proposed Dyarchy at Centre.` },
      { subject: "revision", subjectName: "Rapid Revision & Exam Traps", chNum: 2, id: "rev-ch-2", book: "Book II: Geography High-Yield Facts & Exam Traps", title: "2. Geography Rapid-Fire Facts & Tricky Exam Traps", readTime: "7 min read", examTags: "Koppen B Climate, Western vs Eastern Ghats, Cyclones Bay vs Arabian, Indira Point", truth: "Geography exam questions test precise boundary latitudes, river drainage orientations, atmosphere layer boundaries, and ocean relief definitions.", body: `### ⚡ TRICKY DISTINCTIONS & EXAM TRAPS:

1. **Climate & Forest Traps:**
   - **Tropical Evergreen Forests:** Require **>200 cm** annual rainfall (Western Ghats, NE India, A&N Islands).
   - **Tropical Deciduous (Monsoon) Forests:** Receive **70–200 cm** rainfall (Most widespread forest type in India).
   - **Koppen 'B' Climates:** Denotes **Dry Climates** (BWh = Hot desert like Thar; BWk = Cold desert like Ladakh).

2. **Physiography & Coastal Traps:**
   - **Western vs. Eastern Ghats:** Western Ghats are higher, continuous (crossed via Thalghat, Bhorghat, Palghat passes), and older. Eastern Ghats are lower, discontinuous, and dissected by rivers.
   - **Cyclones Frequency:** Bay of Bengal experiences **more frequent and intense cyclones** than the Arabian Sea due to warmer sea surface temperatures and low salinity.
   - **Southernmost Point:** **Indira Point** (6°45'N in Great Nicobar Island), NOT Kanyakumari (8°4'N is southernmost point of *mainland* India).

3. **Tropic of Cancer (23.5°N) Traps:**
   - Passes through **8 Indian States:** Gujarat, Rajasthan, MP, Chhattisgarh, Jharkhand, West Bengal, Tripura, and Mizoram.` },
      { subject: "revision", subjectName: "Rapid Revision & Exam Traps", chNum: 3, id: "rev-ch-3", book: "Book III: Economics High-Yield Facts & Exam Traps", title: "3. Economics Rapid-Fire Facts & Tricky Exam Traps", readTime: "7 min read", examTags: "GDP vs GNP, Repo vs Reverse Repo, Money Aggregates M1/M3, FDI vs FPI, GST", truth: "Economics questions trap candidates on definitions of domestic vs national boundaries, monetary liquidity aggregates, and fiscal deficit sub-components.", body: `### ⚡ TRICKY DISTINCTIONS & EXAM TRAPS:

1. **National Income Traps:**
   - **GDP:** All final output inside domestic geographic borders regardless of citizen ownership.
   - **GNP:** GDP + NFIA (Income earned by Indian citizens abroad minus income earned by foreigners in India).
   - **GDP Deflator:** Calculated as $\frac{\text{Nominal GDP}}{\text{Real GDP}} \times 100$. Unlike CPI, it covers **ALL goods and services produced domestically**.

2. **Monetary Policy & Money Supply Traps:**
   - **Repo Rate:** Rate at which RBI lends short-term money to commercial banks against government securities.
   - **Reverse Repo Rate:** Rate at which RBI absorbs excess liquidity from commercial banks.
   - **Money Supply Aggregates:**
     - **M1 (Narrow Money):** Currency with public + Demand deposits with banks + Other deposits with RBI.
     - **M3 (Broad Money):** M1 + Time deposits with commercial banks.

3. **Foreign Capital Traps:**
   - **FDI (Foreign Direct Investment):** Investment in physical assets/enterprises with **≥10% voting power**; long-term and stable.
   - **FPI (Foreign Portfolio Investment):** Investment in financial stocks/bonds with **<10% voting power**; volatile "hot money".` },
      { subject: "revision", subjectName: "Rapid Revision & Exam Traps", chNum: 4, id: "rev-ch-4", book: "Book IV: Polity High-Yield Facts & Exam Traps", title: "4. Polity Rapid-Fire Facts & Constitutional Exam Traps", readTime: "7 min read", examTags: "Article 32 vs 226, Money Bill Art 110, Electoral College, Emergency Art 352/356", truth: "Polity exam questions target subtle differences between Supreme Court and High Court writ powers, parliamentary bill procedures, and constitutional emergency provisions.", body: `### 1. Constitutional Article Distinctions:
- **Article 32 vs. Article 226:**
  - **Article 32 (Supreme Court):** Writ jurisdiction is a **Fundamental Right itself**. SC can issue writs ONLY for Fundamental Rights.
  - **Article 226 (High Court):** Writ jurisdiction is discretionary (NOT a Fundamental Right). High Courts can issue writs for FRs **AND for any other legal right** (Writ jurisdiction of High Court is wider than Supreme Court!).

2. **Emergency Suspension Traps:**
   - **Articles 20 & 21:** **CANNOT be suspended** under any circumstances, even during National Emergency (44th Amendment Act 1978).
   - **Article 19:** Automatically suspended ONLY when National Emergency is declared on grounds of **War or External Aggression** (NOT on grounds of Armed Rebellion).

3. **Parliamentary Bill Traps:**
   - **Money Bill (Article 110):** Certified exclusively by **Speaker of Lok Sabha**. Rajya Sabha cannot reject or amend a Money Bill; it can only delay it for **maximum 14 days**.` },
      { subject: "revision", subjectName: "Rapid Revision & Exam Traps", chNum: 5, id: "rev-ch-5", book: "Book V: Science & Tech High-Yield Facts & Exam Traps", title: "5. General Science Rapid-Fire Facts & Exam Traps", readTime: "7 min read", examTags: "Artery vs Vein Exception, Malaria vs Dengue Vector, Fission vs Fusion, Diamond vs Graphite", truth: "Science questions test physiological exceptions, vector distinctions in infectious diseases, and nuclear reactor physics principles.", body: `### ⚡ TRICKY DISTINCTIONS & EXAM TRAPS:

3. **Chemistry Carbon Allotropes:**

    // Filter State & Preferences
    let selectedSubject = localStorage.getItem('kindle_subject_filter') || 'economics';
    let currentChapterIndex = 0;
    let currentTheme = localStorage.getItem('kindle_theme') || 'sepia';
    let currentFontSize = parseInt(localStorage.getItem('kindle_font_size')) || 1.12;

    // Filtered Dataset
    function getFilteredBookData() {
      if (selectedSubject === 'all') return rawBookData;
      return rawBookData.filter(ch => ch.subject === selectedSubject);
    }

    // --- DOM References ---
    const tocListEl = document.getElementById('tocList');
    const bookStreamEl = document.getElementById('bookStream');
    const readerPaneEl = document.getElementById('readerPane');
    const progressBarFillEl = document.getElementById('progressBarFill');
    const headerSubtitleEl = document.getElementById('headerSubtitle');
    const tocTitleLabelEl = document.getElementById('tocTitleLabel');

    // --- Subject Filter Logic ---
    function filterSubject(sub) {
      selectedSubject = sub;
      localStorage.setItem('kindle_subject_filter', sub);

      document.querySelectorAll('.subject-btn').forEach(btn => {
        btn.classList.toggle('active', btn.id === `tab-${sub}`);
      });

      if (sub === 'economics') {
        headerSubtitleEl.textContent = "Subject View: Economics & Social Issues (45 Chapters)";
        tocTitleLabelEl.textContent = "Economics Syllabus";
      } else if (sub === 'history') {
        headerSubtitleEl.textContent = "Subject View: History NCERT Complete (57 Chapters - Class 6 to 12)";
        tocTitleLabelEl.textContent = "History Syllabus";
      } else if (sub === 'geography') {
        headerSubtitleEl.textContent = "Subject View: Geography NCERT Complete (12 Chapters - Class 6 to 12)";
        tocTitleLabelEl.textContent = "Geography Syllabus";
      } else if (sub === 'polity') {
        headerSubtitleEl.textContent = "Subject View: Polity & Governance NCERT (10 Chapters - Class 6 to 12)";
        tocTitleLabelEl.textContent = "Polity Syllabus";
      } else if (sub === 'science') {
        headerSubtitleEl.textContent = "Subject View: General Science & Technology NCERT (12 Chapters - Class 6 to 12)";
        tocTitleLabelEl.textContent = "Science & Tech Syllabus";
      } else if (sub === 'revision') {
        headerSubtitleEl.textContent = "Revision Engine: Rapid-Fire High-Yield Facts & Exam Traps (5 Modules)";
        tocTitleLabelEl.textContent = "Revision Engine";
      } else {
        headerSubtitleEl.textContent = "Cross-Disciplinary View: All Subjects";
        tocTitleLabelEl.textContent = "Master Syllabus";
      }

      currentChapterIndex = 0;
      renderBookStream();
      renderToc();
      setupScrollObserver();
      readerPaneEl.scrollTop = 0;
    }

    // --- Theme & Font Management ---
    function setTheme(theme) {
      currentTheme = theme;
      document.body.className = `theme-${theme}`;
      localStorage.setItem('kindle_theme', theme);

      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(theme));
      });
    }

    function adjustFontSize(delta) {
      currentFontSize = Math.max(0.9, Math.min(1.45, currentFontSize + delta * 0.06));
      document.documentElement.style.setProperty('--reader-font-size', `${currentFontSize}rem`);
      localStorage.setItem('kindle_font_size', currentFontSize);
    }

    function toggleToc() {
      const sidebar = document.getElementById('tocSidebar');
      sidebar.style.display = (sidebar.style.display === 'none') ? 'flex' : 'none';
    }

    // --- Render Table of Contents ---
    function renderToc() {
      const activeData = getFilteredBookData();
      tocListEl.innerHTML = '';
      let currentBook = '';

      document.getElementById('chapterCountBadge').textContent = `${activeData.length} Chapters`;

      activeData.forEach((ch, idx) => {
        if (ch.book !== currentBook) {
          currentBook = ch.book;
          const bookHeader = document.createElement('li');
          bookHeader.className = 'toc-book-section';
          bookHeader.textContent = currentBook;
          tocListEl.appendChild(bookHeader);
        }

        const item = document.createElement('li');
        item.id = `toc-item-${idx}`;
        item.className = `toc-item ${idx === currentChapterIndex ? 'active' : ''}`;
        item.onclick = () => scrollToChapter(idx);
        item.innerHTML = `
          <span class="toc-num">Ch ${ch.chNum}.</span>
          <span>${ch.title.split('. ')[1] || ch.title}</span>
        `;
        tocListEl.appendChild(item);
      });
    }

    // --- Render Continuous Book Stream ---
    function renderBookStream() {
      const activeData = getFilteredBookData();
      bookStreamEl.innerHTML = '';

      activeData.forEach((ch, idx) => {
        const chapterSection = document.createElement('section');
        chapterSection.id = `chapter-section-${idx}`;
        chapterSection.className = 'kindle-screen-chapter';

        let subjectIcon = '📈';
        if (ch.subject === 'history') subjectIcon = '🏛️';
        if (ch.subject === 'geography') subjectIcon = '🌍';
        if (ch.subject === 'polity') subjectIcon = '⚖️';
        if (ch.subject === 'science') subjectIcon = '🔬';
        if (ch.subject === 'revision') subjectIcon = '⚡';

        chapterSection.innerHTML = `
          <div class="chapter-header">
            <div class="subject-badge">${subjectIcon} ${ch.subjectName} • Chapter ${ch.chNum}</div>
            <div class="chapter-book-label">${ch.book}</div>
            <h1 class="chapter-title">${ch.title}</h1>
            <div class="reading-meta">
              <span>⏱️ ${ch.readTime}</span>
              <span>🏷️ ${ch.examTags}</span>
            </div>
          </div>

          <div class="feynman-banner">
            <div class="feynman-banner-label">⚡ First-Principle Truth</div>
            <div class="feynman-truth">${ch.truth}</div>
          </div>

          <div class="chapter-content">
            ${marked.parse(ch.body)}
          </div>

          <div class="chapter-recall-card">
            <div class="recall-card-title">🎴 Chapter Retention Test</div>
            <div class="recall-card-question">Can you state the fundamental core truth of this chapter in 1 simple sentence?</div>
            <button class="btn-ui" style="padding: 8px 18px;" onclick="toggleAnswer(${idx})">Click to Reveal First-Principle Answer</button>
            <div id="recall-answer-${idx}" class="recall-card-answer">
              <div>${ch.truth}</div>
            </div>
          </div>
        `;

        bookStreamEl.appendChild(chapterSection);
      });

      // Typeset equations with MathJax if available
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise();
      }
    }

    function toggleAnswer(idx) {
      const el = document.getElementById(`recall-answer-${idx}`);
      if (el) el.classList.toggle('show');
    }

    function scrollToChapter(index) {
      const el = document.getElementById(`chapter-section-${index}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        highlightTocItem(index);
      }
    }

    function highlightTocItem(index) {
      currentChapterIndex = index;
      document.querySelectorAll('.toc-item').forEach((item, idx) => {
        item.classList.toggle('active', idx === index);
      });
    }

    // --- Scroll & Intersection Observer for Continuous Infinite Scroll ---
    function setupScrollObserver() {
      const activeData = getFilteredBookData();
      const observerOptions = {
        root: readerPaneEl,
        threshold: 0.15
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const idx = parseInt(entry.target.id.replace('chapter-section-', ''));
            if (!isNaN(idx)) {
              highlightTocItem(idx);
            }
          }
        });
      }, observerOptions);

      activeData.forEach((_, idx) => {
        const el = document.getElementById(`chapter-section-${idx}`);
        if (el) observer.observe(el);
      });

      readerPaneEl.addEventListener('scroll', () => {
        const scrollTop = readerPaneEl.scrollTop;
        const scrollHeight = readerPaneEl.scrollHeight - readerPaneEl.clientHeight;
        if (scrollHeight > 0) {
          const pct = (scrollTop / scrollHeight) * 100;
          progressBarFillEl.style.width = `${pct}%`;
        }
      });
    }

    // --- Initialization ---
    setTheme(currentTheme);
    document.documentElement.style.setProperty('--reader-font-size', `${currentFontSize}rem`);
    filterSubject(selectedSubject);
  </script>
