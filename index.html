      // ==========================================
      { subject: "history", subjectName: "History NCERT", chNum: 1, id: "his-ch-1", book: "Book I: Ancient Indian History (NCERT Class 6)", title: "1. What, Where, How and When? (Historical Methodology)", readTime: "5 min read", examTags: "Manuscripts, Inscriptions, Epigraphy, Numismatics, Carbon-14", truth: "History is an inquiry into human continuity and change over time, reconstructed through archaeological artifacts, written manuscripts, and epigraphic inscriptions.", body: `### Core Historical Methodology:\n- **Historia (Greek):** Knowledge acquired through systematic inquiry.\n- **BCE / CE System:** Before Common Era (counts backward to zero) vs Common Era. 200 BCE is more recent than 500 BCE.\n\n### 3 Primary Sources of History:\n1. **Archaeological:** Material remains (pots, tools, coins, bones, buildings).\n2. **Literary / Written:** Manuscripts (palm leaf / birch bark) & Inscriptions.\n3. **Oral Traditions:** Folklore, ballads, oral histories.\n\n<div class="exam-highlight-box">\n  <h4>📜 Manuscripts vs. Inscriptions</h4>\n  • <strong>Manuscripts:</strong> Handwritten on soft materials (palm leaf, birch bark). Prone to copying errors over centuries.<br>\n  • <strong>Inscriptions:</strong> Carved on hard surfaces (stone, metal, walls). More durable and reliable. Study of inscriptions = <strong>Epigraphy</strong>. Study of coins = <strong>Numismatics</strong>.\n</div>\n\n### Early Settlement Geography:\n- **Narmada Valley:** One of the earliest regions of human hunter-gatherer habitation.\n- **Sulaiman & Kirthar Hills (NW):** First wheat & barley farming + animal domestication (~8000 years ago).\n- **Indus River System:** First urban cities (~4700 years ago).\n- **Ganga & Son Valleys:** Rice cultivation (~2000+ years ago) & Magadha Empire.` },
      { subject: "history", subjectName: "History NCERT", chNum: 2, id: "his-ch-2", book: "Book I: Ancient Indian History (NCERT Class 6)", title: "2. On the Trail of the Earliest People (Stone Age)", readTime: "5 min read", examTags: "Palaeolithic, Mesolithic Microliths, Neolithic, Bhimbetka", truth: "Human tool technology evolved from crude hand-axes to precision microliths and ground tools, driving the transition from mobile hunter-gatherers to settled farming communities.", body: `### 3 Stone Age Phases:\n1. **Palaeolithic (Old Stone Age - 2M to 12,000 yrs ago):** Crude, unpolished flake & hand-axe stone tools. Sites: *Bhimbetka (MP), Hunsgi (Karnataka), Attirampakkam (TN)*.\n2. **Mesolithic (Middle Stone Age - 12,000 to 10,000 yrs ago):** **Microliths** (tiny, sharp stone blades hafted onto wood/bone handles for arrows & spears). Sites: *Bagor (Rajasthan), Adamgarh (MP)*.\n3. **Neolithic (New Stone Age - 10,000 to 4,000 yrs ago):** Polished stone tools, crop cultivation, animal domestication. Sites: *Mehrgarh, Burzahom, Chirand*.\n\n<div class="exam-highlight-box">\n  <h4>🎨 Bhimbetka Rock Shelters (UNESCO World Heritage Site)</h4>\n  Located in Raisen district, MP. Contains hundreds of prehistoric cave paintings showing hunting, dancing, and animals using natural mineral pigments (haematite red & limestone white).\n</div>` },
      { subject: "history", subjectName: "History NCERT", chNum: 3, id: "his-ch-3", book: "Book I: Ancient Indian History (NCERT Class 6)", title: "3. In the Earliest Cities (Harappan Civilisation)", readTime: "6 min read", examTags: "Indus Valley Civilisation, Town Planning, Citadel, Lothal, Dholavira", truth: "The Harappan Civilisation was South Asia's first urban revolution, defined by grid town planning, covered drainage, standardized weights, and maritime trade.", body: `### Harappan Civilisation (~2600–1900 BCE):\n- First urban civilization in South Asia. Grid system streets cutting at right angles; baked brick construction.\n\n### Citadel vs Lower Town:\n- **Citadel (West):** Raised platform, administrative/public buildings (Great Bath at Mohenjo-Daro, Granaries).\n- **Lower Town (East):** Residential quarters for common citizens.\n\n### Key Harappan Sites & Signature Features:\n- **Mohenjo-Daro (Sindh):** Great Bath (water-tight brickwork with bitumen sealant), Bronze Dancing Girl.\n- **Harappa (Punjab, Pak):** Granaries, coffin burials.\n- **Lothal (Gujarat):** World's earliest artificial **tidal dockyard**; bead-making factory; fire altars.\n- **Dholavira (Rann of Kutch, Gujarat):** 3-tiered city fortification; sophisticated water harvesting reservoirs; large ten-sign signboard.\n- **Kalibangan (Rajasthan):** Ploughed field surface; wooden drain; fire altars.` },
      { subject: "history", subjectName: "History NCERT", chNum: 4, id: "his-ch-4", book: "Book I: Ancient Indian History (NCERT Class 6)", title: "4. What Books and Burials Tell Us (Vedic Age)", readTime: "5 min read", examTags: "Rigveda, Hymns, Suktas, Megaliths, Inamgaon Burials", truth: "The Rigvedic era was a pastoral, egalitarian tribal society where wealth was counted in cattle, while Megalithic monuments marked social stratification in peninsular India.", body: `### The Rigveda:\n- Oldest Veda composed ~1500–1000 BCE in Vedic Sanskrit. Contains **1,028 hymns (Suktas)** organized in 10 Mandalas.\n- **Key Deities:** Agni (fire), Indra (warrior god), Soma (sacred plant drink).\n- **Society:** Pastoral, semi-nomadic. Wealth measured in cattle (*Gavishti* = search for cows). No standing army or taxation.\n\n### Megaliths (Big Stone Burials):\n- Found in Deccan, South India, and Northeast (~1000 BCE onwards). Stone circles or cairns marking underground graves.\n- Contain black and red ware pottery, iron tools, and weapons.\n- **Inamgaon (Maharashtra):** Chalcolithic burial site showing multi-room houses and adult burials with grave goods.` },
      { subject: "history", subjectName: "History NCERT", chNum: 5, id: "his-ch-5", book: "Book I: Ancient Indian History (NCERT Class 6)", title: "5. Kingdoms, Kings and an Early Republic (Mahajanapadas)", readTime: "6 min read", examTags: "16 Mahajanapadas, Magadha, Vajji Gana/Sangha, Bhaga Tax", truth: "Iron agricultural tools enabled a agricultural surplus, causing tribal janapadas to consolidate into 16 territorial Mahajanapadas and early republics.", body: `### Evolution:\n$$\\text{Jana (Tribe)} \\longrightarrow \\text{Janapada (Settled Land)} \\longrightarrow \\text{Mahajanapada (Territorial State)}$$\n\n### 16 Mahajanapadas (~600 BCE):\n- **Monarchies (Rajyas):** Magadha, Kosala, Vatsa, Avanti. Rule by hereditary king.\n- **Republics (Ganas / Sanghas):** **Vajji (capital Vaishali)** & Malla. Governance by assembly of elders (*Rajas*).\n\n### Why Magadha Became Supreme:\n1. Rich iron ore deposits (Singhbhum) for weapons and tools.\n2. Fertile Gangetic alluvial soil yielding 1/6th (*Bhaga*) tax surplus.\n3. Natural defensive capitals (Rajagriha surrounded by 5 hills; Pataliputra at river confluence).\n4. Strategic military use of war elephants.` },
      { subject: "history", subjectName: "History NCERT", chNum: 6, id: "his-ch-6", book: "Book I: Ancient Indian History (NCERT Class 6)", title: "6. New Questions and Ideas (Buddhism & Jainism)", readTime: "6 min read", examTags: "Buddhism, Four Noble Truths, Eightfold Path, Jainism, Upanishads", truth: "Buddhism and Jainism emerged as intellectual and social reform movements against Vedic animal sacrifices and caste rigidity, preaching non-violence and moral conduct.", body: `### 1. Buddhism (Siddhartha Gautama - The Buddha):\n- Born in Lumbini (KSHATRIYA Shakya clan). Attained enlightenment under Pipal tree at **Bodh Gaya**. First sermon at **Sarnath** (Dhammacakkappavattana). Passed away at **Kusinara**.\n- **Four Noble Truths:** Life is suffering; Suffering has a cause (desire/Tanha); Suffering can end; Path is the **Eightfold Path (Astangika Marga)**.\n- Rejection of Varna hierarchy & animal sacrifices; teachings in Prakrit (language of masses).\n\n### 2. Jainism (Vardhamana Mahavira):\n- 24th Tirthankara (Jnatrika clan). Attained Kevalajnana.\n- **5 Doctrines:** Ahimsa (strict non-violence to all living beings), Satya, Asteya, Aparigraha, Brahmacharya (added by Mahavira).\n\n### 3. Upanishads & Sangha:\n- **Upanishads:** Philosophical dialogues on Atman (individual soul) and Brahman (universal soul).\n- **Sangha & Viharas:** Monastic orders and permanent rock-cut/brick shelters for monks.` },
      { subject: "history", subjectName: "History NCERT", chNum: 7, id: "his-ch-7", book: "Book I: Ancient Indian History (NCERT Class 6)", title: "7. Ashoka, The Emperor Who Gave Up War", readTime: "6 min read", examTags: "Chandragupta Maurya, Kalinga War 261 BCE, Ashoka Dhamma, Edicts", truth: "After the catastrophic Kalinga War, Ashoka substituted military conquest (Dhammavijaya) with moral governance (Dhamma), issuing rock edicts across the empire.", body: `### Mauryan Empire (~321–185 BCE):\n- Founded by **Chandragupta Maurya** after overthrowing Dhana Nanda with Chanakya (Kautilya author of *Arthashastra*).\n- Empire stretched from Afghanistan/Kandahar to Karnataka.\n\n### Ashoka's Kalinga War (261 BCE):\n- Conquest of Kalinga (modern Odisha) resulted in 100,000 deaths and 150,000 captives. The violence filled Ashoka with remorse.\n\n<div class="exam-highlight-box">\n  <h4>📜 Policy of Dhamma & Edicts</h4>\n  • <strong>Dhamma:</strong> Not a new religion, but a moral code (respect for elders, Ahimsa toward animals, truthfulness, humane treatment of servants).<br>\n  • <strong>Edicts:</strong> Inscribed on rocks and polished pillars in Prakrit (Brahmi script) and Greek/Aramaic in NW.<br>\n  • <strong>Dhamma Mahamattas:</strong> Special officers appointed to spread Dhamma and welfare.\n</div>` },
      { subject: "history", subjectName: "History NCERT", chNum: 8, id: "his-ch-8", book: "Book I: Ancient Indian History (NCERT Class 6)", title: "8. Vital Villages, Thriving Towns (Second Urbanisation)", readTime: "5 min read", examTags: "Iron Ploughshare, NBPW, Shrenis (Guilds), Sangam Literature", truth: "Widespread adoption of iron agricultural tools and paddy transplantation created a massive economic surplus that fuelled India's Second Urbanisation.", body: `### Drivers of Second Urbanisation (~500 BCE onwards):\n- **Iron Ploughshare & Paddy Transplantation:** Increased crop yields dramatically across Gangetic plains.\n- **Northern Black Polished Ware (NBPW):** Fine deluxe pottery with mirror-like metallic luster, signature of urban centers.\n\n### Guilds (Shrenis):\n- Associations of craftspersons and merchants.\n- Functions: Provided training, procured raw materials, distributed finished goods, served as **banks** taking deposits and lending interest.\n\n### Sangam Literature & Southern Trade:\n- Earliest Tamil literature compiled in 3 assemblies (Sangams) at Madurai under Pandyan patronage.\n- **Arikamedu (Puducherry):** Major coastal port facility trading with the Roman Empire (amphorae jars, Arretine stamped pottery found).` },
      { subject: "history", subjectName: "History NCERT", chNum: 9, id: "his-ch-9", book: "Book I: Ancient Indian History (NCERT Class 6)", title: "9. Traders, Kings and Pilgrims (Silk Route)", readTime: "6 min read", examTags: "Silk Route, Kushanas, Kanishka, Chinese Pilgrims (Fa Hien, Xuanzang)", truth: "Control over international overland trade routes funded ancient empires, while trade networks facilitated the trans-continental spread of Mahayana Buddhism.", body: `### The Silk Route & Kushana Empire:\n- **Silk Route:** Ancient trade network connecting China, India, Central Asia, and Europe.\n- **Kushanas (1st–3rd CE):** Controlled the major branches of the Silk Route. First rulers in India to issue large-scale **gold coins**.\n- **King Kanishka (c. 78 CE):** Convened 4th Buddhist Council in Kashmir (division into Hinayana & Mahayana). Patronized **Ashvaghosha** (author of *Buddhacharita*).\n\n### Chinese Pilgrims to India:\n1. **Fa Hien (399–414 CE):** Visited during Chandragupta II's reign.\n2. **Xuanzang (629–645 CE):** Visited during Harsha's reign; spent years studying at Nalanda University.\n3. **I-Tsing (671–695 CE):** Came via sea route to study Buddhist texts.` },
      { subject: "history", subjectName: "History NCERT", chNum: 10, id: "his-ch-10", book: "Book I: Ancient Indian History (NCERT Class 6)", title: "10. New Empires and Kingdoms (Guptas & Harsha)", readTime: "6 min read", examTags: "Gupta Golden Age, Samudragupta, Chandragupta II, Harsha, Pulakeshin II", truth: "The Gupta period was India's classical golden age of Sanskrit literature, mathematics, and science, followed by Harsha's empire in northern India.", body: `### 1. Gupta Empire (~320–550 CE) — The Golden Age:\n- **Chandragupta I (319 CE):** Founded Gupta Era; married Licchhavi princess.\n- **Samudragupta (~335–375 CE):** 'Napoleon of India' (V.A. Smith). **Allahabad Pillar Inscription (Prayag Prashasti)** composed by court poet Harishena. Played veena on gold coins.\n- **Chandragupta II Vikramaditya (~375–415 CE):** Defeated Western Sakas. Court adorned by **Navratnas (9 Gems)** including **Kalidasa** (*Abhijnanasakuntalam*) and **Aryabhata** (*Aryabhatiya*). Built rust-resistant **Iron Pillar of Delhi**.\n- **Kumaragupta I:** Founded **Nalanda University**.\n\n### 2. Harsha of Kanauj (~606–647 CE):\n- Ruled north India from Kanauj. Court poet **Bana Bhatta** wrote biography *Harshacharita*.\n- **Defeat by Pulakeshin II:** Harsha tried to expand into Deccan but was defeated by Chalukya king Pulakeshin II (recorded in **Aihole Inscription** by Ravikirti).` },
      { subject: "history", subjectName: "History NCERT", chNum: 11, id: "his-ch-11", book: "Book I: Ancient Indian History (NCERT Class 6)", title: "11. Buildings, Paintings and Books (Art & Culture)", readTime: "7 min read", examTags: "Stupas, Nagara/Dravida/Vesara, Ajanta Caves, Kailasa Temple", truth: "Ancient Indian architecture evolved from rock-cut Buddhist chaityas and stupas to structural Hindu temples in Nagara, Dravida, and Vesara styles.", body: `### 1. Stupa Architecture:\n- Hemispherical mound over Buddha's relics. Parts: **Anda** (dome), **Harmika** (square balcony), **Yashti** (umbrella pole), **Torana** (carved gateway).\n- **Sanchi Stupa (MP):** Built by Ashoka; finest torana carvings depicting Jataka stories.\n\n### 2. Temple Architecture Styles:\n- **Nagara (North India):** Curvilinear *Shikhara* tower over *Garbhagriha* (sanctum). No massive boundary walls. Examples: *Khajuraho, Konark*.\n- **Dravida (South India):** Pyramidal tiered *Vimana* tower, huge *Gopuram* gateways, temple tank. Examples: *Brihadeeswara (Thanjavur), Shore Temple*.\n- **Vesara (Deccan):** Hybrid star-shaped plan combining Nagara & Dravida. Examples: *Hoysala temples, Pattadakal*.\n\n### 3. Rock-Cut Masterpieces:\n- **Ajanta Caves (MH):** 29 Buddhist caves. World-famous tempera mural paintings (Padmapani Bodhisattva).\n- **Ellora Caves (MH):** 34 caves (12 Buddhist, 17 Hindu, 5 Jain). **Kailasa Temple (Cave 16)** carved top-down out of a single monolith by Rashtrakuta King Krishna I.` },
      { subject: "history", subjectName: "History NCERT", chNum: 12, id: "his-ch-12", book: "Book II: Medieval Indian History (NCERT Class 7)", title: "12. Tracing Changes Through a Thousand Years", readTime: "5 min read", examTags: "Medieval Periodisation, Al-Idrisi Map, Cartography, Jatis, Prashastis", truth: "The medieval period (~700–1750 CE) witnessed major socio-economic transformations, technological developments like the Persian wheel, and the evolution of composite Indian culture.", body: `### Core Medieval Transformations (~700–1750 CE):\n- **Cartography Shift:** Al-Idrisi (1154 CE Arab map with South at top) vs Guillaume de l'Isle (1720s French map with modern orientation).\n- **Evolution of Terminology:** *Hindustan* shifted from Minhaj-i-Siraj (13th century - Punjab, Haryana & Ganga-Yamuna lands) to Babur (subcontinent's geography & fauna) to modern nation-state.\n\n### New Technologies & Social Groups:\n- **Technological Advances:** Persian wheel (*Rahat*) in irrigation, spinning wheel in weaving, firearms in combat.\n- **New Social Groups:** **Rajputs** (Rajaputra - sons of rulers), Marathas, Sikhs, Jats, Ahoms.\n- **Jati Panchayats:** Sub-castes (*Jatis*) framed their own rules enforced by an assembly of elders (*Jati Panchayat*).` },
      { subject: "history", subjectName: "History NCERT", chNum: 13, id: "his-ch-13", book: "Book II: Medieval Indian History (NCERT Class 7)", title: "13. New Kings and Kingdoms (700–1200 CE)", readTime: "6 min read", examTags: "Tripartite Struggle, Cholas, Samantas, Prashastis, Ur & Sabha", truth: "Early medieval India was defined by the rise of feudatory Samantas into independent dynasties, the Tripartite Struggle for Kanauj, and Chola maritime dominance.", body: `### Emergence of New Dynasties:\n- **Samantas:** Feudatories who provided military support. When weak, overlords were overthrown (e.g. Rashtrakuta chief **Dantidurga** performed *Hiranya-garbha* golden womb ritual to become Kshatriya).\n- **Tripartite Struggle:** 200-year conflict over fertile **Kanauj** between **Gurjara-Pratiharas, Rashtrakutas, and Palas**.\n\n### The Chola Empire of Thanjavur:\n- Founded by **Vijayalaya** (captured Thanjavur from Muttaraiyar). Great rulers: **Rajaraja I** & his son **Rajendra I** (naval expedition to Sri Lanka & SE Asia / Srivijaya).\n- **Chola Art:** Masterpieces of **Bronze Sculptures** (Nataraja dancing Shiva).\n- **Local Administration:** **Ur** (general village assembly) vs **Sabha** (assembly of prominent Brahmin landholders at *Agraharas*).` },
      { subject: "history", subjectName: "History NCERT", chNum: 14, id: "his-ch-14", book: "Book II: Medieval Indian History (NCERT Class 7)", title: "14. The Delhi Sultans (1206–1526 CE)", readTime: "6 min read", examTags: "5 Dynasties, Iqta System, Alauddin Khilji Market Reforms, Tughluq Experiments", truth: "The Delhi Sultanate established centralized Islamic rule in northern India, driven by the Iqta administrative system, market price controls, and military garrison towns.", body: `### 5 Delhi Sultanate Dynasties:\n1. **Slave / Mamluk (1206–1290):** Qutbuddin Aibak, Iltutmish (*Turkan-i-Chahalgani* 40 nobles), **Razia Sultan** (first female ruler), Balban (*Sijdah & Paibos*).\n2. **Khilji (1290–1320):** **Alauddin Khilji** (market price control, *Shahna-i-Mandi*, *Dag* horse branding & *Huliya* soldier records).\n3. **Tughluq (1320–1414):** Ghiyasuddin, **Muhammad bin Tughluq** (Capital shift to Daulatabad, Token Currency), Firuz Shah Tughluq (Canal network).\n4. **Sayyid (1414–1451)** & 5. **Lodi (1451–1526):** Ibrahim Lodi defeated by Babur in 1526.\n\n<div class="exam-highlight-box">\n  <h4>📜 The Iqta System</h4>\n  Sultans divided empire into military territories called <strong>Iqtas</strong> given to military commanders (<strong>Iqtadars / Muqtis</strong>) who collected land revenue to maintain troops.\n</div>` },
      { subject: "history", subjectName: "History NCERT", chNum: 15, id: "his-ch-15", book: "Book II: Medieval Indian History (NCERT Class 7)", title: "15. The Mughal Empire (1526–1707 CE)", readTime: "7 min read", examTags: "Mansabdari System, Zabt & Dahsala, Sulh-i-Kul, Akbar's Administration", truth: "The Mughal Empire unified South Asia through military bureaucracy (Mansabdari), Todar Mal's revenue system (Zabt/Dahsala), and Akbar's policy of universal peace (Sulh-i-Kul).", body: `### Mughal Rulers & Expansion:\n- **Babur (1526):** Defeated Ibrahim Lodi at First Battle of Panipat.\n- **Akbar (1556–1605):** Defeated Hemu at Second Battle of Panipat. Expanded empire across northern & central India.\n\n### Administrative Innovations:\n- **Mansabdari System:** Military-administrative grading system. Rank determined by **Zat** (personal status & salary) and **Sawar** (number of cavalrymen required to maintain).\n- **Zabt & Dahsala Revenue System:** Designed by Revenue Minister **Raja Todar Mal**. Surveyed crop yields and market prices over a 10-year period (1570–1580) to fix cash tax rates.\n\n<div class="exam-highlight-box">\n  <h4>🕊️ Akbar's Religious Policy: Sulh-i-Kul</h4>\n  Akbar built <strong>Ibadat Khana</strong> (House of Worship) at Fatehpur Sikri. Formulated policy of <strong>Sulh-i-Kul (Universal Peace)</strong> focusing on ethics, honesty, justice, and tolerance across all religions, documented by court historian <strong>Abul Fazl</strong> in <em>Akbarnama & Ain-i-Akbari</em>.\n</div>` },
      { subject: "history", subjectName: "History NCERT", chNum: 16, id: "his-ch-16", book: "Book II: Medieval Indian History (NCERT Class 7)", title: "16. Rulers and Buildings (Medieval Architecture)", readTime: "6 min read", examTags: "Trabeate vs Arcuate, Chahar Bagh, Pietra Dura, Taj Mahal, Qutb Minar", truth: "Medieval Indian architecture shifted from indigenous trabeate lintel construction to Indo-Islamic arcuate arches, true domes, Pietra Dura inlay, and symmetrical Chahar Bagh gardens.", body: `### Architectural Styles & Innovations:\n1. **Trabeate (Corbelled) Construction:** Horizontal beam placed across two vertical pillars (used in Hindu temples & early mosques 8th–13th century).\n2. **Arcuate Construction:** Weight of superstructure above doors/windows carried by true **arches** with a central keystone and true **domes**.\n\n### Mughal Architectural Zenith:\n- **Chahar Bagh Gardens:** Symmetrical 4-fold gardens divided by water channels (introduced by Babur, perfected in Humayun's Tomb & Taj Mahal).\n- **Pietra Dura:** Inlay technique embedding colored hard stones (lapis lazuli, onyx, jasper) into white marble forming floral designs (seen in Shah Jahan's throne at Red Fort Delhi).\n- **Shah Jahan's Imperial Capital:** Shahjahanabad (Delhi) featuring the Red Fort (*Diwan-i-Aam & Diwan-i-Khas*) and Jama Masjid.` },
      { subject: "history", subjectName: "History NCERT", chNum: 17, id: "his-ch-17", book: "Book II: Medieval Indian History (NCERT Class 7)", title: "17. Towns, Traders and Craftspersons", readTime: "6 min read", examTags: "Temple Towns, Bidriware, Surat, Masulipatnam, Hampi", truth: "Medieval towns evolved into specialised administrative centres, temple urban nodes, and cosmopolitan trade ports supported by merchant guilds.", body: `### Types of Medieval Towns:\n- **Administrative Towns:** Capital cities like Thanjavur.\n- **Temple Towns & Pilgrimage Centres:** Kanchipuram, Tirupati, Somnath, Ajmer (Vriddhas / *Agraharas*).\n- **Commercial & Port Towns:** Surat (gateway to West Asia via Persian Gulf), Masulipatnam, Hampi.\n\n### Crafts, Guilds & Trade Networks:\n- **Bidriware:** Inlay work in copper and zinc with silver metal wire developed by craftspersons of Bidar.\n- **Merchant Guilds:** *Chettis*, *Marwaris*, *Banjaras* mobile trader caravans (*Tanda*).\n\n<div class="exam-highlight-box">\n  <h4>🏛️ Hampi (Vijayanagara Architecture)</h4>\n  Located in Krishna-Tungabhadra basin. Mortarless interlocking stone masonry. Famous for <strong>Mahanavami Dibba</strong> platform where kings observed festivals and army parades.\n</div>` },
      { subject: "history", subjectName: "History NCERT", chNum: 18, id: "his-ch-18", book: "Book II: Medieval Indian History (NCERT Class 7)", title: "18. Tribes, Nomads and Settled Communities", readTime: "6 min read", examTags: "Gonds, Ahoms, Garha Katanga, Paiks, Banjaras, Khels", truth: "Medieval Indian society maintained dynamic economic and political exchanges between agrarian Varna-based kingdoms and autonomous tribal polities.", body: `### Tribal Societies & Nomads:\n- **Banjaras:** The most important trader-nomads; their transport caravans were called *Tanda*. Used by Alauddin Khilji and Mughals to transport grain to urban markets.\n\n### Key Tribal Kingdoms:\n- **Gond Kingdom of Garha Katanga:** Rich state exporting wild elephants. Divided into *Garhs* (84 villages called *Chaurasi*). Famous ruler **Rani Durgavati** fought Akbar's general Asaf Khan.\n- **Ahom Kingdom of Assam:** Migrated from modern Myanmar in 13th century. State depended on forced labor (**Paiks**). Society organized into clans (**Khels**). Maintained historical chronicles called **Buranjis**.` },
      { subject: "history", subjectName: "History NCERT", chNum: 19, id: "his-ch-19", book: "Book II: Medieval Indian History (NCERT Class 7)", title: "19. Devotional Paths to the Divine (Bhakti & Sufi Movements)", readTime: "7 min read", examTags: "Alvars & Nayanars, Shankara & Ramanuja, Sufi Silsilas, Kabir, Guru Nanak", truth: "Bhakti and Sufi movements democratized spirituality by rejecting Varna rituals, emphasizing intense personal devotion, and promoting vernacular literature.", body: `### 1. Early South Indian Bhakti:\n- **Nayanars (63 saints):** Devoted to Lord Shiva (Appar, Sambandar, Sundarar).\n- **Alvars (12 saints):** Devoted to Lord Vishnu (Nammalvar, Andal female saint).\n\n### 2. Philosophers:\n- **Shankara (8th century):** Advocate of **Advaita (Non-Dualism)** — Atman and Brahman are one.\n- **Ramanuja (11th century):** Advocate of **Vishishtadvaita (Qualified Non-Dualism)**.\n\n### 3. Sufi Silsilas & Saints:\n- **Chishti Silsila:** Khwaja Muinuddin Chishti (Ajmer), Nizamuddin Auliya (Delhi). Used *Sama* musical gatherings.\n- **Nirguna vs Saguna Reformers:** **Kabir** (Bijak, Sakhi & Sabad rejecting rituals), **Guru Nanak** (Ekonkar, Langar, Guru Granth Sahib), **Mirabai** (Krishna Bhakti), **Tukaram** (Abhangs in Maharashtra).` },
      { subject: "history", subjectName: "History NCERT", chNum: 20, id: "his-ch-20", book: "Book II: Medieval Indian History (NCERT Class 7)", title: "20. The Making of Regional Cultures", readTime: "6 min read", examTags: "Jagannath Cult, Chera Malayalam, Kathak, Kangra Miniature, Bengali Mangalakavyas", truth: "Regional cultures emerged through the synthesis of local traditions with pan-Indian classical heritage, nurtured by royal courts and vernacular literature.", body: `### Regional Identifications:\n- **Language & Royalty:** Chera kingdom of Mahodayapuram (Kerala) introduced Malayalam in official inscriptions (*Lilatilakam* 14th century grammar text).\n- **The Jagannath Cult of Puri:** Local tribal wooden deity assimilated into Lord Vishnu; adopted as state deity by Ganga Dynasty king Anantavarman.\n\n### Classical Art Forms:\n- **Kathak Dance:** Originated as temple storytellers in North India; evolved into court dance under Nawab Wajid Ali Shah of Awadh.\n- **Miniature Painting:** Basohli intense style & **Kangra School** of Himachal Pradesh (soft colors, lyrical treatment of Radha-Krishna themes).\n- **Bengali Regional Tradition:** Development of *Mangalakavyas* and Nath cult.` },
      { subject: "history", subjectName: "History NCERT", chNum: 21, id: "his-ch-21", book: "Book II: Medieval Indian History (NCERT Class 7)", title: "21. Eighteenth-Century Political Formations", readTime: "7 min read", examTags: "Mughal Decline, Hyderabad (Asaf Jah), Awadh (Burhan-ul-Mulk), Bengal, Marathas, Panipat 1761", truth: "The fragmentation of the Mughal Empire in the 18th century gave rise to autonomous successor states and regional confederacies, creating the vacuum exploited by the British East India Company.", body: `### Causes of Mughal Collapse:\n- Aurangzeb's long Deccan campaign depleted treasury & military.\n- Crisis of the **Mansabdari System** & peasant revolts.\n- **Invasions:** Nadir Shah of Iran (1739 - looted Peacock Throne & Kohinoor diamond) and Ahmad Shah Abdali (invaded 5 times).\n\n### 3 Successor States:\n1. **Hyderabad:** Founded by Nizam-ul-Mulk Asaf Jah (1724).\n2. **Awadh:** Founded by Burhan-ul-Mulk Sa'adat Khan (1722).\n3. **Bengal:** Founded by Murshid Quli Khan.\n\n### Regional Powers:\n- **Maratha Confederacy:** Expanded under Peshwas (Balaji Viswanath, Baji Rao I). Collected *Chauth* (25%) & *Sardeshmukhi* (10%) revenue. Checked at **Third Battle of Panipat (1761)**.\n- **Sikhs:** Consolidated into 12 *Misls*; unified under **Maharaja Ranjit Singh** (capital Lahore).` },
      { subject: "history", subjectName: "History NCERT", chNum: 22, id: "his-ch-22", book: "Book III: Modern Indian History (NCERT Class 8)", title: "22. How, When and Where (Colonial Period & Sources)", readTime: "5 min read", examTags: "James Mill Periodisation, Colonial Surveys, National Archives, Census", truth: "Colonial British historians periodised Indian history along religious lines to justify imperial rule, while official administrative records and surveys served as instruments of colonial control.", body: `### Colonial Periodisation Debates:\n- **James Mill (1817):** In *A History of British India*, divided history into Hindu, Muslim, and British periods — a deeply flawed religious framing.\n- **Modern Periodisation:** Ancient, Medieval, and Modern (Colonial period marked by subjection, lack of freedom, and economic exploitation).\n\n### Primary Colonial Sources:\n- **Official Administrative Records:** Proceedings of Board of Revenue, Home Department files preservation in **National Archives of India (New Delhi)**.\n- **Surveys & Census:** Topographical surveys by Survey of India, Botanical/Zoological surveys, decennial **Census operations** starting 1871/1881.` },
      { subject: "history", subjectName: "History NCERT", chNum: 23, id: "his-ch-23", book: "Book III: Modern Indian History (NCERT Class 8)", title: "23. From Trade to Territory (EIC Establishes Power)", readTime: "7 min read", examTags: "Battle of Plassey 1757, Battle of Buxar 1764, Diwani Rights, Subsidiary Alliance", truth: "The East India Company transformed from a chartered trading corporation into a sovereign territorial empire through military conquests, revenue monopolies, and coercive treaty alliances.", body: `### Key Battles & Territorial Conquests:\n- **Battle of Plassey (1757):** Robert Clive defeated Siraj-ud-Daulah through Mir Jafar's treachery.\n- **Battle of Buxar (1764):** EIC defeated combined forces of Mir Qasim, Shuja-ud-Daulah (Awadh), and Shah Alam II (Mughal Emperor).\n- **Treaty of Allahabad (1765):** Granted **Diwani Rights** (right to collect land revenue of Bengal, Bihar, and Odisha) to the Company.\n\n<div class="exam-highlight-box">\n  <h4>📜 Coercive Expansion Policies</h4>\n  • <strong>Subsidiary Alliance (Lord Wellesley 1798):** Indian rulers forced to disband standing army and maintain British troops at own cost; first accepted by Nizam of Hyderabad.<br>\n  • <strong>Doctrine of Lapse (Lord Dalhousie):** Annexed kingdoms without direct natural male heir (Satara 1848, Sambalpur, Jhansi 1853, Nagpur 1854). Awadh annexed in 1856 on charges of 'misgovernance'.\n</div>` },
      { subject: "history", subjectName: "History NCERT", chNum: 24, id: "his-ch-24", book: "Book III: Modern Indian History (NCERT Class 8)", title: "24. Ruling the Countryside (Land Revenue & Commercial Crops)", readTime: "7 min read", examTags: "Permanent Settlement 1793, Ryotwari, Mahalwari, Indigo Revolt 1859", truth: "Colonial land revenue systems monetized agrarian relations, commodified land ownership, and forced commercial crop cultivation, causing recurring agrarian famines and rural indebtedness.", body: `### 3 Colonial Land Revenue Systems:\n1. **Permanent Settlement (1793 - Lord Cornwallis):** Introduced in Bengal, Bihar, Odisha. Zamindars recognized as permanent land owners; fixed high revenue demand (10/11th to Company). Sunset Law enforced.\n2. **Ryotwari System (Thomas Munro & Alexander Read):** Introduced in Madras & Bombay Presidencies. Direct settlement with actual cultivators (*Ryots*); revenue revised periodically.\n3. **Mahalwari System (Holt Mackenzie 1822):** Introduced in NW Provinces, Punjab, Central India. Revenue settled with village community (*Mahal*).\n\n### Commercialisation of Agriculture & Indigo Revolt:\n- Forced cultivation of **Indigo** under *Nij* (planter's land) and *Ryoti* (contractual) systems.\n- **Indigo Revolt (1859–60):** Ryots in Bengal refused to grow indigo, immortalized in Dinabandhu Mitra's play *Neel Darpan* and investigated by the **Indigo Commission (1860)**.` },
      { subject: "history", subjectName: "History NCERT", chNum: 25, id: "his-ch-25", book: "Book III: Modern Indian History (NCERT Class 8)", title: "25. Tribals, Dikus and the Vision of a Golden Age", readTime: "6 min read", examTags: "Birsa Munda Ulgulan, Santhal Hool 1855, Dikus, Forest Acts", truth: "Colonial forest reservation laws alienating indigenous tribes from their customary lands ignited widespread armed tribal rebellions led by charismatic leaders like Birsa Munda.", body: `### Tribal Livelihoods & Disruption:\n- Livelihoods: **Jhum (shifting) cultivation**, hunting-gathering, pastoralism, and settled agriculture (*Khuntkatti* land system).\n- **Impact of Colonial Laws:** Forest Acts declared forests state property, creating **Reserved Forests** (no tribal entry) and converting tribal lands to **Dikus** (outsider moneylenders and traders).\n\n### Major Tribal Rebellions:\n- **Santhal Hool (1855–56):** Led by **Sidhu and Kanhu** against moneylenders and British revenue agents in Rajmahal hills.\n- **Birsa Munda & The Ulgulan (Great Tumult 1899–1900):** Birsa Munda mobilized the Mundas of Chota Nagpur to establish *Munda Raj*. Led to the enactment of the **Chota Nagpur Tenancy Act (1908)** protecting tribal land rights.` },
      { subject: "history", subjectName: "History NCERT", chNum: 26, id: "his-ch-26", book: "Book III: Modern Indian History (NCERT Class 8)", title: "26. When People Rebel - 1857 and After", readTime: "7 min read", examTags: "Revolt of 1857, Mangal Pandey, Nana Sahib, Rani Lakshmibai, GOI Act 1858", truth: "The Revolt of 1857 was South Asia's first major war of independence against British colonial rule, dismantling East India Company rule and establishing direct British Crown sovereignty.", body: `### Outbreak & Spark:\n- **Spark:** Introduction of **Enfield Rifle cartridges** greased with cow and pig fat. **Mangal Pandey** mutinied at Barrackpore (29 March 1857). Sepoys at Meerut revolted on 10 May 1857 and marched to Delhi proclaiming **Bahadur Shah Zafar** as Emperor of India.\n\n### Centres of Revolt & Leaders:\n- **Delhi:** Bahadur Shah Zafar & General Bakht Khan.\n- **Kanpur:** **Nana Sahib** & Tantia Tope.\n- **Lucknow:** **Begum Hazrat Mahal** & Birjis Qadr.\n- **Jhansi:** **Rani Lakshmibai** ("fell fighting bravely").\n- **Bihar (Jagdishpur):** **Kunwar Singh** (80-year-old landlord).\n\n<div class="exam-highlight-box">\n  <h4>📜 Aftermath: Government of India Act 1858</h4>\n  • EIC rule abolished; power transferred directly to the <strong>British Crown</strong>.<br>\n  • Governor-General given title of <strong>Viceroy</strong> (Lord Canning first Viceroy).<br>\n  • Office of <strong>Secretary of State for India</strong> created with a 15-member Council.<br>\n  • <strong>Queen's Proclamation (1 Nov 1858):</strong> Promised no further territorial annexation and non-interference in religious customs.\n</div>` },
      { subject: "history", subjectName: "History NCERT", chNum: 27, id: "his-ch-27", book: "Book III: Modern Indian History (NCERT Class 8)", title: "27. Colonialism and the City (Urban Transformation)", readTime: "5 min read", examTags: "Lutyens New Delhi, White Town vs Black Town, De-urbanisation", truth: "Colonial urbanization replaced traditional organic Indian court cities with segregated White and Black towns, railway hubs, and monumental imperial capitals.", body: `### De-urbanisation of Mughal Capitals:\n- Cities like Delhi, Agra, and Murshidabad lost administrative importance during the 19th century as trade shifted to Presidency port cities (Calcutta, Bombay, Madras).\n\n### Segregated Colonial Urban Layout:\n- **White Town:** Spacious, well-paved Civil Lines and Cantonments reserved for Europeans.\n- **Black Town:** Congested, poorly serviced residential quarters for Indian merchants and laborers.\n\n### Construction of New Delhi (1911 Onward):\n- Capital shifted from Calcutta to Delhi in **1911** (Delhi Durbar of King George V).\n- Architecture designed by **Edwin Lutyens and Herbert Baker** (Viceroy's House / Rashtrapati Bhavan, Kingsway / Rajpath, Secretariat buildings) blending classical Greek/Roman with Indian domes and *chhatris*.` },
      { subject: "history", subjectName: "History NCERT", chNum: 28, id: "his-ch-28", book: "Book III: Modern Indian History (NCERT Class 8)", title: "28. Weavers, Iron Smelters and Factory Owners", readTime: "6 min read", examTags: "De-industrialisation, Dhaka Muslin, Calico Acts, Wootz Steel, TISCO 1907", truth: "British industrial tariffs systematically de-industrialized traditional Indian textile and steel artisans, transforming India from a global manufacturing exporter into a raw material exporter.", body: `### Decline of Indian Textiles:\n- **Pre-colonial Prominence:** Indian cotton textiles dominated global trade (*Dhaka Muslin*, *Chintz*, *Calico*).\n- **British Protectionism:** **Calico Act (1720)** banned import of printed cotton textiles into England. Industrial Revolution machinery flooded India with cheap Manchester cloth.\n- **De-industrialisation:** Destruction of traditional handloom weavers in Bengal and Gujarat.\n\n### Iron Smelting & Emergence of Modern Industry:\n- **Wootz Steel:** High-carbon steel forged in South India, used for famous Damascus swords; declined due to colonial Forest Acts.\n- **TISCO (Tata Iron and Steel Company):** Founded by Jamsetji Tata and Dorabji Tata in **1907** at Jamshedpur; expanded rapidly during WWI when British steel supply was disrupted.` },
      { subject: "history", subjectName: "History NCERT", chNum: 29, id: "his-ch-29", book: "Book III: Modern Indian History (NCERT Class 8)", title: "29. Civilising the 'Native', Educating the Nation", readTime: "6 min read", examTags: "Macaulay's Minute 1835, Wood's Despatch 1854, Orientalist vs Anglicist, Shantiniketan", truth: "Colonial education sought to create a class of English-educated clerks loyal to British rule, prompting nationalist thinkers like Tagore and Gandhi to champion indigenous educational paradigms.", body: `### Orientalist vs. Anglicist Debate:\n- **Orientalists (William Jones, Henry Thomas Colebrooke):** Favored study of ancient Sanskrit and Persian literature; founded **Asiatic Society of Bengal (1784)** and Calcutta Madrasa (1781).\n- **Anglicists (Thomas Babington Macaulay):** Derided Oriental learning ("a single shelf of a good European library was worth the whole native literature of India"). **Macaulay's Minute (1835)** made English the medium of higher instruction.\n\n### Wood's Despatch (1854) & Nationalist Alternatives:\n- **Wood's Despatch (1854):** "Magna Carta of English Education in India". Emphasized practical economic utility of Western education and set up university system (Calcutta, Bombay, Madras universities in 1857).\n- **Rabindranath Tagore:** Founded **Visva-Bharati at Shantiniketan (1901)** — learning in harmony with nature.\n- **Mahatma Gandhi:** Rejected English education as enslaving; advocated **Nai Talim (Basic Education)** combining craft, work, and literacy in mother tongue.` },
      { subject: "history", subjectName: "History NCERT", chNum: 30, id: "his-ch-30", book: "Book III: Modern Indian History (NCERT Class 8)", title: "30. Women, Caste and Reform", readTime: "7 min read", examTags: "Abolition of Sati 1829, Widow Remarriage Act 1856, Jyotirao Phule Gulamgiri, Periyar, Ambedkar", truth: "19th-century social reform movements used scriptural reinterpretation and legislative action to attack gender oppression and caste hierarchies.", body: `### Gender Reform Movements:\n- **Raja Ram Mohan Roy:** Founded **Brahmo Samaj (1828)**; campaigned against Sati $\\rightarrow$ **Abolition of Sati Regulation (1829)** under Lord William Bentinck.\n- **Ishwar Chandra Vidyasagar:** Used ancient Sanskrit texts to champion widow remarriage $\\rightarrow$ **Hindu Widows' Remarriage Act (1856)**.\n- **Pandita Ramabai:** Founded **Sharada Sadan** in Bombay for destitute widows.\n- **Veeresalingam Pantulu:** Spearheaded widow remarriage movement in Telugu-speaking coastal Andhra.\n\n### Anti-Caste Movements:\n- **Jyotirao Phule:** Founded **Satyashodhak Samaj (1873)**; authored *Gulamgiri* (Slavery) dedicated to American anti-slavery fighters.\n- **Sri Narayana Guru (Kerala):** Preached *"One Caste, One Religion, One God for Man"* (*Oru Jathi, Oru Matham, Oru Daivam Manushyanu*).\n- **Dr. B.R. Ambedkar:** Led **Mahad Satyagraha (1927)** for public water access; founded *Bahishkrit Hitakarini Sabha* and led Temple Entry movements.\n- **E.V. Ramasamy (Periyar):** Founded **Self-Respect Movement** in Tamil Nadu.` },
      { subject: "history", subjectName: "History NCERT", chNum: 31, id: "his-ch-31", book: "Book III: Modern Indian History (NCERT Class 8)", title: "31. The Changing World of Visual Arts", readTime: "5 min read", examTags: "Company Paintings, Raja Ravi Varma, Kalighat Art, Bengal School Abanindranath Tagore", truth: "Indian visual art evolved from colonial Company portraiture to Raja Ravi Varma's oil prints and Abanindranath Tagore's nationalist Bengal School movement.", body: `### Colonial Art Styles:\n- **Company Paintings:** Commissioned by EIC officials, executed by Indian artists combining traditional detail with European perspective.\n- **Picturesque Landscape & Portraiture:** European painters like Thomas Daniell and William Daniell depicting picturesque ruins and grand imperial architecture.\n\n### Nationalist Art Movements:\n- **Raja Ravi Varma (Travancore):** Mastered Western oil painting and realistic perspective to depict scenes from Ramayana and Mahabharata. Established a **picture printing press** near Mumbai to mass-produce cheap oleographs for common households.\n- **Bengal School of Art:** Founded by **Abanindranath Tagore** (nephew of Rabindranath) and E.B. Havell. Rejected Western oil realism, drawing inspiration from Ajanta murals, Mughal miniatures, and Japanese watercolor techniques. Famous painting: **Bharat Mata (1905)**.` },
      { subject: "history", subjectName: "History NCERT", chNum: 32, id: "his-ch-32", book: "Book III: Modern Indian History (NCERT Class 8)", title: "32. The Making of the National Movement (1870s–1947)", readTime: "8 min read", examTags: "INC 1885, Swadeshi 1905, Non-Cooperation 1920, Civil Disobedience 1930, Quit India 1942", truth: "The Indian National Movement mobilized diverse social classes through constitutional agitation, mass non-violent resistance, and revolutionary struggles to achieve independence in 1947.", body: `### Early Phase & INC Founding:\n- Political Associations: Poona Sarvajanik Sabha (1870), Indian Association (1876).\n- **Indian National Congress (INC):** Founded in **December 1885** at Bombay by 72 delegates (A.O. Hume, W.C. Bonnerjee first President).\n- **Moderates (1885–1905):** Naoroji, Gokhale, Ranade (Prayer, Petition, Protest).\n- **Extremists (1905 Onward):** Lal-Bal-Pal (Lala Lajpat Rai, Bal Gangadhar Tilak *"Swaraj is my birthright"* , Bipin Chandra Pal).\n\n### Mass Movement Waves:\n1. **Swadeshi Movement (1905):** Triggered by Lord Curzon's **Partition of Bengal**.\n2. **Non-Cooperation Movement (1920–22):** Launched by Mahatma Gandhi following Rowlatt Act & Jallianwala Bagh massacre (1919). Suspended after **Chauri Chaura violence (1922)**.\n3. **Civil Disobedience Movement (1930):** Initiated with **Dandi Salt March (12 March – 6 April 1930)** breaking salt laws.\n4. **Quit India Movement (1942):** **8 August 1942** Bombay session (*"Do or Die"* call). Lead to Independence on **15 August 1947**.` },
      { subject: "history", subjectName: "History NCERT", chNum: 33, id: "his-ch-33", book: "Book III: Modern Indian History (NCERT Class 8)", title: "33. India After Independence (1947 Onward)", readTime: "7 min read", examTags: "Constituent Assembly, Integration of Princely States, States Reorganisation 1956, Planning Commission", truth: "Post-independence India established a constitutional secular democracy, integrated over 500 princely states, and adopted democratic planning to achieve socio-economic growth.", body: `### Core Challenges of Free India:\n1. **Refugee Rehabilitation:** 8 million refugees crossed borders after Partition.\n2. **Integration of Princely States:** Over 560 princely states integrated through diplomatic resolve of **Sardar Vallabhbhai Patel** (Junagadh, Hyderabad Operation Polo, Kashmir).\n\n### Constitutional & Economic Foundations:\n- **Constitution of India:** Drafted by Constituent Assembly under **Dr. B.R. Ambedkar** (Drafting Committee Chair). Adopted 26 Nov 1949, came into force **26 January 1950** (Universal Adult Franchise granted immediately).\n- **Linguistic Reorganisation:** Potti Sreeramulu's 58-day fast led to Andhra State creation (1953) $\\rightarrow$ **States Reorganisation Commission (Fazl Ali Commission 1953)** $\\rightarrow$ **States Reorganisation Act 1956** (14 States & 6 UTs).\n- **Foreign Policy & Economic Model:** Non-Aligned Movement (NAM - Nehru, Tito, Nasser); Mixed economy with Planning Commission (1950) establishing heavy basic industries.` },
      { subject: "history", subjectName: "History NCERT", chNum: 34, id: "his-ch-34", book: "Book IV: World History & Contemporary World (NCERT Class 9)", title: "34. The French Revolution (1789)", readTime: "7 min read", examTags: "French Revolution 1789, Three Estates, Declaration of Rights of Man, Jacobins, Robespierre, Napoleon", truth: "The French Revolution dismantled feudal absolutism, birth-based privileges, and divine right monarchy, giving rise to universal human rights, popular sovereignty, and constitutionalism.", body: `### Social Causes & 3 Estates:\n- **First Estate (Clergy) & Second Estate (Nobility):** Privileged classes owning 60% land, exempt from taxes.\n- **Third Estate (Commoners - 98% population):** Peasants, artisans, merchants who paid all taxes (*Taille* direct tax & *Tithe* church tax).\n\n### Revolution Timeline (1789–1999):\n- **14 July 1789:** Storming of the **Bastille** fortress-prison (symbol of feudal tyranny).\n- **Declaration of the Rights of Man and of the Citizen (1789):** Declared liberty, equality, and fraternity as natural rights.\n- **Reign of Terror (1793–94):** Maximilien Robespierre and the Jacobins guillotined thousands of perceived enemies.\n- **Rise of Napoleon Bonaparte (1799/1804):** Crowned Emperor of France, introduced Civil Code of 1804 (Napoleonic Code).` },
      { subject: "history", subjectName: "History NCERT", chNum: 35, id: "his-ch-35", book: "Book IV: World History & Contemporary World (NCERT Class 9)", title: "35. Socialism in Europe and the Russian Revolution", readTime: "7 min read", examTags: "Karl Marx Communist Manifesto, February & October Revolutions 1917, Lenin April Theses, Stalin Collectivisation", truth: "The Russian Revolution of 1917 established the world's first socialist state, driven by Marxist anti-capitalist ideology, land redistribution, and state-planned industrialization.", body: `### Rise of Socialist Ideology:\n- **Karl Marx & Friedrich Engels:** *The Communist Manifesto (1848)* advocated workers' overthrow of capitalist private property.\n\n### Two 1917 Revolutions:\n1. **February Revolution (1917):** Tsar Nicholas II abdicated; Petrograd Soviet and Provisional Government formed.\n2. **October Revolution (1917):** Vladimir Lenin and the **Bolsheviks** seized power (*"Peace, Land, Bread"*). Lenin published **April Theses** (end war, transfer land to peasants, nationalize banks).\n\n### Stalinist Era:\n- **Stalin's Collectivization (1929 Onward):** Forced peasants into collective farms (*Kolkhoz*); targeted rich peasants (*Kulaks*).` },
      { subject: "history", subjectName: "History NCERT", chNum: 36, id: "his-ch-36", book: "Book IV: World History & Contemporary World (NCERT Class 9)", title: "36. Nazism and the Rise of Hitler", readTime: "7 min read", examTags: "Weimar Republic, Treaty of Versailles, Fascism, Nuremberg Laws, Gestapo, Holocaust", truth: "Totalitarian Nazism exploited economic collapse, hyperinflation, and national humiliation under the Treaty of Versailles to build a racially discriminatory police state that executed state-sponsored genocide.", body: `### Weimar Defeat & Treaty of Versailles (1919):\n- Germany forced to sign humiliating treaty losing 13% territory, 75% iron ore, and paying £6.6 billion war reparations.\n- **Hyperinflation (1923):** German Mark collapsed; US Dawes Plan offered temporary bailout.\n\n### Hitler's Dictatorship & Ideology:\n- **Enabling Act (March 1933):** Gave Hitler dictatorial powers to bypass parliament.\n- **Racial State & Holocaust:** Concept of *Lebensraum* (living space) and Nordic Aryan supremacy. **Nuremberg Laws (1935)** stripped Jews of citizenship. Gas chambers at Auschwitz-Birkenau murdered 6 million Jews.` },
      { subject: "history", subjectName: "History NCERT", chNum: 37, id: "his-ch-37", book: "Book IV: World History & Contemporary World (NCERT Class 9)", title: "37. Forest Society and Colonialism", readTime: "6 min read", examTags: "Dietrich Brandis, Scientific Forestry, Indian Forest Act 1878, Bastar Rebellion 1910, Samin Movement Java", truth: "Colonial timber exploitation criminalized traditional forest communities under 'scientific forestry,' triggering indigenous resistance movements in Bastar and Java.", body: `### Rise of Commercial Forestry:\n- **Dietrich Brandis:** German expert appointed first Inspector General of Forests in India; established **Imperial Forest Research Institute at Dehradun (1906)**.\n- **Indian Forest Act (1878):** Divided forests into Reserved (most restricted), Protected, and Village forests. Banned *Jhum* (shifting cultivation).\n\n### Indigenous Rebellions:\n- **Bastar Rebellion (1910):** Led by **Gunda Dhur** in Kanger forest against forest reservations; rebels circulated mango twigs and lump of earth.\n- **Samin Movement of Java (Indonesia):** Surontiko Samin led Dutch East Indies peasants refusing to pay taxes or leave reserved teak forests.` },
      { subject: "history", subjectName: "History NCERT", chNum: 38, id: "his-ch-38", book: "Book IV: World History & Contemporary World (NCERT Class 9)", title: "38. Pastoralists in the Modern World", readTime: "6 min read", examTags: "Bakarwals, Raikas, Dhangars, Criminal Tribes Act 1871, Grazing Tax, Maasai East Africa", truth: "Colonial borders, agricultural expansion, and punitive grazing taxes severely restricted nomadic pastoral routes, forcing pastoralists to adapt through alternative wage labor and altered migratory cycles.", body: `### Pastoral Communities of India:\n- **Gujjars & Bakarwals (J&K):** Mountain transhumance between low hills in winter and high Bugyals in summer.\n- **Dhangars (Maharashtra):** Pastoral weavers moving between semi-arid central plateau and monsoon coastal Konkan.\n- **Raikas (Rajasthan):** Camel and sheep pastoralists in Thar desert.\n\n### Colonial Disruption:\n- **Waste Land Rules & Grazing Tax:** Declared uncultivated pastures 'waste' and taxed every head of livestock.\n- **Criminal Tribes Act (1871):** Classified nomadic craftspersons and pastoralists as inherent criminals.\n- **Maasai of East Africa:** Lost 60% prime grazing land to British Kenya and German Tanganyika game reserves (Serengeti, Samburu).` },
      { subject: "history", subjectName: "History NCERT", chNum: 39, id: "his-ch-39", book: "Book IV: World History & Contemporary World (NCERT Class 9)", title: "39. Peasants and Farmers (Agrarian Transformation)", readTime: "6 min read", examTags: "English Enclosure Movement, American Dust Bowl 1930s, Opium Trade & Canton System", truth: "Global capitalist agriculture transformed peasant economies through the English Enclosure Movement, mechanized dust bowl cultivation in America, and forced colonial opium farming in India.", body: `### 3 Global Case Studies:\n1. **English Enclosure Movement:** Open fields enclosed by landlords for commercial wool and wheat production; drove poor cottagers into industrial cities. **Captain Swing Riots (1830)** smashed mechanized threshing machines.\n2. **American West & The Dust Bowl (1930s):** Over-ploughing of Great Plains with tractor combines destroyed native prairie grasses, creating catastrophic dust storms during droughts.\n3. **Opium Trade with China:** EIC forced Indian peasants in Bengal and Bihar to cultivate **Opium** under state monopoly to trade with China for tea via Canton.` },
      { subject: "history", subjectName: "History NCERT", chNum: 40, id: "his-ch-40", book: "Book IV: World History & Contemporary World (NCERT Class 9)", title: "40. History, Sport and Clothing (Cricket & Social Change)", readTime: "6 min read", examTags: "MCC 1787, Bombay Gymkhana, Palwankar Baloo, Sumptuary Laws, Swadeshi Clothing", truth: "Sports and clothing reflected colonial racial hierarchies, class divisions, and nationalist resistance, as seen in the Indianization of cricket and the Swadeshi boycott of foreign cloth.", body: `### Social History of Sport (Cricket):\n- Originated as English village game; codified by **Marylebone Cricket Club (MCC 1787)**.\n- **Cricket in India:** First played by Parsis (**Oriental Cricket Club 1848**). Evolved into **Bombay Quadrangular tournament** (Hindus, Muslims, Parsis, Europeans). **Palwankar Baloo** (Dalit spin bowler) broke caste barriers.\n\n### Social History of Clothing:\n- **Sumptuary Laws (Medieval Europe):** Strict legal restrictions on clothing fabrics based on social rank.\n- **Swadeshi Clothing:** Mahatma Gandhi made **Khadi** (hand-spun cotton) the national symbol of self-reliance and anti-colonial resistance.` },
      { subject: "history", subjectName: "History NCERT", chNum: 41, id: "his-ch-41", book: "Book V: Modern World & Nationalism (NCERT Class 10)", title: "41. The Rise of Nationalism in Europe", readTime: "7 min read", examTags: "Metternich, Bismarck Blood & Iron, Garibaldi, Cavour, Zollverein, Allegories", truth: "19th-century European nationalism replaced multi-ethnic dynastic empires with unified nation-states built on shared linguistic, cultural, and political identity.", body: `### Key Unifications & Movements:\n- **Zollverein (1834):** German customs union initiated by Prussia that abolished tariff barriers and created economic unity across 39 German states.\n- **Unification of Germany (1866–1871):** Architect **Otto von Bismarck** pursued policy of *"Blood and Iron"*, winning three wars in 7 years against Denmark, Austria, and France. King Wilhelm I proclaimed German Emperor at Palace of Versailles (Jan 1871).\n- **Unification of Italy (1859–1870):** Spearheaded by **Count Cavour** (diplomacy), **Giuseppe Garibaldi** (*Red Shirts* expedition of the Thousand to South Italy/Sicily), and **Giuseppe Mazzini** (*Young Italy*).\n\n<div class="exam-highlight-box">\n  <h4>🎨 National Allegories</h4>\n  • <strong>Marianne:</strong> Female allegory of the French Republic representing Liberty and Reason (red cap, tricolor, cockade).<br>\n  • <strong>Germania:</strong> Allegory of the German nation wearing a crown of oak leaves (oak stands for heroism).\n</div>` },
      { subject: "history", subjectName: "History NCERT", chNum: 42, id: "his-ch-42", book: "Book V: Modern World & Nationalism (NCERT Class 10)", title: "42. Nationalism in India (Advanced Analytical Synthesis)", readTime: "8 min read", examTags: "Non-Cooperation, Civil Disobedience, Rowlatt Act, Dandi March, Poona Pact", truth: "Indian nationalism synthesized anti-colonial economic grievances, Gandhian Satyagraha, and multi-class mobilization into a unified anti-imperialist movement.", body: `### World War I Impact & Rowlatt Satyagraha:\n- WW1 created economic hardship: doubled defense expenditure, forced recruitment in villages, price inflation, crop failure, and Spanish Flu pandemic (12–13 million deaths).\n- **Rowlatt Act (1919):** Allowed detention of political prisoners without trial for 2 years. Led to **Jallianwala Bagh Massacre (13 April 1919)** under General Dyer.\n\n### Non-Cooperation to Civil Disobedience:\n- **Non-Cooperation Movement (1920–22):** United with Khilafat Committee (Ali Brothers). Surrender of titles, boycott of schools, courts, and foreign cloth.\n- **Civil Disobedience Movement (1930):** Sparked by **Dandi March (12 March - 6 April 1930)** breaking the Salt Law. Featured participation of women, rich peasants (Patidars of Gujarat, Jats of UP), and industrial workers.\n- **Poona Pact (Sept 1932):** Agreement between Mahatma Gandhi and Dr. B.R. Ambedkar abandoning separate electorates for Depressed Classes in favor of reserved seats in joint electorates.` },
      { subject: "history", subjectName: "History NCERT", chNum: 43, id: "his-ch-43", book: "Book V: Modern World & Nationalism (NCERT Class 10)", title: "43. The Making of a Global World (Globalisation History)", readTime: "7 min read", examTags: "Silk Routes, Rinderpest Plague, Great Depression 1929, Bretton Woods System", truth: "Global economic integration evolved through ancient trade routes, colonial indentured labor migrations, the Great Depression, and the post-WWII Bretton Woods financial system.", body: `### Pre-Modern to Inter-War Global Integration:\n- **Rinderpest (Cattle Plague) in Africa (1890s):** Carried by infected cattle imported from British Asia; killed 90% of African cattle, destroying pastoral livelihoods and forcing Africans into wage labor for colonizers.\n- **Indentured Labor Migration:** System of forced labor contracts (*"new system of slavery"*) transporting Indian laborers to Caribbean (Trinidad, Guyana, Suriname), Mauritius, and Fiji.\n\n### The Great Depression (1929–1930s) & Bretton Woods:\n- **Great Depression:** Triggered by US stock market crash (Oct 1929) and agricultural overproduction. World trade fell by 50–60%; Indian agricultural exports collapsed.\n- **Bretton Woods Conference (1944):** Established the **IMF** and **World Bank (IBRD)** to maintain international financial stability and finance post-war reconstruction based on fixed exchange rates anchored to USD ($35 per ounce of gold).` },
      { subject: "history", subjectName: "History NCERT", chNum: 44, id: "his-ch-44", book: "Book V: Modern World & Nationalism (NCERT Class 10)", title: "44. The Age of Industrialisation & Print Culture", readTime: "7 min read", examTags: "Proto-industrialisation, Jobbers, Gutenberg Press, Vernacular Press Act 1878", truth: "Print technology democratized information and spurred public debates, while industrialization shifted manufacturing from cottage proto-industries to mechanized factories.", body: `### 1. The Age of Industrialisation:\n- **Proto-industrialisation:** Phase of large-scale international industrial production controlled by merchants before the advent of factories.\n- **The Jobber:** Trusted old worker employed by industrialists to recruit new workers from villages, securing loyalty and control.\n\n### 2. Print Culture & Public Sphere:\n- **Johannes Gutenberg (1440s):** Invented movable type printing press in Mainz, Germany; first book printed was the **Bible**.\n- **Print & Indian Reform:** Print enabled intense religious and social debates (*Sambad Kaumudi* by Ram Mohan Roy in 1821 vs *Samachar Chandrika* conservative orthodox organ).\n- **Vernacular Press Act (1878):** Passed under Lord Lytton modeled on Irish Press Laws; gave colonial government right to censor reports and confiscate presses publishing seditious material.` },
      { subject: "history", subjectName: "History NCERT", chNum: 45, id: "his-ch-45", book: "Book VI: Themes in World History (NCERT Class 11)", title: "45. Writing and City Life (Mesopotamia & Cuneiform)", readTime: "6 min read", examTags: "Mesopotamia, Sumer, Akkad, Cuneiform, Ziggurat, Hammurabi's Code", truth: "Mesopotamian urbanization between the Tigris and Euphrates rivers established the world's first cities, cuneiform writing, mathematical sexagesimal systems, and codified legal systems.", body: `### Mesopotamian Urban Features:\n- **Geography:** Located between **Tigris and Euphrates rivers** (modern Iraq). Southern region = Sumer and Akkad; later Babylonia.\n- **Cuneiform Script:** Wedge-shaped symbols pressed onto damp clay tablets with reeds (~3200 BCE). Used for tax records, legal codes, and epic literature (**Epic of Gilgamesh**).\n\n<div class="exam-highlight-box">\n  <h4>🏛️ Architecture & Law</h4>\n  • <strong>Ziggurats:</strong> Stepped temple towers dedicated to patron city gods (e.g. Inanna goddess of love/war, Nanna moon god at Ur).<br>\n  • <strong>Code of Hammurabi (c. 1750 BCE):** 282 laws inscribed on a basalt stele establishing legal precedent (*"an eye for an eye"*).\n</div>` },
      { subject: "history", subjectName: "History NCERT", chNum: 46, id: "his-ch-46", book: "Book VI: Themes in World History (NCERT Class 11)", title: "46. An Empire Across Three Continents (Roman Empire)", readTime: "7 min read", examTags: "Pax Romana, Augustus, Senate, Principate, Slavery, Amphorae", truth: "The Roman Empire connected Europe, North Africa, and the Middle East around the Mediterranean Sea, sustained by bureaucratic administration, trade networks, and slave labor.", body: `### Political Structure & Evolution:\n- **Territorial Span:** Stretched across **Europe, North Africa, and West Asia** (Mediterranean Sea called *Mare Nostrum* - "Our Sea").\n- **Principate System:** Established by **Augustus (27 BCE)**, first emperor (*Princeps* = leading citizen), preserving nominal authority of the **Senate**.\n\n### Economy & Slavery:\n- **Trade Goods:** Olive oil and wine transported in **Amphorae** clay containers (Dressel 20 type).\n- **Slave Labor:** Slaves treated as economic property (*instrumentum vocale* = speaking tools) forming core workforce in mines, agriculture, and domestic service.` },
      { subject: "history", subjectName: "History NCERT", chNum: 47, id: "his-ch-47", book: "Book VI: Themes in World History (NCERT Class 11)", title: "47. Nomadic Empires (Genghis Khan & The Mongols)", readTime: "6 min read", examTags: "Genghis Khan, Yasa Code, Yam Courier System, Kurultai", truth: "Genghis Khan united nomadic steppe tribes into a trans-continental empire operating a sophisticated postal courier network and a unified customary law code.", body: `### Genghis Khan (Temujin - 1162–1227):\n- United pastoral nomadic tribes of Central Asian steppes; proclaimed **Universal Khan (Genghis Khan)** at the **Kurultai (assembly of chieftains)** in **1206**.\n\n### Administrative Innovations:\n- **Yasa:** Legal code compiled by Genghis Khan regulating army discipline, tax exemptions for clergy, and hunting rules.\n- **Yam (Courier System):** High-speed horse relay postal system connecting distant outposts across Eurasia.\n- **Pax Mongolica:** Period of Eurasian stability enabling safe overland trade along the Silk Route.` },
      { subject: "history", subjectName: "History NCERT", chNum: 48, id: "his-ch-48", book: "Book VI: Themes in World History (NCERT Class 11)", title: "48. The Three Orders & Renaissance (Feudal Europe)", readTime: "7 min read", examTags: "Feudalism, Three Orders, Manorial System, Black Death 1347, Humanism", truth: "Medieval European feudalism structured society into Clergy, Nobility, and Peasantry, which was dismantled by the 14th-century Black Death and the intellectual Renaissance.", body: `### The Three Orders:\n1. **First Order (The Clergy):** Catholic Church headed by Pope; owned 1/10th land; collected *Tithe* tax.\n2. **Second Order (The Nobility):** Vassalage system; lords owned vast **Manorial estates** worked by serfs.\n3. **Third Order (Peasants & Serfs):** Free peasants and unfree **Serfs** tied to the land.\n\n### Crisis & Renaissance Transformation:\n- **Black Death (1347–1351):** Bubonic plague killed 30–50% of Europe's population, creating severe labor shortages and destroying serfdom.\n- **The Renaissance (14th–17th Century):** Movement originating in Italian city-states (Florence, Venice). Championed **Humanism** (Petrarch, Erasmus), art (Da Vinci, Michelangelo), and scientific enquiry (Copernicus, Galileo).` },
      { subject: "history", subjectName: "History NCERT", chNum: 49, id: "his-ch-49", book: "Book VI: Themes in World History (NCERT Class 11)", title: "49. Confrontation of Cultures & Displacing Indigenous Peoples", readTime: "7 min read", examTags: "Aztecs, Incas, Conquistadors, Encomienda, Trail of Tears, Terra Nullius", truth: "European imperial expansion into the Americas and Australia decimated indigenous civilizations through European diseases, forced land dispossessions, and colonial doctrines.", body: `### Mesoamerican Civilizations & Spanish Conquest:\n- **Aztecs (Mexico):** Capital **Tenochtitlan**; sophisticated chinampa floating agriculture. Conquered by **Hernan Cortes (1519–1521)**.\n- **Incas (Peru/Andes):** Capital **Cuzco**; quipu knot record system. Conquered by **Francisco Pizarro (1532)**.\n- **Colonial Dispossession:** Encomienda system forced indigenous labor in silver mines (Potosi).\n\n### Dispossession in North America & Australia:\n- **Trail of Tears (1838–39):** Forced relocation of Cherokee Nation in US to Oklahoma; thousands died.\n- **Terra Nullius (Australia):** British doctrine declaring Australia "land belonging to no one," delegitimizing Aboriginal land rights for 200 years.` },
      { subject: "history", subjectName: "History NCERT", chNum: 50, id: "his-ch-50", book: "Book VI: Themes in World History (NCERT Class 11)", title: "50. Paths to Modernisation (Japan & China)", readTime: "7 min read", examTags: "Meiji Restoration 1868, Sun Yat-sen, May Fourth Movement, Mao Zedong Long March", truth: "East Asian nations pursued distinct paths to modernization: Japan through rapid state-led industrialization (Meiji), and China through republican revolution and socialist transformation.", body: `### 1. Japan's Meiji Restoration (1868):\n- Overthrew Tokugawa Shogunate; restored Emperor Meiji.\n- Slogan: *"Fukoku Kyohei"* (Enrich the Country, Strengthen the Military).\n- Industrialization, compulsory schooling, railway network, adoption of Western Meiji Constitution (1889).\n\n### 2. China's Revolutionary Paths:\n- **1911 Revolution:** **Sun Yat-sen** overthrew Qing Dynasty; established Republic of China based on Three Principles (*San Min Chu I*: Nationalism, Democracy, People's Livelihood).\n- **May Fourth Movement (1919):** Intellectual anti-imperialist protest in Beijing.\n- **Chinese Communist Party (CCP):** **Mao Zedong** organized rural peasantry; led the 6,000-mile **Long March (1934–35)**; established People's Republic of China on **1 October 1949**.` },
      { subject: "history", subjectName: "History NCERT", chNum: 51, id: "his-ch-51", book: "Book VII: Themes in Indian History Master Synthesis (NCERT Class 12)", title: "51. Bricks, Beads and Bones (Harappan Advanced Synthesis)", readTime: "8 min read", examTags: "Harappan Excavations, John Marshall, Citadel, Lothal Dockyard, Meluhha Trade", truth: "The Harappan Civilisation represented South Asia's apex early Bronze Age urban planning, international maritime trade networks, and standardized civic administration.", body: `### Excavation History & Chronology:\n- **Key Archaeologists:** Daya Ram Sahni (Harappa 1921), R.D. Banerji (Mohenjo-Daro 1922), Sir John Marshall (announced to world 1924), Sir Mortimer Wheeler (grid excavation & citadel ramparts).\n- **Mature Harappan Phase:** c. 2600–1900 BCE.\n\n### Advanced Craft & Long-Distance Trade:\n- **Bead-Making Centres:** Chanhudaro and Lothal (carnelian, jasper, steatite, lapis lazuli from Shortughai, Afghanistan).\n- **Mesopotamian Texts:** Refer to Harappa as **Meluhha**; mention products like timber, carnelian, lapis lazuli, gold, and peacocks (*Haja-bird*).` },
      { subject: "history", subjectName: "History NCERT", chNum: 52, id: "his-ch-52", book: "Book VII: Themes in Indian History Master Synthesis (NCERT Class 12)", title: "52. Early States, Kinship, Caste & Belief Buildings (600 BCE–600 CE)", readTime: "8 min read", examTags: "James Prinsep Brahmi, Asokan Edicts, Manusmriti Varna, Sanchi Stupa, Mahavira & Buddha", truth: "The first millennium BCE witnessed political consolidation into 16 Mahajanapadas, codification of Varna social order in Manusmriti, and monumental stupa architecture.", body: `### Decipherment of Brahmi & Kharosthi:\n- **James Prinsep (1837):** Deciphered Brahmi and Kharosthi scripts used in Ashokan edicts, identifying king **Piyadasi** (Ashoka).\n\n### Varna & Kinship Rules:\n- **Manusmriti (c. 200 BCE–200 CE):** Codified 4 Varnas (Brahmana, Kshatriya, Vaishya, Shudra) and 8 forms of marriage (Endogamy vs Exogamy).\n\n### Monumental Architecture:\n- **Sanchi Stupa (Bhopal, MP):** Preserved due to intervention of Begums of Bhopal (Shahjehan Begum and Sultan Jehan Begum) providing funds for museum and guesthouse.` },
      { subject: "history", subjectName: "History NCERT", chNum: 53, id: "his-ch-53", book: "Book VII: Themes in Indian History Master Synthesis (NCERT Class 12)", title: "53. Through the Eyes of Travellers (Al-Biruni, Ibn Battuta, Bernier)", readTime: "8 min read", examTags: "Al-Biruni Kitab-ul-Hind, Ibn Battuta Rihla, Francois Bernier Travels in Mughal Empire", truth: "Foreign travelogues provide indispensable external perspectives on medieval Indian society, land ownership, caste barriers, and urban economies.", body: `### 3 Master Travellers:\n1. **Al-Biruni (11th Century - Uzbekistan):** Visited India with Mahmud of Ghazni. Wrote **Kitab-ul-Hind** in Arabic. Detailed analysis of Sanskrit texts, caste system, and social barriers (*halalkhoran*).\n2. **Ibn Battuta (14th Century - Morocco):** Globe-trotter who visited Delhi during Muhammad bin Tughluq's reign. Wrote **Rihla** in Arabic. Described efficient postal system (*Uluq* horse post & *Dawa* foot post) and vibrant bazaar cities.\n3. **Francois Bernier (17th Century - France):** Physician to Prince Dara Shikoh. Wrote *Travels in the Mughal Empire*. Posited flawed thesis that Crown ownership of land destroyed private property in Asia.` },
      { subject: "history", subjectName: "History NCERT", chNum: 54, id: "his-ch-54", book: "Book VII: Themes in Indian History Master Synthesis (NCERT Class 12)", title: "54. Bhakti-Sufi Traditions & Vijayanagara Imperial Capital", readTime: "8 min read", examTags: "Basavanna Virashaivism, Vitthala Temple, Krishnadevaraya, Mahanavami Dibba, Amara-Nayaka", truth: "Medieval southern India combined egalitarian Bhakti movements like Virashaivism with the fortified urban splendour and military bureaucracy of the Vijayanagara Empire.", body: `### 1. Basavanna's Virashaiva Movement:\n- Founded in 12th century Karnataka by **Basavanna** (minister at Kalachuri court). Followers called *Lingayats* (wearers of Linga). Rejected Varna, rebirth, and child marriage; advocated post-puberty marriage and widow remarriage.\n\n### 2. Vijayanagara Empire (1336–1565):\n- Founded by brothers **Harihara I and Bukka I** in 1336. Greatest emperor: **Krishnadevaraya** (Tuluva Dynasty 1509–1529; authored *Amuktamalyada* in Telugu).\n- **Amara-Nayaka System:** Military commanders given territories (*amaram*) to collect revenue and maintain military contingents for the king.\n- **Architecture:** Sacred centre (Virupaksha & Vitthala temples with musical pillars) and Royal Centre (**Mahanavami Dibba** platform). Defeated at **Battle of Talikota / Rakshasi-Tangadi (1565)**.` },
      { subject: "history", subjectName: "History NCERT", chNum: 55, id: "his-ch-55", book: "Book VII: Themes in Indian History Master Synthesis (NCERT Class 12)", title: "55. Agrarian Society under Mughals & Colonial Countryside", readTime: "8 min read", examTags: "Ain-i-Akbari, Khud-kashta vs Pahi-kashta, Sunset Law, Fifth Report 1812", truth: "Colonial land settlements replaced traditional Mughal agrarian customary rights with rigid revenue demands, leading to widespread peasant dispossession and anti-zamindari resistance.", body: `### Mughal Agrarian Society:\n- Documented in Abul Fazl's **Ain-i-Akbari**.\n- **Peasant Categories:** *Khud-kashta* (residents of same village owning land) vs *Pahi-kashta* (non-resident tenant cultivators).\n\n### Colonial Countryside & Archives:\n- **Sunset Law:** If zamindar failed to pay revenue by sunset of specified date, estate was auctioned.\n- **Fifth Report (1812):** Submitted to British Parliament reviewing East India Company administration in Bengal, detailing zamindari distress and revenue sales.` },
      { subject: "history", subjectName: "History NCERT", chNum: 56, id: "his-ch-56", book: "Book VII: Themes in Indian History Master Synthesis (NCERT Class 12)", title: "56. Rebels & the Raj, Colonial Cities & Gandhian Mass Movements", readTime: "8 min read", examTags: "1857 Representations, Neo-Gothic Bombay, Salt March 1930, Quit India 1942", truth: "Anti-colonial resistance progressed from traditional armed mutinies in 1857 to nationwide Gandhian non-violent mass satyagraha movements that mobilized millions.", body: `### Representations of 1857:\n- British paintings (Sir Joseph Noel Paton's *In Memoriam*) depicted British women as innocent victims needing protection; Indian folk ballads celebrated Rani of Jhansi (*"Khoob ladi mardani woh toh Jhansi wali rani thi"*).\n\n### Architectural Styles in Colonial Cities:\n- **Neo-Gothic Style:** High pitched roofs, pointed arches, detailed wood carvings (Victoria Terminus / CST Station in Mumbai).\n- **Indo-Saracenic Style:** Blended Indian domes, arches, and minarets with European structures (Gateway of India, Taj Mahal Palace Hotel).\n\n### Gandhian Mass Movements:\n- **Salt March (1930):** Elevated salt (used by rich and poor alike) into a universal anti-colonial symbol.\n- **Quit India Movement (1942):** Underground networks run by Jayaprakash Narayan, Aruna Asaf Ali, and Usha Mehta (secret radio).` },
      { subject: "history", subjectName: "History NCERT", chNum: 57, id: "his-ch-57", book: "Book VII: Themes in Indian History Master Synthesis (NCERT Class 12)", title: "57. Understanding Partition & Framing the Indian Constitution", readTime: "8 min read", examTags: "Direct Action Day 1946, Mountbatten Plan, Constituent Assembly Debates, Article 370, Objective Resolution", truth: "India achieved independence alongside the tragic trauma of Partition, while the Constituent Assembly forged a sovereign democratic constitution balancing unity, federalism, and fundamental rights.", body: `### Partition Trauma (1946–1947):\n- **Direct Action Day (16 August 1946):** Called by Muslim League; led to Great Calcutta Killings.\n- **Mountbatten Plan (3 June 1947):** Formulated partition of British India into India and Pakistan.\n- Mass migration of ~15 million people across borders; 1 million killed in communal carnage.\n\n### Framing the Indian Constitution (1946–1949):\n- **Constituent Assembly:** Met first on 9 Dec 1946. Jawaharlal Nehru moved the **Objectives Resolution** on 13 Dec 1946.\n- **Key Debates:** Strong Centre vs State Autonomy (B.R. Ambedkar & Jawaharlal Nehru favored strong Centre to maintain national integrity); Language debate (Hindi vs English vs Regional languages $\\rightarrow$ Hindi as official language, English retained for official work).\n- **26 November 1949:** Constitution adopted by Assembly; came into full force on **26 January 1950**.` },
